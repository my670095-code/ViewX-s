<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<body>

<!-- LOGIN -->
<div id="loginScreen" class="login-wrap">
    <div class="login-card">
        <div class="login-brand">
            <img src="https://placehold.co/400x90/1a7a4c/ffffff?text=ViewX+%7C+Powered By+Yousuf"

                 class="login-brand-img">
        </div>

        <div class="login-sub">Sign in to continue</div>
        <div id="loginError" class="login-error"></div>

        <div class="field">
            <label>Username</label>
            <input type="text" id="loginUser" placeholder="Username">
        </div>
        <div class="field">
            <label>Password</label>
            <input type="password" id="loginPass" placeholder="Password">
        </div>

        <button class="login-btn" onclick="doLogin()">Sign In</button>
    </div>
</div>

<!-- APP -->
<div id="appScreen" style="display:none">
<div class="sidebar" id="sidebar">
    <div class="logo"><span>ViewX</span> ERP</div>
    <div id="sidebarMenu"></div>
</div>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<div class="main">
<div class="topbar">
    <button class="hamburger" id="hamburgerBtn" aria-label="Toggle sidebar">
        <span></span><span></span><span></span>
    </button>
    <div class="page-title" id="pageTitle">Dashboard</div>

            <div class="avatar" id="userAvatar">—</div>
            <button class="logout-btn" onclick="doLogout()">Logout</button>
        </div>
    </div>
    <div class="content"><div id="pageContainer"></div></div>
</div>
</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalBox">

        <div class="modal-footer" id="modalFooter"></div>

/* ---------- HELPERS ---------- */
function uid(p){ return p+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function nowISO(){ return new Date().toISOString(); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function fmtNum(n){ return Number(n||0).toFixed(2); }
function norm(s){ return String(s||'').trim().toLowerCase(); }

let DB = null;
function isValidData(d){
    return d && typeof d==='object'
        && Array.isArray(d.users) && d.users.length > 0
        && Array.isArray(d.stores) && Array.isArray(d.items)
        && Array.isArray(d.journals) && Array.isArray(d.closedMonths)
        && d.users.every(u => u && u.username && u.pass);
}
async function loadData(){
    if (CLOUD_MODE === 'supabase') {
        return await DataLayer.loadAll();
    }
    LEGACY_KEYS.forEach(k => { if (localStorage.getItem(k)) localStorage.removeItem(k); });
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
            const p = JSON.parse(raw);
            if (isValidData(p)) {
                if (!Array.isArray(p.voidedRecords)) p.voidedRecords = [];
                if (!Array.isArray(p.employees)) p.employees = [];
                if (!Array.isArray(p.salesUploads)) p.salesUploads = [];
                if (!Array.isArray(p.consumptionLedger)) p.consumptionLedger = [];
                if (!Array.isArray(p.transfers)) p.transfers = [];
                delete p.adjustments;
                return p;
            }
            localStorage.removeItem(STORAGE_KEY);
        }
    } catch(e) { localStorage.removeItem(STORAGE_KEY); }
    const fresh = defaultData();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(fresh));
    return fresh;
}
function saveData(){
    if (!DB) return;
    DB.meta.lastSaved = nowISO();
    if (CLOUD_MODE === 'supabase') return;   // cloud writes happen explicitly per mutation
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }
    catch(e) { toast('Storage full!', 'error'); }
}

        const ids = js.map(j => j.id);
        const { data: lines, error: e2 } = await SB.from('journal_lines')
            .select('*').in('journal_id', ids);
        if (e2) throw e2;
        return js.map(j => ({
            id: j.id, type: j.type, date: j.date, month: j.month, week: j.week,
            storeId: j.store_id, byId: j.by_id, byName: j.by_name,
            status: j.status, createdAt: j.created_at,
            lines: (lines || []).filter(l => l.journal_id === j.id).map(l => ({
                itemId: l.item_id, uom: l.uom,
                opening: Number(l.opening), purchases: Number(l.purchases),
                transfersIn: Number(l.transfers_in), transfersOut: Number(l.transfers_out),
                consumption: Number(l.consumption), expected: Number(l.expected),
                physical: Number(l.physical), variance: Number(l.variance),
                mtdPurchases: Number(l.mtd_purchases), mtdConsumption: Number(l.mtd_consumption)
            }))
        }));
    },

    subscribeToChanges(user, onJournalChange, onTransferChange) {
        if (CLOUD_MODE === 'local' || !SB) return null;
        const storeIds = getMyStores(user);
        if (storeIds.length === 0) return null;
        const ch = SB.channel('erp-live')
            .on('postgres_changes',
                { event: '*', schema: 'public', table: 'journals',
                  filter: `store_id=in.(${storeIds.join(',')})` },
                p => onJournalChange(p))
            .on('postgres_changes',
                { event: '*', schema: 'public', table: 'transfers',
                  filter: `from_store_id=in.(${storeIds.join(',')})` },
                p => onTransferChange(p))
            .subscribe();
        return ch;
    }
};

function nextMovementId(prefix, collection, dateStr){
    const [y,m,d] = dateStr.split('-');
    const tag = d + m + y;
    const full = `${prefix}-${tag}-`;
    let max = 0;
    collection.forEach(x => {
        if (x.id && x.id.startsWith(full)) {
            const n = parseInt(x.id.slice(full.length), 10);
            if (!isNaN(n) && n > max) max = n;
        }
    });
    return full + String(max + 1).padStart(4, '0');
}
function nextJournalNo(prefix, dateStr){ return nextMovementId(prefix, DB.journals, dateStr); }

function getDeleteBlockers(entityType, id){
    const blockers = [];
    if (entityType === 'store') {
        const j = DB.journals.filter(x => x.storeId===id);
        if (j.length) blockers.push({ type:'Journal', count:j.length, preview:j.slice(0,5).map(x=>x.id) });
        const o = DB.openingStock.filter(x => x.storeId===id);
        if (o.length) blockers.push({ type:'Opening Stock', count:o.length, preview:o.slice(0,5).map(x=>x.id) });
        const p = DB.purchases.filter(x => x.storeId===id);
        if (p.length) blockers.push({ type:'Purchase', count:p.length, preview:p.slice(0,5).map(x=>x.id) });
        const s = DB.salesUploads.filter(x => x.storeId===id);
        if (s.length) blockers.push({ type:'Sales Upload', count:s.length, preview:s.slice(0,5).map(x=>x.id) });
    }
    if (entityType === 'item') {
        const item = getItem(id);
        if (item) {
            const bomUsing = DB.bom.filter(b => (b.lines||[]).some(l => l.itemId === id));
            if (bomUsing.length) blockers.push({ type:'BOM', count:bomUsing.length, preview:bomUsing.slice(0,5).map(b=>b.productId) });
            const journals = DB.journals.filter(j => j.lines.some(l => l.itemId===id));
            if (journals.length) blockers.push({ type:'Journal', count:journals.length, preview:journals.slice(0,5).map(j=>j.id) });
        }
    }
    if (entityType === 'employee') {
        const emp = getEmployee(id);
        if (emp) {
            const asSM = DB.stores.filter(s => norm(s.storeManagerName) === norm(emp.name));
            if (asSM.length) blockers.push({ type:'Store (Store Manager)', count:asSM.length, preview:asSM.slice(0,5).map(s=>s.code) });
            const asArea = DB.stores.filter(s => norm(s.areaManagerName) === norm(emp.name));
            if (asArea.length) blockers.push({ type:'Store (Area Manager)', count:asArea.length, preview:asArea.slice(0,5).map(s=>s.code) });
            const asOp = DB.stores.filter(s => norm(s.operationManagerName) === norm(emp.name));
            if (asOp.length) blockers.push({ type:'Store (Op Manager)', count:asOp.length, preview:asOp.slice(0,5).map(s=>s.code) });
        }
    }
    if (entityType === 'journal') {
        const j = DB.journals.find(x => x.id===id);
        if (j) {
            const later = DB.journals.filter(x => x.id !== id && x.storeId === j.storeId && x.status === 'Submitted' && x.createdAt > j.createdAt);
            if (later.length) blockers.push({ type:'Later Journal', count:later.length, preview:later.slice(0,5).map(x=>x.id) });
            if (isMonthClosed(j.storeId, j.month)) blockers.push({ type:'Closed Month', count:1, preview:[j.month] });
        }
    }
    if (entityType === 'openingStock') {
        const o = DB.openingStock.find(x => x.id===id);
        if (o) {
            const monthJournals = DB.journals.filter(j => j.storeId === o.storeId && j.month === o.month && j.status === 'Submitted');
            if (monthJournals.length) blockers.push({ type:'Journal', count:monthJournals.length, preview:monthJournals.slice(0,5).map(j=>j.id) });
            if (isMonthClosed(o.storeId, o.month)) blockers.push({ type:'Closed Month', count:1, preview:[o.month] });
        }
    }
    if (entityType === 'transfer') {
        const t = DB.transfers.find(x => x.id===id);
        if (t && t.status === 'Approved') blockers.push({ type:'Approved Transfer', count:1, preview:[t.id] });
    }
    return blockers;
}
async function softDelete(entityType, id, reason){
    const reg = ENTITIES[entityType];
    if (!reg) return false;
    const col = DB[reg.key];
    const idx = col.findIndex(x => x.id === id);
    if (idx < 0) return false;
    const record = col[idx];

    if (CLOUD_MODE === 'supabase') {
        try {
            if (entityType === 'journal') {
                await SB.from('journal_lines').delete().eq('journal_id', id);
                await SB.from('journals').delete().eq('id', id);
            } else if (entityType === 'salesUp') {
                const { data: ledgerRow } = await SB.from('consumption_ledger').select('id').eq('upload_ref', id).single();
                if (ledgerRow?.id) {
                    await SB.from('consumption_ledger_lines').delete().eq('ledger_id', ledgerRow.id);
                }
                await SB.from('consumption_ledger').delete().eq('upload_ref', id);
                await SB.from('sales_upload_lines').delete().eq('upload_id', id);
                await SB.from('sales_uploads').delete().eq('id', id);
            } else if (entityType === 'openingStock') {
                await SB.from('opening_stock_lines').delete().eq('opening_id', id);
                await SB.from('opening_stock').delete().eq('id', id);
            } else if (entityType === 'purchase') {
                await SB.from('purchase_lines').delete().eq('purchase_id', id);
                await SB.from('purchases').delete().eq('id', id);
            } else if (entityType === 'transfer') {
                await SB.from('transfer_lines').delete().eq('transfer_id', id);
                await SB.from('transfers').delete().eq('id', id);
            } else if (entityType === 'bom') {
                await SB.from('bom_lines').delete().eq('bom_id', id);
                await SB.from('bom').delete().eq('id', id);
            } else if (entityType === 'store') {
                await SB.from('stores').delete().eq('id', id);
            } else if (entityType === 'item') {
                await SB.from('items').delete().eq('id', id);
            } else if (entityType === 'employee') {
                await SB.from('employees').delete().eq('id', id);
            }
        } catch(err) {
            toast('Delete failed: ' + (err.message || err), 'error');
            return false;
        }
    }

    DB.voidedRecords.push({
        id: uid('void'), entityType, originalId: id,
        label: record[reg.nameField] || id,
        snapshot: JSON.parse(JSON.stringify(record)),
        reason: reason || '', voidedAt: nowISO(),
        voidedById: currentUser()?.id, voidedByName: currentUser()?.name || 'system'
    });
    col.splice(idx, 1);
    if (entityType === 'salesUp') DB.consumptionLedger = DB.consumptionLedger.filter(x => x.uploadRef !== id);
    audit('VOID', entityType, id, { reason: reason || '' });
    saveData();
    return true;
}
function restoreVoided(voidId){
    const v = DB.voidedRecords.find(x => x.id === voidId);
    if (!v) return;
    const reg = ENTITIES[v.entityType];
    if (!reg) return;
    const collision = DB[reg.key].find(x => x.id === v.originalId);
    if (collision) v.snapshot.id = uid(reg.key.slice(0,3));
    DB[reg.key].push(JSON.parse(JSON.stringify(v.snapshot)));
    DB.voidedRecords = DB.voidedRecords.filter(x => x.id !== voidId);
    audit('RESTORE', v.entityType, v.originalId, {});
    saveData();
    toast('Restored', 'success');
}
function purgeVoided(voidId){
    const v = DB.voidedRecords.find(x => x.id === voidId);
    if (!v) return;
    if (!confirm(`Permanently delete "${v.label}"?`)) return;
    DB.voidedRecords = DB.voidedRecords.filter(x => x.id !== voidId);
    saveData();
    toast('Purged', 'success');
    showPage('recycle');
}
function requestDelete(entityType, id){
    if (!can('deleteRecord')) { toast('Admin only.', 'error'); return; }
    const reg = ENTITIES[entityType];
    if (!reg) return;
    const record = DB[reg.key].find(x => x.id === id);
    if (!record) { toast('Not found', 'error'); return; }
    const label = record[reg.nameField] || id;
    const blockers = getDeleteBlockers(entityType, id);
    let bodyHTML = `
        <div style="background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:14px;margin-bottom:16px">
            <div style="font-weight:bold;color:#b91c1c;margin-bottom:6px">⚠ About to void:</div>
            <div style="font-size:14px"><b>${esc(reg.label)}:</b> ${esc(label)}</div>
            <div style="font-size:12px;color:#6b7280;margin-top:4px">ID: ${esc(id)}</div>
        </div>`;
    if (blockers.length > 0) {
        bodyHTML += `<div class="dep-warning">
            <div style="font-weight:bold;margin-bottom:6px">🚫 Cannot delete — dependencies found:</div>
            <div class="dep-list">${blockers.map(b => `<div><b>${esc(b.type)}</b> (${b.count}) — ${b.preview.map(esc).join(', ')}${b.count > b.preview.length ? '…' : ''}</div>`).join('')}</div>
        </div>`;
        openModal('Delete Blocked', bodyHTML, `<button class="btn-light" onclick="closeModal()">Close</button>`);
        return;
    }
    bodyHTML += `
        <div class="form-row"><label>Reason (optional)</label><textarea id="deleteReason"></textarea></div>
        <p style="font-size:12px;color:#6b7280">Soft delete. Restorable from Recycle Bin.</p>`;
    openModal('Confirm Deletion', bodyHTML, `
        <button class="btn-light" onclick="closeModal()">Cancel</button>
        <button class="btn-danger" onclick="confirmDelete('${entityType}','${id}')">Yes, Void It</button>`);
}
async function confirmDelete(entityType, id){
    const reason = (document.getElementById('deleteReason')?.value || '').trim();
    const ok = await softDelete(entityType, id, reason);
    closeModal();
    if (ok) { toast('Deleted', 'success'); showPage(currentPageKey()); }
}

function getMyStores(user){
    const u = user || currentUser();
    if (!u) return [];
    if (u.role === 'admin') return DB.stores.filter(s => s.status==='Active').map(s => s.id);
    if (u.role === 'store') return u.storeId && getStore(u.storeId) ? [u.storeId] : [];
    if (u.role === 'opmanager') return DB.stores.filter(s => s.status==='Active' && norm(s.operationManagerName)===norm(u.name)).map(s=>s.id);
    if (u.role === 'area') return DB.stores.filter(s => s.status==='Active' && norm(s.areaManagerName)===norm(u.name)).map(s=>s.id);
    if (u.role === 'wh' || u.role === 'viewer') return DB.stores.filter(s => s.status==='Active').map(s=>s.id);
    return [];
}
function getMyStoreObjects(user){ const ids = new Set(getMyStores(user)); return DB.stores.filter(s => ids.has(s.id)); }
function isInScope(storeId, user){ return getMyStores(user).includes(storeId); }
function scopeLabel(user){
    const u = user || currentUser();
    if (!u) return '';
    if (u.role === 'admin') return 'All stores (Administrator)';
    if (u.role === 'store') return `Your store: ${u.storeId ? storeLabel(u.storeId) : 'unassigned'}`;
    if (u.role === 'opmanager') return `Stores under Op. Manager: ${u.name}`;
    if (u.role === 'area') return `Stores under Area Manager: ${u.name}`;
    if (u.role === 'wh') return 'All stores (Warehouse)';
    if (u.role === 'viewer') return 'All stores (read-only)';
    return '';
}

function currentUser(){
    // Cloud mode: use the cached logged-in profile
    if (CLOUD_MODE === 'supabase') {
        return window._cloudMe || null;
    }
    // Local mode: read from sessionStorage
    try {
        const raw = sessionStorage.getItem(SESSION_KEY);
        if (!raw) return null;
        const s = JSON.parse(raw);
        return DB.users.find(u => u.username === s.username) || null;
    } catch(e) { return null; }
}
function setSession(u){ sessionStorage.setItem(SESSION_KEY, JSON.stringify({ username:u })); }
function clearSession(){ sessionStorage.removeItem(SESSION_KEY); }
function can(action){ const u = currentUser(); return u && ACTIONS[action] && ACTIONS[action].includes(u.role); }
function canPage(page){ const u = currentUser(); return u && PERMISSIONS[u.role] && PERMISSIONS[u.role].includes(page); }
function isAdmin(){ const u = currentUser(); return u && u.role==='admin'; }

function canApproveForStore(storeId, user){
    const u = user || currentUser();
    if (!u) return false;
    if (u.role === 'admin') return true;
    if (u.role !== 'area') return false;
    const store = getStore(storeId);
    if (!store) return false;
    return norm(store.areaManagerName) === norm(u.name);
}
function pendingTransfersForMe(user){
    const u = user || currentUser();
    if (!u) return [];
    return DB.transfers.filter(t => t.status === 'Pending' && canApproveForStore(t.fromStoreId, u));
}

async function doLogin(){
    try {
        const uname = document.getElementById('loginUser').value.trim().toLowerCase();
        const pass  = document.getElementById('loginPass').value;
        const err   = document.getElementById('loginError');

        // ---------- Cloud auth ----------
        if (CLOUD_MODE === 'supabase') {
            // Accept both "admin" and "admin@drcafe.com"
            const email = uname.includes('@') ? uname : (uname + '@drcafe.com');
            const { data, error } = await SB.auth.signInWithPassword({ email, password: pass });
            if (error) {
                err.textContent = 'Invalid email or password.';
                err.style.display = 'block';
                return;
            }
         err.style.display = 'none';
         DB = await loadData();
         window._cloudMe = DB.users.find(u => (u.email||'').toLowerCase() === email.toLowerCase()) || null;
         await bootApp();
         return;
        }

        // ---------- Local auth ----------
        const user = DB.users.find(u => u.username===uname && u.pass===pass && u.active);
        if (!user) { err.textContent = 'Invalid username or password.'; err.style.display='block'; return; }
        err.style.display = 'none';
        setSession(uname);
        await bootApp();
    } catch(e) {
        document.getElementById('loginError').textContent = 'Error: ' + e.message;
        document.getElementById('loginError').style.display = 'block';
    }
}

/* ---------- MONTH / WEEK UTILS ---------- */
function monthIndexFromTag(tag){
    if (!tag) return -1;
    const parts = tag.split(' ');
    const m = MONTHS.indexOf(parts[0]);
    const y = parseInt(parts[1], 10);
    if (m < 0 || isNaN(y)) return -1;
    return y * 12 + m;
}
function monthTagFromIndex(idx){ return `${MONTHS[idx % 12]} ${Math.floor(idx/12)}`; }
function monthTagFromISO(iso){
    const [y,m,d] = iso.split('-').map(x=>parseInt(x,10));
    if (isNaN(y) || isNaN(m)) return '';
    return `${MONTHS[m-1]} ${y}`;
}
function nextMonthTag(tag){ const idx = monthIndexFromTag(tag); return idx < 0 ? '' : monthTagFromIndex(idx + 1); }
function getCurrentMonthTag(){ const d = new Date(); return `${MONTHS[d.getMonth()]} ${d.getFullYear()}`; }
function monthStartISO(tag){ const idx = monthIndexFromTag(tag), y = Math.floor(idx/12), m = idx%12; return new Date(y, m, 1).toISOString(); }
function monthEndISO(tag){ const idx = monthIndexFromTag(tag), y = Math.floor(idx/12), m = idx%12; return new Date(y, m+1, 0, 23, 59, 59).toISOString(); }
function isMonthClosed(storeId, monthTag){ return DB.closedMonths.some(c => c.storeId===storeId && c.month===monthTag); }
function getAvailableMonths(){ const now = new Date(); const list = []; for (let i = -2; i <= 2; i++) { const d = new Date(now.getFullYear(), now.getMonth()+i, 1); list.push(`${MONTHS[d.getMonth()]} ${d.getFullYear()}`); } return list; }
function getISOWeek(d){
    const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const dayNum = date.getUTCDay() || 7;
    date.setUTCDate(date.getUTCDate() + 4 - dayNum);
    const yearStart = new Date(Date.UTC(date.getUTCFullYear(),0,1));
    return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
}
function weekTagFromISO(iso){
    const d = new Date(iso + 'T00:00:00');
    if (isNaN(d.getTime())) return '';
    return `Week ${getISOWeek(d)} - ${d.getFullYear()}`;
}

/* ---------- MOVEMENT ENGINE ---------- */
function getLastJournalForStore(storeId, beforeISO){
    let list = DB.journals.filter(j => j.storeId === storeId && j.status === 'Submitted');
    if (beforeISO) list = list.filter(j => j.createdAt < beforeISO);
    list.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
    return list[0] || null;
}
function getMonthOpening(storeId, itemId, monthTag){
    const op = DB.openingStock.filter(o => o.storeId===storeId && o.month===monthTag && o.status==='Posted').sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt))[0];
    if (!op) return null;
    return op.lines.find(l => l.itemId === itemId) || null;
}
function sumPurchasesInRange(storeId, itemId, startISO, endISO){
    let sum = 0;
    DB.purchases.forEach(p => {
        if (p.storeId !== storeId) return;
        if (p.date < startISO) return;
        if (endISO && p.date > endISO) return;
        p.lines.forEach(l => { if (l.itemId === itemId) sum += Number(l.qty)||0; });
    });
    return sum;
}
function sumPurchasesSince(storeId, itemId, sinceISO){
    let sum = 0;
    DB.purchases.forEach(p => {
        if (p.storeId !== storeId) return;
        if (p.createdAt < sinceISO) return;
        p.lines.forEach(l => { if (l.itemId === itemId) sum += Number(l.qty)||0; });
    });
    return sum;
}
function sumTransfersOutInRange(storeId, itemId, startISO, endISO){
    let sum = 0;
    DB.transfers.forEach(t => {
        if (t.fromStoreId !== storeId) return;
        if (t.status !== 'Approved') return;         // ← only Approved
        const d = t.date;                            // ← user-selected date
        if (!d) return;
        if (d < startISO) return;
        if (endISO && d > endISO) return;
        t.lines.forEach(l => { if (l.itemId === itemId) sum += Number(l.qty)||0; });
    });
    return sum;
}
function sumTransfersInInRange(storeId, itemId, startISO, endISO){
    let sum = 0;
    DB.transfers.forEach(t => {
        if (t.toStoreId !== storeId) return;
        if (t.status !== 'Approved') return;         // ← only Approved
        const d = t.date;                            // ← user-selected date
        if (!d) return;
        if (d < startISO) return;
        if (endISO && d > endISO) return;
        t.lines.forEach(l => { if (l.itemId === itemId) sum += Number(l.qty)||0; });
    });
    return sum;
}
function sumTransfersOutSince(storeId, itemId, sinceISO){
    let sum = 0;
    const sinceDate = (sinceISO || '').slice(0,10);
    DB.transfers.forEach(t => {
        if (t.fromStoreId !== storeId) return;
        if (t.status !== 'Approved') return;         // ← only Approved
        const d = t.date;                            // ← user-selected date
        if (!d) return;
        if (d <= sinceDate) return;                  // ← compare date-to-date
        t.lines.forEach(l => { if (l.itemId === itemId) sum += Number(l.qty)||0; });
    });
    return sum;
}
function sumTransfersInSince(storeId, itemId, sinceISO){
    let sum = 0;
    const sinceDate = (sinceISO || '').slice(0,10);
    DB.transfers.forEach(t => {
        if (t.toStoreId !== storeId) return;
        if (t.status !== 'Approved') return;         // ← only Approved
        const d = t.date;                            // ← user-selected date
        if (!d) return;
        if (d <= sinceDate) return;                  // ← compare date-to-date
        t.lines.forEach(l => { if (l.itemId === itemId) sum += Number(l.qty)||0; });
    });
    return sum;
}
function ledgerMatchesJournal(c, journal){
    if (!c || c.storeId !== journal.storeId) return false;
    const type = c.inventoryType || 'daily';
    if (type !== journal.type) return false;
    if (type === 'daily') return c.date === journal.date;
    if (type === 'weekly') return (c.week || '') === (journal.week || '');
    if (type === 'closing') return (c.month || '') === (journal.month || '');
    return false;
}
function sumConsumptionTagged(storeId, itemId, journal){
    // Weekly: sum ALL consumption from month start through journal.date
    // (includes daily uploads + any weekly upload + anything else in range)
    const monthStart = monthStartISO(journal.month).slice(0,10);
    let sum = 0;
    DB.consumptionLedger.forEach(c => {
        if (c.storeId !== storeId) return;
        const d = c.date || '';
        if (d < monthStart) return;
        if (d > journal.date) return;
        c.lines.forEach(l => { if (l.itemId === itemId) sum += Number(l.qty)||0; });
    });
    return sum;
}
function sumMTDConsumption(storeId, itemId, journal){
    const monthStart = monthStartISO(journal.month).slice(0,10);
    const monthEnd = monthEndISO(journal.month).slice(0,10);
    let sum = 0;
    DB.consumptionLedger.forEach(c => {
        if (c.storeId !== storeId) return;
        const d = c.date || '';
        if (d < monthStart || d > monthEnd) return;
        c.lines.forEach(l => { if (l.itemId === itemId) sum += Number(l.qty)||0; });
    });
    return sum;
}
function buildCountLines(journal){
    const storeId = journal.storeId;
    const type = journal.type;
    const monthTag = journal.month;
    const monthStart = monthStartISO(monthTag).slice(0,10);
    const monthEnd = monthEndISO(monthTag).slice(0,10);
    const items = DB.items.filter(it => {
        if (it.status !== 'Active') return false;
        if (type === 'daily') return it.daily;
        if (type === 'weekly') return it.weekly;
        if (type === 'closing') return it.monthly;
        return false;
    });
    let openingSource = { source:'month-opening', journal:null };
    let purchaseFn, tInFn, tOutFn, consFn;
    if (type === 'daily') {
        // Daily: roll forward from previous journal (or month start if none)
        const lastJ = getLastJournalForStore(storeId, journal.createdAt || nowISO());
        if (lastJ) {
            openingSource = { source:'previous-journal', journal: lastJ };
            purchaseFn = (id) => sumPurchasesSince(storeId, id, lastJ.createdAt);
            tInFn      = (id) => sumTransfersInSince(storeId, id, lastJ.createdAt);
            tOutFn     = (id) => sumTransfersOutSince(storeId, id, lastJ.createdAt);
        } else {
            purchaseFn = (id) => sumPurchasesInRange(storeId, id, monthStart, journal.date);
            tInFn      = (id) => sumTransfersInInRange(storeId, id, monthStart, journal.date);
            tOutFn     = (id) => sumTransfersOutInRange(storeId, id, monthStart, journal.date);
        }
        consFn = (id) => sumConsumptionTagged(storeId, id, journal);
    } else if (type === 'weekly') {
        // Weekly: month start → journal date (aggregates all daily uploads so far)
        purchaseFn = (id) => sumPurchasesInRange(storeId, id, monthStart, journal.date);
        tInFn      = (id) => sumTransfersInInRange(storeId, id, monthStart, journal.date);
        tOutFn     = (id) => sumTransfersOutInRange(storeId, id, monthStart, journal.date);
        consFn     = (id) => sumConsumptionTagged(storeId, id, journal);
    } else {
        // Closing: whole month
        purchaseFn = (id) => sumPurchasesInRange(storeId, id, monthStart, monthEnd);
        tInFn      = (id) => sumTransfersInInRange(storeId, id, monthStart, monthEnd);
        tOutFn     = (id) => sumTransfersOutInRange(storeId, id, monthStart, monthEnd);
        consFn     = (id) => sumMTDConsumption(storeId, id, journal);
    }
    return {
        lines: items.map(it => {
            let opening;
            if (type === 'daily' && openingSource.source === 'previous-journal') {
                const line = openingSource.journal.lines.find(l => l.itemId === it.id);
                opening = line ? Number(line.physical) || 0 : 0;
            } else {
                const op = getMonthOpening(storeId, it.id, monthTag);
                opening = op ? Number(op.qty) || 0 : 0;
            }
            const purchases = purchaseFn(it.id);
            const tIn = tInFn(it.id);
            const tOut = tOutFn(it.id);
            const consumption = consFn(it.id);
            const expected = opening + purchases + tIn - tOut - consumption;
            const mtdPurch = sumPurchasesInRange(storeId, it.id, monthStart, journal.date);
            const mtdTIn   = sumTransfersInInRange(storeId, it.id, monthStart, journal.date);
            const mtdTOut  = sumTransfersOutInRange(storeId, it.id, monthStart, journal.date);
            const mtdCons  = sumMTDConsumption(storeId, it.id, journal);
            return {
                itemId: it.id, uom: it.uom,
                opening, purchases, transfersIn: tIn, transfersOut: tOut, consumption, expected,
                physical: 0, variance: 0,
                mtdPurchases: mtdPurch, mtdTransfersIn: mtdTIn, mtdTransfersOut: mtdTOut,
                mtdConsumption: mtdCons
            };
        }),
        openingSource
    };
}
async function rollMonthForward(storeId, monthTag, closingJournal){
    const nextMonth = nextMonthTag(monthTag);
    if (!nextMonth) return null;
    const existing = DB.openingStock.find(o => o.storeId===storeId && o.month===nextMonth && o.status==='Posted');
    if (existing) { toast(`Opening for ${nextMonth} already exists`, 'error'); return null; }
    const lines = closingJournal.lines.map(l => ({ itemId: l.itemId, qty: Number(l.physical)||0, uom: l.uom }));
    const u = currentUser();
    const date = todayISO();
    const id = nextMovementId('OPN', DB.openingStock, date);
    const newOpening = { id, storeId, month: nextMonth, date, byId: u.id, byName: u.name, status:'Posted', lines, createdAt: nowISO(), rolledFrom: closingJournal.id };

    try {
        await DataLayer.insertOpening(newOpening);
    } catch(err) {
        toast('Roll-forward save failed: ' + (err.message || err), 'error');
        return null;
    }

    DB.openingStock.push(newOpening);
    if (!isMonthClosed(storeId, monthTag)) {
        DB.closedMonths.push({ storeId, month: monthTag, closedAt: nowISO(), closedById: u.id, closedByName: u.name, closingId: closingJournal.id, rolledToOpeningId: newOpening.id });
    }
    return newOpening;
}

/* ---------- SALES-DATA GATE ---------- */
function findSalesUploadForJournal(journal){
    // For daily: need an upload tagged daily for that date
    // For weekly: need ANY upload in the range (month start → journal date)
    // For closing: need ANY upload in the month
    const monthStart = monthStartISO(journal.month).slice(0,10);
    const monthEnd = monthEndISO(journal.month).slice(0,10);

    if (journal.type === 'daily') {
        return DB.salesUploads.find(s =>
            s.storeId === journal.storeId &&
            (s.inventoryType || 'daily') === 'daily' &&
            s.date === journal.date
        );
    }
    if (journal.type === 'weekly') {
        return DB.salesUploads.find(s =>
            s.storeId === journal.storeId &&
            s.date >= monthStart &&
            s.date <= journal.date
        );
    }
    if (journal.type === 'closing') {
        return DB.salesUploads.find(s =>
            s.storeId === journal.storeId &&
            s.date >= monthStart &&
            s.date <= monthEnd
        );
    }
    return null;
}

async function saveEmployee(editId){
    const code = document.getElementById('eCode').value.trim();
    const name = document.getElementById('eName').value.trim();
    const role = document.getElementById('eRole').value;
    if (!code || !name || !role) { toast('Code, Name, and Role required', 'error'); return; }
    const dupCode = DB.employees.find(e => norm(e.code) === norm(code) && e.id !== editId);
    if (dupCode) { toast('Employee code already exists', 'error'); return; }
    const dupName = DB.employees.find(e => norm(e.name) === norm(name) && e.id !== editId);
    if (dupName) { toast('Employee name already exists', 'error'); return; }

    if (editId) {
        const e = getEmployee(editId);
        if (!e) { toast('Not found', 'error'); return; }
        const oldName = e.name;
        e.code = code; e.name = name; e.role = role;

        try {
            await DataLayer.updateEmployee(e.id, e);
        } catch(err) {
            toast('Save failed: ' + (err.message || err), 'error');
            return;
        }

        if (oldName !== name) {
            for (const s of DB.stores) {
                let changed = false;
                if (norm(s.storeManagerName) === norm(oldName)) { s.storeManagerName = name; changed = true; }
                if (norm(s.areaManagerName) === norm(oldName)) { s.areaManagerName = name; changed = true; }
                if (norm(s.operationManagerName) === norm(oldName)) { s.operationManagerName = name; changed = true; }
                if (changed) {
                    try { await DataLayer.updateStore(s.id, s); } catch(e) {}
                }

async function handleEmpImportFile(evt){

function parseEmpImport(rows, filename){
    if (rows.length === 0) { toast('File is empty', 'error'); return; }

    // Header matcher — case-insensitive, trims spaces, ignores dots
    const H = {
        code: ['id.no','id no','idno','id','code','employee code','emp code','empcode','employee id','empid'],
        name: ['name','employee name','emp name','empname','full name','fullname'],
        role: ['designation','role','job title','jobtitle','title','position']
    };
    function pick(obj, keys){
        for (const k of Object.keys(obj)) {
            const n = k.toLowerCase().trim().replace(/\s+/g,' ').replace(/\./g,'.');
            if (keys.includes(n)) return obj[k];
        }
        return undefined;
    }
    function cleanName(s){
        return String(s || '').trim().replace(/\s+/g, ' ').replace(/\.+$/, '');
    }

    // Allowed roles — must match exactly (case-insensitive)
    const allowedRoles = EMPLOYEE_ROLES.map(r => r.toLowerCase());

    const valid = [];
    const warnings = [];
    const errors = [];
    const seenCodes = new Set();

    rows.forEach((row, i) => {
        const lineNo = i + 2;
        const codeRaw = String(pick(row, H.code) || '').trim();
        const nameRaw = cleanName(pick(row, H.name));
        const roleRaw = String(pick(row, H.role) || '').trim();

        // Skip fully blank rows
        if (!codeRaw && !nameRaw && !roleRaw) return;

        if (!codeRaw) { errors.push({ line: lineNo, msg: 'Missing ID.NO / Code' }); return; }
        if (!nameRaw) { errors.push({ line: lineNo, msg: `Code "${codeRaw}": missing NAME` }); return; }
        if (!roleRaw) { errors.push({ line: lineNo, msg: `Code "${codeRaw}": missing Designation` }); return; }

        // Normalize role to the exact casing your DB uses
        const roleLower = roleRaw.toLowerCase();
        const roleIdx = allowedRoles.indexOf(roleLower);
        if (roleIdx < 0) {
            errors.push({ line: lineNo, msg: `Code "${codeRaw}": invalid Designation "${roleRaw}". Use: ${EMPLOYEE_ROLES.join(', ')}` });
            return;
        }
        const role = EMPLOYEE_ROLES[roleIdx];

        // Clean the code (strip non-alphanumeric except dash/underscore/dot)
        const code = codeRaw.replace(/[^a-zA-Z0-9._-]/g, '');
        if (code !== codeRaw) {
            warnings.push({ line: lineNo, msg: `Code "${codeRaw}" cleaned to "${code}"` });
        }
        if (seenCodes.has(code.toLowerCase())) {
            errors.push({ line: lineNo, msg: `Duplicate Code "${code}" within file` });
            return;
        }
        seenCodes.add(code.toLowerCase());

        valid.push({ code, name: nameRaw, role });
    });

    _empImportParsed = { valid, warnings, errors, filename };

    // Render preview
    const preview = document.getElementById('empImpPreview');
    const sample = valid.slice(0, 12);
    preview.innerHTML = `
        <div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:6px;padding:10px 12px;font-size:13px;margin-bottom:10px">
            <b>File:</b> ${esc(filename)} &nbsp;·&nbsp;
            <span class="green"><b>${valid.length}</b> valid</span>
            ${warnings.length > 0 ? ` · <span class="orange"><b>${warnings.length}</b> warnings</span>` : ''}
            ${errors.length > 0 ? ` · <span class="red"><b>${errors.length}</b> errors</span>` : ''}
        </div>
        ${sample.length > 0 ? `
        <div style="max-height:280px;overflow-y:auto;border:1px solid #e5e7eb;border-radius:6px">
            <table style="font-size:12px">
                <thead><tr><th>Code</th><th>Name</th><th>Role</th></tr></thead>
                <tbody>${sample.map(r => `
                    <tr>
                        <td>${esc(r.code)}</td>
                        <td>${esc(r.name)}</td>
                        <td><span class="badge badge-${r.role==='Area Manager'?'blue':r.role==='Operation Manager'?'cyan':'green'}">${esc(r.role)}</span></td>
                    </tr>`).join('')}
                </tbody>
            </table>
        </div>
        ${valid.length > 12 ? `<p style="font-size:12px;color:#6b7280;margin-top:6px">…and ${valid.length - 12} more</p>` : ''}
        ` : ''}
        ${errors.length > 0 ? `
            <div style="margin-top:10px;background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:10px;font-size:12px;max-height:180px;overflow-y:auto">
                <b style="color:#b91c1c">Errors:</b>
                ${errors.slice(0, 30).map(e => `<div>Line ${e.line}: ${esc(e.msg)}</div>`).join('')}
                ${errors.length > 30 ? `<div>…and ${errors.length - 30} more</div>` : ''}
            </div>` : ''}
    `;

    const btn = document.getElementById('empImpConfirmBtn');
    if (btn) btn.disabled = valid.length === 0;
}

async function confirmEmpImport(){
    if (!_empImportParsed) { toast('No file loaded', 'error'); return; }
    const { valid } = _empImportParsed;
    if (valid.length === 0) { toast('No valid rows', 'error'); return; }

    const mode = document.getElementById('empImpMode').value;

    if (mode === 'replace') {
        if (!confirm(`⚠ REPLACE ALL mode:\n\nThis will DELETE all ${DB.employees.length} existing employees, then import ${valid.length} employees from the file.\n\n⚠ Any store that references a deleted employee as manager will keep the name but lose the link.\n\nContinue?`)) return;
        if (!confirm('This cannot be undone. Really proceed?')) return;
    }

    const btn = document.getElementById('empImpConfirmBtn');
    btn.disabled = true;
    btn.textContent = 'Importing…';

    try {
        // Build a code → employee map for fast lookup
        const byCode = new Map();
        DB.employees.forEach(e => byCode.set(String(e.code).trim().toLowerCase(), e));

        // ── REPLACE ALL: wipe first ──
        if (mode === 'replace') {
            btn.textContent = `Deleting ${DB.employees.length} existing employees…`;
            if (CLOUD_MODE === 'supabase') {
            const { error } = await SB.from('employees').delete().neq('id', '00000000-0000-0000-0000-000000000000');
                if (error) throw error;
            }
            DB.employees = [];
            byCode.clear();
        }

        let inserted = 0, updated = 0, skipped = 0, failed = 0;

        for (let i = 0; i < valid.length; i++) {
            const r = valid[i];
            btn.textContent = `Importing ${i + 1} / ${valid.length}…`;

            const key = r.code.trim().toLowerCase();
            const existing = byCode.get(key);

            if (mode === 'add' && existing) { skipped++; continue; }

            if (existing) {
                // UPDATE existing
                try {
                    if (CLOUD_MODE === 'supabase') {
                        const { error } = await SB.from('employees').update({
                            code: r.code,
                            name: r.name,
                            role: r.role
                        }).eq('id', existing.id);
                        if (error) throw error;
                    }
                    existing.code = r.code;
                    existing.name = r.name;
                    existing.role = r.role;
                    updated++;
                } catch(err) {
                    console.error('Update failed for', r.code, err);
                    failed++;
                }
            } else {
                // INSERT new
                const rec = {
                    id: uid('emp'),
                    code: r.code,
                    name: r.name,
                    role: r.role,
                    status: 'Active',
                    createdAt: nowISO()
                };
                try {
                    await DataLayer.insertEmployee(rec);
                    DB.employees.push(rec);
                    byCode.set(key, rec);
                    inserted++;
                } catch(err) {
                    console.error('Insert failed for', r.code, err);
                    failed++;
                }
            }
        }

        _empImportParsed = null;
        closeModal();
        const msg = mode === 'replace'
            ? `Replaced all employees — ${updated + inserted} imported${failed > 0 ? `, ${failed} failed` : ''}`
            : mode === 'add'
                ? `Added ${inserted} new employees${skipped > 0 ? `, skipped ${skipped} existing` : ''}${failed > 0 ? `, ${failed} failed` : ''}`
                : `Imported ${inserted} new + ${updated} updated employees${failed > 0 ? `, ${failed} failed` : ''}`;
        toast(msg, failed > 0 ? 'error' : 'success');
        showPage('employees');

    } catch(err) {
        btn.disabled = false;
        btn.textContent = 'Import';
        toast('Import failed: ' + (err.message || err), 'error');
    }
}

async function confirmStoreImport(){
    if (!_storeImportParsed) { toast('No file loaded', 'error'); return; }
    const { valid } = _storeImportParsed;
    if (valid.length === 0) { toast('No valid rows', 'error'); return; }

    const mode = document.getElementById('storeImpMode').value;

    if (mode === 'replace') {
        if (!confirm(`⚠ REPLACE ALL mode:\n\nThis will DELETE all ${DB.stores.length} existing stores.\n\n⚠ Any journals, purchases, sales uploads, openings, or transfers referencing these stores will become orphaned.\n\nContinue?`)) return;
        if (!confirm('This cannot be undone. Really proceed?')) return;
    }

    const btn = document.getElementById('storeImpConfirmBtn');
    btn.disabled = true;
    btn.textContent = 'Importing…';

    try {
        // Build a code → store map for fast lookup
        const byCode = new Map();
        DB.stores.forEach(s => byCode.set(String(s.code).trim().toLowerCase(), s));

        // ── REPLACE ALL: wipe first ──
        if (mode === 'replace') {
            btn.textContent = `Deleting ${DB.stores.length} existing stores…`;
            if (CLOUD_MODE === 'supabase') {
                const { error } = await SB.from('stores').delete().neq('id', '00000000-0000-0000-0000-000000000000');
                if (error) throw error;
            }
            DB.stores = [];
            byCode.clear();
        }

        let inserted = 0, updated = 0, skipped = 0, failed = 0;

        for (let i = 0; i < valid.length; i++) {
            const r = valid[i];
            btn.textContent = `Importing ${i + 1} / ${valid.length}…`;

            const key = r.code.trim().toLowerCase();
            const existing = byCode.get(key);

            if (mode === 'add' && existing) { skipped++; continue; }

            if (existing) {
                // UPDATE existing
                try {
                    if (CLOUD_MODE === 'supabase') {
                        const { error } = await SB.from('stores').update({
                            code: r.code,
                            name: r.name,
                            area: r.area,
                            type: r.type,
                            store_manager_name: r.storeManagerName || null,
                            area_manager_name: r.areaManagerName || null,
                            operation_manager_name: r.operationManagerName || null
                        }).eq('id', existing.id);
                        if (error) throw error;
                    }
                    existing.code = r.code;
                    existing.name = r.name;
                    existing.area = r.area;
                    existing.type = r.type;
                    existing.storeManagerName = r.storeManagerName;
                    existing.areaManagerName = r.areaManagerName;
                    existing.operationManagerName = r.operationManagerName;
                    updated++;
                } catch(err) {
                    console.error('Update failed for', r.code, err);
                    failed++;
                }
            } else {
                // INSERT new
                const rec = {
                    id: r.id,
                    code: r.code,
                    name: r.name,
                    area: r.area,
                    type: r.type,
                    storeManagerName: r.storeManagerName,
                    areaManagerName: r.areaManagerName,
                    operationManagerName: r.operationManagerName,
                    status: 'Active',
                    createdAt: nowISO()
                };
                try {
                    await DataLayer.insertStore(rec);
                    DB.stores.push(rec);
                    byCode.set(key, rec);
                    inserted++;
                } catch(err) {
                    console.error('Insert failed for', r.code, err);
                    failed++;
                }
            }
        }

        _storeImportParsed = null;
        closeModal();
        const msg = mode === 'replace'
            ? `Replaced all stores — ${updated + inserted} imported${failed > 0 ? `, ${failed} failed` : ''}`
            : mode === 'add'
                ? `Added ${inserted} new stores${skipped > 0 ? `, skipped ${skipped} existing` : ''}${failed > 0 ? `, ${failed} failed` : ''}`
                : `Imported ${inserted} new + ${updated} updated stores${failed > 0 ? `, ${failed} failed` : ''}`;
        toast(msg, failed > 0 ? 'error' : 'success');
        showPage('stores');

    } catch(err) {
        btn.disabled = false;
        btn.textContent = 'Import';
        toast('Import failed: ' + (err.message || err), 'error');
    }
}

    /* ============================================================
   BULK USER EXTRACTION FROM STORE MASTER
   - Store Manager  →  <storecode>@drcafe.com  (assigned to their store)
   - Area Manager   →  <firstname>@drcafe.com  (scope by name)
   - Operation Mgr  →  <firstname>@drcafe.com  (scope by name)
   - Default password: ViewX@2026 (must change on first login)
   ============================================================ */
let _bulkUsersPlan = null;

function _slugifyFirstName(fullName){
    return String(fullName || '').trim().split(/\s+/)[0]
        .toLowerCase()
        .replace(/[^a-z0-9]/g, '');
}
function _slugifyFullName(fullName){
    return String(fullName || '').trim().toLowerCase()
        .replace(/[^a-z0-9]+/g, '.')
        .replace(/^\.|\.$/g, '');
}
function _initials(fullName){
    return String(fullName || '').trim().split(/\s+/).map(x => x[0] || '').join('').slice(0,2).toUpperCase();
}

function buildBulkUsersPlan(){
    const plan = {
        storeManagers: [], areaManagers: [], opManagers: [],
        skipped: [], warnings: []
    };

    const existingUsernames = new Set(
        DB.users.map(u => String(u.username || '').toLowerCase())
    );

    // Store Managers — one per store
    DB.stores.forEach(s => {
        const name = (s.storeManagerName || '').trim();
        if (!name) {
            plan.warnings.push({ store: s.code, msg: `Store ${s.code} has no Store Manager name` });
            return;
        }
        const base = String(s.code || '').toLowerCase().replace(/[^a-z0-9]/g,'');
        const username = base + '@drcafe.com';
        if (existingUsernames.has(username.toLowerCase())) {
            plan.skipped.push({ name, username, reason: 'username already exists', role: 'Store Manager' });
            return;
        }
        existingUsernames.add(username.toLowerCase());
        plan.storeManagers.push({
            name, username,
            role: 'store', roleLabel: 'Store Manager',
            storeId: 's-' + s.code, storeCode: s.code,
            initials: _initials(name)
        });
    });

    // Area Managers — unique by name
    const seenArea = new Set();
    DB.stores.forEach(s => {
        const name = (s.areaManagerName || '').trim();
        if (!name || seenArea.has(norm(name))) return;
        seenArea.add(norm(name));
        const base = _slugifyFirstName(name);
        if (!base) {
            plan.warnings.push({ store: s.code, msg: `Area Manager "${name}" produced empty username` });
            return;
        }
        const username = base + '@drcafe.com';
        if (existingUsernames.has(username.toLowerCase())) {
            plan.skipped.push({ name, username, reason: 'username already exists', role: 'Area Manager' });
            return;
        }
        existingUsernames.add(username.toLowerCase());
        plan.areaManagers.push({
            name, username,
            role: 'area', roleLabel: 'Area Manager',
            storeId: null, initials: _initials(name)
        });
    });

    // Operation Managers — unique by name
    const seenOp = new Set();
    DB.stores.forEach(s => {
        const name = (s.operationManagerName || '').trim();
        if (!name || seenOp.has(norm(name))) return;
        seenOp.add(norm(name));
        const base = _slugifyFirstName(name);
        if (!base) {
            plan.warnings.push({ store: s.code, msg: `Operation Manager "${name}" produced empty username` });
            return;
        }
        const username = base + '@drcafe.com';
        if (existingUsernames.has(username.toLowerCase())) {
            plan.skipped.push({ name, username, reason: 'username already exists', role: 'Operation Manager' });
            return;
        }
        existingUsernames.add(username.toLowerCase());
        plan.opManagers.push({
            name, username,
            role: 'opmanager', roleLabel: 'Operation Manager',
            storeId: null, initials: _initials(name)
        });
    });

    return plan;
}

async function handleItemImportFile(evt){
    const file = evt.target.files[0];
    if (!file) return;
    if (!XLSX_READY) { toast('Excel library still loading. Try again in 2 seconds.', 'error'); evt.target.value=''; return; }

    const reader = new FileReader();
    reader.onload = function(e){
        try {
            const data = new Uint8Array(e.target.result);
            const wb = XLSX.read(data, { type:'array', cellDates: true });
            const sheet = wb.Sheets[wb.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(sheet, { defval:'', raw: true });
            parseItemImport(rows, file.name);
        } catch(err) {
            toast('Parse failed: ' + err.message, 'error');
        }
    };
    reader.readAsArrayBuffer(file);
    evt.target.value = '';
}

function parseItemImport(rows, filename){
    if (rows.length === 0) { toast('File is empty', 'error'); return; }

    // Map header names case-insensitively
    const H = {
        code:     ['code','item code','itemcode','item_code','sku'],
        name:     ['name','item name','itemname','item_name','description'],
        cat:      ['category','cat','category name','group'],
        uom:      ['uom','unit','unit of measure','unit of measurement'],
        cost:     ['cost','unit cost','price','cost price'],
        daily:    ['d','daily','is_daily','daily flag'],
        weekly:   ['w','weekly','is_weekly','weekly flag'],
        monthly:  ['m','monthly','is_monthly','monthly flag']
    };
    function pick(obj, keys){
        for (const k of Object.keys(obj)) {
            if (keys.includes(k.toLowerCase().trim().replace(/\s+/g,' '))) return obj[k];
        }
        return undefined;
    }
    function toBool(v, def){
        if (v === undefined || v === null || v === '') return def;
        const s = String(v).toLowerCase().trim();
        if (['y','yes','1','true','t'].includes(s)) return true;
        if (['n','no','0','false','f'].includes(s)) return false;
        return def;
    }

    const valid = [];
    const warnings = [];
    const errors = [];
    const seenCodes = new Set();

    rows.forEach((row, i) => {
        const lineNo = i + 2;
        const codeRaw = String(pick(row, H.code) || '').trim();
        const nameRaw = String(pick(row, H.name) || '').trim();

        if (!codeRaw && !nameRaw) return; // blank row

        if (!codeRaw) { errors.push({ line: lineNo, msg: 'Missing Code', row }); return; }
        if (!nameRaw) { errors.push({ line: lineNo, msg: 'Missing Name', row }); return; }

        // Strip non-alphanumeric except dash/underscore/dot
        const code = codeRaw.replace(/[^a-zA-Z0-9._-]/g, '');
        if (code !== codeRaw) {
            warnings.push({ line: lineNo, msg: `Code "${codeRaw}" cleaned to "${code}"`, row });
        }
        if (seenCodes.has(code)) {
            errors.push({ line: lineNo, msg: `Duplicate Code "${code}" within file`, row });
            return;
        }
        seenCodes.add(code);

        const cat = String(pick(row, H.cat) || '').trim() || 'Uncategorized';
        const uom = String(pick(row, H.uom) || '').trim() || 'Pcs';
        const costRaw = pick(row, H.cost);
        const cost = Number(costRaw) || 0;

        const dVal = toBool(pick(row, H.daily), null);
        const wVal = toBool(pick(row, H.weekly), null);
        const mVal = toBool(pick(row, H.monthly), null);

        // If all three blank → default all true
        const anySet = dVal !== null || wVal !== null || mVal !== null;
        const daily   = dVal !== null ? dVal : (anySet ? false : true);
        const weekly  = wVal !== null ? wVal : (anySet ? false : true);
        const monthly = mVal !== null ? mVal : (anySet ? false : true);

        const id = 'i-' + code.toLowerCase().replace(/[^a-z0-9]/g, '');
        valid.push({ id, code, name: nameRaw, cat, uom, cost, daily, weekly, monthly });
    });

    _importParsed = { valid, warnings, errors, filename };

    // Render preview
    const mode = document.getElementById('impMode').value;
    const preview = document.getElementById('impPreview');
    const sample = valid.slice(0, 8);
    preview.innerHTML = `
        <div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:6px;padding:10px 12px;font-size:13px;margin-bottom:10px">
            <b>File:</b> ${esc(filename)} &nbsp;·&nbsp;
            <span class="green"><b>${valid.length}</b> valid</span>
            ${warnings.length > 0 ? ` · <span class="orange"><b>${warnings.length}</b> warnings</span>` : ''}
            ${errors.length > 0 ? ` · <span class="red"><b>${errors.length}</b> errors</span>` : ''}
        </div>
        ${sample.length > 0 ? `
        <div style="max-height:220px;overflow-y:auto;border:1px solid #e5e7eb;border-radius:6px">
            <table style="font-size:12px">
                <thead><tr><th>Code</th><th>Name</th><th>Cat</th><th>UOM</th><th>Cost</th><th>D</th><th>W</th><th>M</th></tr></thead>
                <tbody>${sample.map(r => `
                    <tr>
                        <td>${esc(r.code)}</td>
                        <td>${esc(r.name)}</td>
                        <td>${esc(r.cat)}</td>
                        <td>${esc(r.uom)}</td>
                        <td>${fmtNum(r.cost)}</td>
                        <td>${r.daily?'✓':'-'}</td>
                        <td>${r.weekly?'✓':'-'}</td>
                        <td>${r.monthly?'✓':'-'}</td>
                    </tr>`).join('')}
                </tbody>
            </table>
        </div>
        ${valid.length > 8 ? `<p style="font-size:12px;color:#6b7280;margin-top:6px">…and ${valid.length - 8} more</p>` : ''}
        ` : ''}
        ${errors.length > 0 ? `
            <div style="margin-top:10px;background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:10px;font-size:12px;max-height:150px;overflow-y:auto">
                <b style="color:#b91c1c">Errors:</b>
                ${errors.slice(0, 20).map(e => `<div>Line ${e.line}: ${esc(e.msg)}</div>`).join('')}
                ${errors.length > 20 ? `<div>…and ${errors.length - 20} more</div>` : ''}
            </div>` : ''}
    `;

    const btn = document.getElementById('impConfirmBtn');
    if (btn) btn.disabled = valid.length === 0;
}

async function confirmItemImport(){
    if (!_importParsed) { toast('No file loaded', 'error'); return; }
    const { valid } = _importParsed;
    if (valid.length === 0) { toast('No valid rows', 'error'); return; }

    const mode = document.getElementById('impMode').value;

    if (mode === 'replace') {
        if (!confirm(`⚠ REPLACE ALL mode:\n\nThis will DELETE all ${DB.items.length} existing items from Supabase, then import ${valid.length} items from the file.\n\nContinue?`)) return;
        if (!confirm('This cannot be undone. Really proceed?')) return;
    }

    const btn = document.getElementById('impConfirmBtn');
    btn.disabled = true;
    btn.textContent = 'Importing…';

    try {
        if (mode === 'replace') {
            toast(`Deleting ${DB.items.length} existing items…`, 'success');
            const { error } = await SB.from('items').delete().neq('id', '___never___');
            if (error) throw error;
            DB.items = [];
        }

        // Chunk into batches of 500 for reliability
        const CHUNK = 500;
        let inserted = 0, updated = 0, skipped = 0, failed = 0;
        const existingCodes = new Set(DB.items.map(i => i.code));

        for (let i = 0; i < valid.length; i += CHUNK) {
            const chunk = valid.slice(i, i + CHUNK);
            btn.textContent = `Importing ${Math.min(i + CHUNK, valid.length)} / ${valid.length}…`;

            if (mode === 'add') {
                const toInsert = chunk.filter(r => !existingCodes.has(r.code));
                skipped += chunk.length - toInsert.length;
                if (toInsert.length === 0) continue;
                const rows = toInsert.map(r => ({
                    id: r.id, code: r.code, name: r.name, cat: r.cat, uom: r.uom,
                    cost: r.cost, daily: r.daily, weekly: r.weekly, monthly: r.monthly,
                    status: 'Active'
                }));
                const { error } = await SB.from('items').insert(rows);
                if (error) { failed += toInsert.length; }
                else {
                    inserted += toInsert.length;
                    toInsert.forEach(r => {
                        DB.items.push({ ...r, createdAt: nowISO() });
                        existingCodes.add(r.code);
                    });
                }
            } else {
                // add or update — upsert by id
                const rows = chunk.map(r => ({
                    id: r.id, code: r.code, name: r.name, cat: r.cat, uom: r.uom,
                    cost: r.cost, daily: r.daily, weekly: r.weekly, monthly: r.monthly,
                    status: 'Active'
                }));
                const { error } = await SB.from('items').upsert(rows, { onConflict: 'id' });
                if (error) { failed += rows.length; }
                else {
                    updated += rows.length;
                    // Refresh memory
                    rows.forEach(r => {
                        const idx = DB.items.findIndex(x => x.id === r.id);
                        if (idx >= 0) Object.assign(DB.items[idx], r);
                        else DB.items.push({ ...r, createdAt: nowISO() });
                    });
                }
            }
        }

        _importParsed = null;
        closeModal();
        const msg = mode === 'replace'
            ? `Replaced all items — ${updated} imported${failed > 0 ? `, ${failed} failed` : ''}`
            : mode === 'add'
                ? `Added ${inserted} new items${skipped > 0 ? `, skipped ${skipped} existing` : ''}${failed > 0 ? `, ${failed} failed` : ''}`
                : `Imported ${updated} items (updated/inserted)${failed > 0 ? `, ${failed} failed` : ''}`;
        toast(msg, failed > 0 ? 'error' : 'success');
        showPage('items');

    } catch(err) {
        btn.disabled = false;
        btn.textContent = 'Import';
        toast('Import failed: ' + (err.message || err), 'error');
    }
}

async function saveBOM(editId){

    const version = Number(document.getElementById('mBVer').value) || 1;

    if (lines.length === 0) { toast('Add at least one ingredient with qty > 0', 'error'); return; }
    const dup = DB.bom.find(b => norm(b.productId) === norm(productId) && b.id !== editId);
    if (dup) { toast(`Product ID "${productId}" already used by BOM ${dup.id}`, 'error'); return; }
    const seen = new Set();
    for (const l of lines) {
        if (seen.has(l.itemId)) { toast(`Duplicate ingredient: ${l.itemCode}`, 'error'); return; }
        seen.add(l.itemId);
    }

    if (editId) {
        const b = DB.bom.find(x => x.id === editId);
        if (!b) { toast('Not found', 'error'); return; }

        try {
            await DataLayer.updateBOM(b.id, b);

            toast('Save failed: ' + (err.message || err), 'error');
            return;
        }

        audit('UPDATE','bom',b.id,{ productId, productName });
        closeModal(); toast('BOM updated', 'success');
    } else {
        const id = 'BOM-' + String(DB.bom.length + 1).padStart(5, '0');
        const rec = {
            id, productId, productName, cat, version, effective, status:'Active',
            lines: lines.map(l => ({ itemId: l.itemId, itemCode: l.itemCode, itemName: l.itemName, qty: l.qty, uom: l.uom }))
        };

        try {
            await DataLayer.insertBOM(rec);

            toast('Save failed: ' + (err.message || err), 'error');
            return;
        }

        DB.bom.push(rec);
        audit('CREATE','bom',id,{ productId, productName });
        closeModal(); toast('BOM created', 'success');
    }
    showPage('bom');
    }

async function handleBOMImportFile(evt){
    const file = evt.target.files[0];
    if (!file) return;
    if (!XLSX_READY) { toast('Excel library still loading. Try again in 2 seconds.', 'error'); evt.target.value=''; return; }
    const reader = new FileReader();
    reader.onload = function(e){
        try {
            const data = new Uint8Array(e.target.result);
            const wb = XLSX.read(data, { type:'array', cellDates: true });
            const sheet = wb.Sheets[wb.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(sheet, { defval:'', raw: true });
            parseBOMImport(rows, file.name);
        } catch(err) {
            toast('Parse failed: ' + err.message, 'error');
        }
    };
    reader.readAsArrayBuffer(file);
    evt.target.value = '';
}

function parseBOMImport(rows, filename){
    if (rows.length === 0) { toast('File is empty', 'error'); return; }

    // Header matcher — case-insensitive, trims spaces
    const H = {
        productId:   ['invd_item','invd item','product id','productid','product_code','product code','sku'],
        productName: ['mi_longname','mi longname','product name','productname','description'],
        itemCode:    ['code','item code','itemcode','item_code','ingredient code'],
        itemName:    ['name','item name','itemname','item_name','ingredient name'],
        category:    ['category','cat','group'],
        uom:         ['uom','unit','unit of measure'],
        qty:         ['qty','quantity','aug qty (as stored)','qty (as stored)','qty sold']
    };
    function pick(obj, keys){
        for (const k of Object.keys(obj)) {
            const norm = k.toLowerCase().trim().replace(/\s+/g,' ');
            if (keys.includes(norm)) return obj[k];
        }
        return undefined;
    }
    function pickQty(obj){
        const direct = pick(obj, H.qty);
        if (direct !== undefined && direct !== '') return direct;
        for (const k of Object.keys(obj)) {
            if (/qty|quantity/i.test(k)) return obj[k];
        }
        return undefined;
    }

    // Build a code → item map from existing items
    const itemByCode = new Map();
    DB.items.forEach(i => itemByCode.set(String(i.code).trim().toLowerCase(), i));

    const grouped = new Map();       // productId → { productId, productName, cat, lines: [] }
    const newItems = new Map();      // codeLower → { id, code, name, cat, uom, cost }
    const errors = [];
    const warnings = [];
    let rowNo = 1;

    rows.forEach((row, i) => {
        rowNo = i + 2;
        const productIdRaw = String(pick(row, H.productId) || '').trim();
        const productNameRaw = String(pick(row, H.productName) || '').trim();
        const itemCodeRaw = String(pick(row, H.itemCode) || '').trim();
        const itemNameRaw = String(pick(row, H.itemName) || '').trim();
        const catRaw = String(pick(row, H.category) || '').trim() || 'Uncategorized';
        const uomRaw = String(pick(row, H.uom) || '').trim() || 'PCS';
        const qtyRaw = pickQty(row);

        // Skip fully blank rows
        if (!productIdRaw && !itemCodeRaw && qtyRaw === '') return;

        if (!productIdRaw) { errors.push({ line: rowNo, msg: 'Missing INVD_ITEM (Product ID)' }); return; }
        if (!productNameRaw) { warnings.push({ line: rowNo, msg: `Product "${productIdRaw}" has no MI_LONGNAME — using Product ID as name` }); }
        if (!itemCodeRaw) { errors.push({ line: rowNo, msg: `Product "${productIdRaw}": missing ingredient Code` }); return; }

        const qty = Number(qtyRaw);
        if (isNaN(qty) || qty <= 0) { errors.push({ line: rowNo, msg: `Product "${productIdRaw}": invalid qty "${qtyRaw}" for ${itemCodeRaw}` }); return; }

        // ── Resolve the ingredient: existing item OR auto-create ──
        const key = itemCodeRaw.toLowerCase();
        let item = itemByCode.get(key);
        if (!item) {
            if (!newItems.has(key)) {
                const newId = 'i-' + itemCodeRaw.toLowerCase().replace(/[^a-z0-9]/g, '');
                newItems.set(key, {
                    id: newId,
                    code: itemCodeRaw,
                    name: itemNameRaw || itemCodeRaw,
                    cat: catRaw,
                    uom: uomRaw,
                    cost: 0
                });
            }
            item = newItems.get(key);
        }

        const prodKey = productIdRaw.toLowerCase();
        if (!grouped.has(prodKey)) {
            grouped.set(prodKey, {
                productId: productIdRaw,
                productName: productNameRaw || productIdRaw,
                cat: catRaw,
                lines: [],
                seenItems: new Set()
            });
        }
        const g = grouped.get(prodKey);
        if (g.seenItems.has(item.id)) {
            warnings.push({ line: rowNo, msg: `Product "${productIdRaw}": duplicate ingredient ${itemCodeRaw} — qty added` });
            const existing = g.lines.find(l => l.itemId === item.id);
            existing.qty += qty;
            return;
        }
        g.seenItems.add(item.id);
        g.lines.push({
            itemId: item.id,
            itemCode: item.code,
            itemName: item.name,
            qty: qty,
            uom: uomRaw || item.uom || 'PCS'
        });
    });

    const boms = [...grouped.values()].map(g => ({
        productId: g.productId,
        productName: g.productName,
        cat: g.cat,
        lines: g.lines
    }));

    const newItemList = [...newItems.values()];

    _bomImportParsed = { boms, newItems: newItemList, errors, warnings, filename };

    // Render preview
    const totalLines = boms.reduce((s,b) => s + b.lines.length, 0);
    const preview = document.getElementById('bomImpPreview');
    const sample = boms.slice(0, 5);
    preview.innerHTML = `
        <div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:6px;padding:10px 12px;font-size:13px;margin-bottom:10px">
            <b>File:</b> ${esc(filename)} &nbsp;·&nbsp;
            <span class="green"><b>${boms.length}</b> BOMs</span> ·
            <span class="green"><b>${totalLines}</b> ingredient lines</span>
            ${newItemList.length > 0 ? ` · <span style="color:#7c3aed"><b>${newItemList.length}</b> new items will be created</span>` : ''}
            ${warnings.length > 0 ? ` · <span class="orange"><b>${warnings.length}</b> warnings</span>` : ''}
            ${errors.length > 0 ? ` · <span class="red"><b>${errors.length}</b> errors</span>` : ''}
        </div>
        ${newItemList.length > 0 ? `
        <div style="background:#f5f3ff;border:1px solid #ddd6fe;border-radius:6px;padding:10px 12px;font-size:12px;margin-bottom:10px;color:#5b21b6">
            ℹ <b>${newItemList.length} ingredient(s)</b> aren't in Item Master yet — they'll be auto-created with
            <b>cost 0</b> and <b>D / W / M = OFF</b> (you can enable them later per need).
            Preview: ${newItemList.slice(0,8).map(x => `<code>${esc(x.code)}</code>`).join(', ')}${newItemList.length > 8 ? ` …+${newItemList.length-8} more` : ''}
        </div>` : ''}
        ${sample.length > 0 ? `
        <div style="max-height:220px;overflow-y:auto;border:1px solid #e5e7eb;border-radius:6px">
            <table style="font-size:12px">
                <thead><tr><th>Product ID</th><th>Product Name</th><th>Category</th><th>Ingredients</th></tr></thead>
                <tbody>${sample.map(b => `
                    <tr>
                        <td><span class="bom-pid">${esc(b.productId)}</span></td>
                        <td>${esc(b.productName)}</td>
                        <td>${esc(b.cat)}</td>
                        <td>${b.lines.length} (${b.lines.slice(0,3).map(l => esc(l.itemCode)).join(', ')}${b.lines.length > 3 ? '…' : ''})</td>
                    </tr>`).join('')}
                </tbody>
            </table>
        </div>
        ${boms.length > 5 ? `<p style="font-size:12px;color:#6b7280;margin-top:6px">…and ${boms.length - 5} more BOMs</p>` : ''}
        ` : ''}
        ${errors.length > 0 ? `
            <div style="margin-top:10px;background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:10px;font-size:12px;max-height:150px;overflow-y:auto">
                <b style="color:#b91c1c">Errors:</b>
                ${errors.slice(0, 25).map(e => `<div>Line ${e.line}: ${esc(e.msg)}</div>`).join('')}
                ${errors.length > 25 ? `<div>…and ${errors.length - 25} more</div>` : ''}
            </div>` : ''}
    `;

    const btn = document.getElementById('bomImpConfirmBtn');
    if (btn) btn.disabled = boms.length === 0;
}

async function confirmBOMImport(){
    if (!_bomImportParsed) { toast('No file loaded', 'error'); return; }
    const { boms, newItems } = _bomImportParsed;
    if (boms.length === 0) { toast('No valid BOMs', 'error'); return; }

    const mode = document.getElementById('bomImpMode').value;

    if (mode === 'replace') {
        if (!confirm(`⚠ REPLACE ALL mode:\n\nThis will DELETE all ${DB.bom.length} existing BOMs, then import ${boms.length} BOMs.\n\nContinue?`)) return;
        if (!confirm('This cannot be undone. Really proceed?')) return;
    }

    const btn = document.getElementById('bomImpConfirmBtn');
    btn.disabled = true;
    btn.textContent = 'Importing…';

    try {
        // ── STEP 1: Auto-create missing items ──
        if (newItems && newItems.length > 0) {
            btn.textContent = `Creating ${newItems.length} new items…`;
            const CHUNK = 500;
            let itemsCreated = 0;
            for (let i = 0; i < newItems.length; i += CHUNK) {
                const chunk = newItems.slice(i, i + CHUNK);
                const rows = chunk.map(r => ({
                    id: r.id,
                    code: r.code,
                    name: r.name,
                    cat: r.cat,
                    uom: r.uom,
                    cost: 0,
                    daily:   false,
                    weekly:  false,
                    monthly: false,
                    status:  'Active'
                }));
                const { error } = await SB.from('items').upsert(rows, { onConflict: 'id' });
                if (error) throw new Error('Item creation failed: ' + error.message);

                // Sync in-memory
                rows.forEach(r => {
                    const idx = DB.items.findIndex(x => x.id === r.id);
                    if (idx >= 0) Object.assign(DB.items[idx], r);
                    else DB.items.push({ ...r, createdAt: nowISO() });
                });
                itemsCreated += rows.length;
            }
            toast(`Created ${itemsCreated} new item(s) — D/W/M off`, 'success');
        }

        // ── STEP 2: Wipe BOMs if replace mode ──
        if (mode === 'replace') {
            btn.textContent = `Deleting ${DB.bom.length} existing BOMs…`;
            const { error: e1 } = await SB.from('bom_lines').delete().neq('bom_id', '___never___');
            if (e1) throw e1;
            const { error: e2 } = await SB.from('bom').delete().neq('id', '___never___');
            if (e2) throw e2;
            DB.bom = [];
        }

        // ── STEP 3: Import BOMs ──
        const existingByProduct = new Map();
        DB.bom.forEach(b => existingByProduct.set(norm(b.productId), b));

        let inserted = 0, updated = 0, skipped = 0, failed = 0;
let maxBomNum = 0;
DB.bom.forEach(b => {
    const num = parseInt(b.id.replace('BOM-', ''), 10);
    if (!isNaN(num) && num > maxBomNum) maxBomNum = num;
});

        for (const b of boms) {
            const key = norm(b.productId);
            const existing = existingByProduct.get(key);

            if (mode === 'add' && existing) { skipped++; continue; }

            const effective = todayISO();
            const version = 1;
            const status = 'Active';

            if (existing) {
                try {
                    const { error: eUpd } = await SB.from('bom').update({
                        product_name: b.productName,
                        cat: b.cat,
                        version, effective
                    }).eq('id', existing.id);
                    if (eUpd) throw eUpd;

                    const { error: eDel } = await SB.from('bom_lines').delete().eq('bom_id', existing.id);
                    if (eDel) throw eDel;

                    const { error: eIns } = await SB.from('bom_lines').insert(
                        b.lines.map(l => ({
                            bom_id: existing.id,
                            item_id: l.itemId,
                            item_code: l.itemCode,
                            item_name: l.itemName,
                            qty: l.qty,
                            uom: l.uom
                        }))
                    );
                    if (eIns) throw eIns;

                    existing.productName = b.productName;
                    existing.cat = b.cat;
                    existing.version = version;
                    existing.effective = effective;
                    existing.lines = b.lines.map(l => ({ ...l }));
                    updated++;
                } catch(err) {
                    console.error('Update failed for', b.productId, err);
                    failed++;
                }
            } else {
               maxBomNum++;
const id = 'BOM-' + String(maxBomNum).padStart(5, '0');
                try {
                    const { error: e1 } = await SB.from('bom').insert({
                        id, product_id: b.productId, product_name: b.productName,
                        cat: b.cat, version, effective, status
                    });
                    if (e1) throw e1;

                    const { error: e2 } = await SB.from('bom_lines').insert(
                        b.lines.map(l => ({
                            bom_id: id,
                            item_id: l.itemId,
                            item_code: l.itemCode,
                            item_name: l.itemName,
                            qty: l.qty,
                            uom: l.uom
                        }))
                    );
                    if (e2) throw e2;

                    const rec = {
                        id, productId: b.productId, productName: b.productName,
                        cat: b.cat, version, effective, status,
                        lines: b.lines.map(l => ({ ...l }))
                    };
                    DB.bom.push(rec);
                    existingByProduct.set(key, rec);
                    inserted++;
                } catch(err) {
                    console.error('Insert failed for', b.productId, err);
                    failed++;
                }
            }

            btn.textContent = `Importing BOMs… ${inserted + updated + skipped + failed} / ${boms.length}`;
        }

        _bomImportParsed = null;
        closeModal();
        const itemMsg = (newItems && newItems.length > 0) ? `${newItems.length} new items · ` : '';
        const msg = mode === 'replace'
            ? `${itemMsg}Replaced all BOMs — ${inserted} imported${failed > 0 ? `, ${failed} failed` : ''}`
            : mode === 'add'
                ? `${itemMsg}Added ${inserted} new BOMs${skipped > 0 ? `, skipped ${skipped}` : ''}${failed > 0 ? `, ${failed} failed` : ''}`
                : `${itemMsg}Imported ${inserted} new + ${updated} updated BOMs${failed > 0 ? `, ${failed} failed` : ''}`;
        toast(msg, failed > 0 ? 'error' : 'success');
        showPage('bom');

    } catch(err) {
        btn.disabled = false;
        btn.textContent = 'Import';
        toast('Import failed: ' + (err.message || err), 'error');
    }
}

async function approveTransfer(id){
