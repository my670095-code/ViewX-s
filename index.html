    const dup = DB.bom.find(b => norm(b.productId) === norm(productId) && b.id !== editId);
    if (dup) { toast(`Product ID "${productId}" already used`, 'error'); return; }
    const seen = new Set();
    for (const l of lines) {
        if (seen.has(l.itemId)) { toast(`Duplicate ingredient`, 'error'); return; }
        seen.add(l.itemId);
    }
    if (editId) {
        const b = DB.bom.find(x => x.id === editId);
        if (!b) { toast('Not found', 'error'); return; }
        b.productName = productName; b.cat = cat; b.version = version; b.effective = effective;

        audit('UPDATE','bom',b.id,{ productId, productName });
        closeModal(); toast('BOM updated', 'success');
    } else {
        const id = 'BOM-' + String(DB.bom.length + 1).padStart(5, '0');
        const rec = {
            id, productId, productName, cat, version, effective, status:'Active',
            lines: lines.map(l => ({ itemId: l.itemId, itemCode: l.itemCode, itemName: l.itemName, qty: l.qty, uom: l.uom }))
        };
        try { await DataLayer.insertBOM(rec); }

        DB.bom.push(rec);
        audit('CREATE','bom',id,{ productId, productName });
        closeModal(); toast('BOM created', 'success');

async function handleBOMImportFile(evt){
    const file = evt.target.files[0];
    if (!file) return;
    if (!XLSX_READY) { toast('Excel library still loading.', 'error'); evt.target.value=''; return; }
    const reader = new FileReader();
    reader.onload = function(e){
        try {
            const data = new Uint8Array(e.target.result);
            const wb = XLSX.read(data, { type:'array', cellDates: true });
            const sheet = wb.Sheets[wb.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(sheet, { defval:'', raw: true });
            parseBOMImport(rows, file.name);
        } catch(err) { toast('Parse failed: ' + err.message, 'error'); }
    };
    reader.readAsArrayBuffer(file);
    evt.target.value = '';
}
function parseBOMImport(rows, filename){
    if (rows.length === 0) { toast('File is empty', 'error'); return; }
    const H = {
        productId:   ['invd_item','invd item','product id','productid','product_code','product code','sku'],
        productName: ['mi_longname','mi longname','product name','productname','description'],
        itemCode:    ['code','item code','itemcode','item_code','ingredient code'],
        itemName:    ['name','item name','itemname','item_name','ingredient name'],
        category:    ['category','cat','group'],
        uom:         ['uom','unit','unit of measure'],
        qty:         ['qty','quantity','aug qty (as stored)','qty (as stored)','qty sold']
    };
    function pick(obj, keys){
        for (const k of Object.keys(obj)) {
            const n = k.toLowerCase().trim().replace(/\s+/g,' ');
            if (keys.includes(n)) return obj[k];
        }
        return undefined;
    }
    function pickQty(obj){
        const direct = pick(obj, H.qty);
        if (direct !== undefined && direct !== '') return direct;
        for (const k of Object.keys(obj)) {
            if (/qty|quantity/i.test(k)) return obj[k];
        }
        return undefined;
    }
    const itemByCode = new Map();
    DB.items.forEach(i => itemByCode.set(String(i.code).trim().toLowerCase(), i));
    const grouped = new Map();
    const newItems = new Map();
    const errors = [], warnings = [];
    rows.forEach((row, i) => {
        const rowNo = i + 2;
        const productIdRaw = String(pick(row, H.productId) || '').trim();
        const productNameRaw = String(pick(row, H.productName) || '').trim();
        const itemCodeRaw = String(pick(row, H.itemCode) || '').trim();
        const itemNameRaw = String(pick(row, H.itemName) || '').trim();
        const catRaw = String(pick(row, H.category) || '').trim() || 'Uncategorized';
        const uomRaw = String(pick(row, H.uom) || '').trim() || 'PCS';
        const qtyRaw = pickQty(row);
        if (!productIdRaw && !itemCodeRaw && qtyRaw === '') return;
        if (!productIdRaw) { errors.push({ line: rowNo, msg: 'Missing INVD_ITEM' }); return; }
        if (!itemCodeRaw) { errors.push({ line: rowNo, msg: `Product "${productIdRaw}": missing ingredient Code` }); return; }
        const qty = Number(qtyRaw);
        if (isNaN(qty) || qty <= 0) { errors.push({ line: rowNo, msg: `Invalid qty "${qtyRaw}"` }); return; }
        const key = itemCodeRaw.toLowerCase();
        let item = itemByCode.get(key);
        if (!item) {
            if (!newItems.has(key)) {
                const newId = 'i-' + itemCodeRaw.toLowerCase().replace(/[^a-z0-9]/g, '');
                newItems.set(key, { id: newId, code: itemCodeRaw, name: itemNameRaw || itemCodeRaw, cat: catRaw, uom: uomRaw, cost: 0 });
            }
            item = newItems.get(key);
        }
        const prodKey = productIdRaw.toLowerCase();
        if (!grouped.has(prodKey)) {
            grouped.set(prodKey, { productId: productIdRaw, productName: productNameRaw || productIdRaw, cat: catRaw, lines: [], seenItems: new Set() });
        }
        const g = grouped.get(prodKey);
        if (g.seenItems.has(item.id)) {
            const existing = g.lines.find(l => l.itemId === item.id);
            existing.qty += qty;
            return;
        }
        g.seenItems.add(item.id);
        g.lines.push({ itemId: item.id, itemCode: item.code, itemName: item.name, qty, uom: uomRaw || item.uom || 'PCS' });
    });
    const boms = [...grouped.values()].map(g => ({ productId: g.productId, productName: g.productName, cat: g.cat, lines: g.lines }));
    const newItemList = [...newItems.values()];
    _bomImportParsed = { boms, newItems: newItemList, errors, warnings, filename };
    const totalLines = boms.reduce((s,b) => s + b.lines.length, 0);
    const sample = boms.slice(0, 5);
    document.getElementById('bomImpPreview').innerHTML = `
        <div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:6px;padding:10px 12px;font-size:13px;margin-bottom:10px">
            <b>File:</b> ${esc(filename)} · <span class="green"><b>${boms.length}</b> BOMs</span> · <span class="green"><b>${totalLines}</b> lines</span>
            ${newItemList.length > 0 ? ` · <span style="color:#7c3aed">${newItemList.length} new items</span>` : ''}
            ${errors.length > 0 ? ` · <span class="red">${errors.length} errors</span>` : ''}
        </div>
        ${sample.length > 0 ? `<div style="max-height:220px;overflow-y:auto;border:1px solid #e5e7eb;border-radius:6px">
            <table style="font-size:12px"><thead><tr><th>Product ID</th><th>Name</th><th>Lines</th></tr></thead>
            <tbody>${sample.map(b => `<tr><td><span class="bom-pid">${esc(b.productId)}</span></td><td>${esc(b.productName)}</td><td>${b.lines.length}</td></tr>`).join('')}</tbody></table>
        </div>` : ''}
        ${errors.length > 0 ? `<div style="margin-top:10px;background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:10px;font-size:12px;max-height:150px;overflow-y:auto">
            <b style="color:#b91c1c">Errors:</b>${errors.slice(0, 25).map(e => `<div>Line ${e.line}: ${esc(e.msg)}</div>`).join('')}</div>` : ''}
    `;
    const btn = document.getElementById('bomImpConfirmBtn');
    if (btn) btn.disabled = boms.length === 0;
}
async function confirmBOMImport(){
    if (!_bomImportParsed) { toast('No file loaded', 'error'); return; }
    const { boms, newItems } = _bomImportParsed;
    if (boms.length === 0) { toast('No valid BOMs', 'error'); return; }
    const mode = document.getElementById('bomImpMode').value;
    if (mode === 'replace') {
        if (!confirm(`⚠ REPLACE ALL: DELETE all ${DB.bom.length} BOMs then import ${boms.length}?`)) return;
        if (!confirm('This cannot be undone. Really proceed?')) return;
    }
    const btn = document.getElementById('bomImpConfirmBtn');
    btn.disabled = true; btn.textContent = 'Importing…';
    try {
        if (newItems && newItems.length > 0) {
            btn.textContent = `Creating ${newItems.length} new items…`;
            const CHUNK = 500;
            for (let i = 0; i < newItems.length; i += CHUNK) {
                const chunk = newItems.slice(i, i + CHUNK);
                const rows = chunk.map(r => ({
                    id: r.id, code: r.code, name: r.name, cat: r.cat, uom: r.uom,
                    cost: 0, daily: false, weekly: false, monthly: false, status: 'Active'
                }));
                const { error } = await SB.from('items').upsert(rows, { onConflict: 'id' });
                if (error) throw new Error('Item creation failed: ' + error.message);
                rows.forEach(r => {
                    const idx = DB.items.findIndex(x => x.id === r.id);
                    if (idx >= 0) Object.assign(DB.items[idx], r);
                    else DB.items.push({ ...r, createdAt: nowISO() });
                });
            }
            toast(`Created ${newItems.length} new items`, 'success');
        }
        if (mode === 'replace') {
            const { error: e1 } = await SB.from('bom_lines').delete().neq('bom_id', '___never___');
            if (e1) throw e1;
            const { error: e2 } = await SB.from('bom').delete().neq('id', '___never___');
            if (e2) throw e2;
            DB.bom = [];
        }
        const existingByProduct = new Map();
        DB.bom.forEach(b => existingByProduct.set(norm(b.productId), b));
        let inserted = 0, updated = 0, skipped = 0, failed = 0;
        let maxBomNum = 0;
        DB.bom.forEach(b => {
            const num = parseInt(b.id.replace('BOM-', ''), 10);
            if (!isNaN(num) && num > maxBomNum) maxBomNum = num;
        });
        for (const b of boms) {
            const key = norm(b.productId);
            const existing = existingByProduct.get(key);
            if (mode === 'add' && existing) { skipped++; continue; }
            const effective = todayISO();
            const version = 1;
            if (existing) {
                try {
                    const { error: eUpd } = await SB.from('bom').update({ product_name: b.productName, cat: b.cat, version, effective }).eq('id', existing.id);
                    if (eUpd) throw eUpd;
                    const { error: eDel } = await SB.from('bom_lines').delete().eq('bom_id', existing.id);
                    if (eDel) throw eDel;
                    const { error: eIns } = await SB.from('bom_lines').insert(b.lines.map(l => ({
                        bom_id: existing.id, item_id: l.itemId, item_code: l.itemCode, item_name: l.itemName, qty: l.qty, uom: l.uom
                    })));
                    if (eIns) throw eIns;
                    existing.productName = b.productName;
                    existing.cat = b.cat;
                    existing.version = version;
                    existing.effective = effective;
                    existing.lines = b.lines.map(l => ({ ...l }));
                    updated++;
                } catch(err) { failed++; }
            } else {
                maxBomNum++;
                const id = 'BOM-' + String(maxBomNum).padStart(5, '0');
                try {
                    const { error: e1 } = await SB.from('bom').insert({
                        id, product_id: b.productId, product_name: b.productName,
                        cat: b.cat, version, effective, status: 'Active'
                    });
                    if (e1) throw e1;
                    const { error: e2 } = await SB.from('bom_lines').insert(b.lines.map(l => ({
                        bom_id: id, item_id: l.itemId, item_code: l.itemCode, item_name: l.itemName, qty: l.qty, uom: l.uom
                    })));
                    if (e2) throw e2;
                    const rec = { id, productId: b.productId, productName: b.productName, cat: b.cat, version, effective, status: 'Active', lines: b.lines.map(l => ({ ...l })) };
                    DB.bom.push(rec);
                    existingByProduct.set(key, rec);
                    inserted++;
                } catch(err) { failed++; }
            }
        }
        _bomImportParsed = null;
        closeModal();
        toast(`Imported ${inserted} new + ${updated} updated${failed > 0 ? `, ${failed} failed` : ''}`, failed > 0 ? 'error' : 'success');
        showPage('bom');
    } catch(err) {
        btn.disabled = false; btn.textContent = 'Import';
        toast('Import failed: ' + (err.message || err), 'error');
    }
}

/* ---------- SALES UPLOAD (Daily only) ---------- */
    /* ══════════════════════════════════════════════════════════════
   Sales file normalizer — detects 2 file formats:
   A) POS "Product Mix Report"  (grouped, has "Category NN" headers)
   B) Flat "Item Wise Consumption" export  (INVD_ITEM / QTY columns)
   Both return: [{ itemCode, qty }]
   ══════════════════════════════════════════════════════════════ */
function normalizeSalesFile(aoa) {
    if (!aoa || aoa.length === 0) return { rows: [], format: 'empty' };

    // Look at the first ~40 rows for signature strings
    const probe = aoa.slice(0, 40).map(r =>
        (r || []).map(c => String(c || '').trim())
    );
    const flat = probe.flat().map(s => s.toLowerCase());

    const isProductMix =
        flat.some(s => s.startsWith('category ')) ||
        flat.some(s => s === 'item#' || s === 'item #') ||
        flat.some(s => /^dob total$/i.test(s));

    const isFlatConsumption =
        probe.some(row => row.some(c => /^invd_item$/i.test(c))) ||
        probe.some(row => row.some(c => /^invd_str_id$/i.test(c)));

    if (isFlatConsumption) return parseFlatConsumption(aoa);
    if (isProductMix)      return parseProductMix(aoa);

    return { rows: [], format: 'unknown' };
}

/* ── Format B: flat "Item Wise Consumption" export ── */
function parseFlatConsumption(aoa) {
    let headerIdx = -1;
    for (let i = 0; i < Math.min(aoa.length, 20); i++) {
        const lc = (aoa[i] || []).map(c => String(c||'').trim().toLowerCase());
        if (lc.includes('invd_item') && lc.includes('qty')) { headerIdx = i; break; }
    }
    if (headerIdx < 0) return { rows: [], format: 'flat', error: 'No header row' };

    const hdr = (aoa[headerIdx] || []).map(c => String(c||'').trim().toLowerCase());
    const idx = {
        item:  hdr.indexOf('invd_item'),
        qty:   hdr.indexOf('qty'),
        cat:   hdr.indexOf('invd_category'),
        date:  hdr.indexOf('invd_dob'),
        store: hdr.indexOf('invd_str_id')
    };

    const byItem = new Map();
    const SKIP_CATS = new Set(['94','115','152','0']);

    for (let i = headerIdx + 1; i < aoa.length; i++) {
        const row = aoa[i] || [];
        const cat = String(row[idx.cat] ?? '').trim();
        if (SKIP_CATS.has(cat)) continue;

        const code = String(row[idx.item] ?? '').trim();
        if (!code) continue;
        if (/^800/.test(code)) continue;   // modifier SKUs

        const qty = Number(row[idx.qty]);
        if (!qty || qty <= 0) continue;

        byItem.set(code, (byItem.get(code) || 0) + qty);
    }
    return {
        rows: [...byItem].map(([itemCode, qty]) => ({ itemCode, qty })),
        format: 'flat'
    };
}

/* ── Format A: POS "Product Mix Report" (grouped text) ── */
function parseProductMix(aoa) {
    const byItem = new Map();
    const SKIP_CATS = new Set(['94','115','152']);

    let inSkipCategory = false;

    for (let i = 0; i < aoa.length; i++) {
        const row = (aoa[i] || []).map(c => String(c == null ? '' : c).trim());
        const line = row.join(' ').trim();
        if (!line) continue;

        // Category header:  "Category 10   Drip Coffee"
        const catMatch = line.match(/^Category\s+(\d+)\b/i);
        if (catMatch) {
            inSkipCategory = SKIP_CATS.has(catMatch[1]);
            continue;
        }

        // Totals / footer / column-header lines → skip
        if (/^Total\b/i.test(line))      continue;
        if (/^DOB Total\b/i.test(line))  continue;
        if (/^Grand Total\b/i.test(line)) continue;
        if (/^Item\s*#/i.test(row[0]))   continue;

        if (inSkipCategory) continue;

        // Data row: [itemCode, itemName, qty, price]
        const code = row[0];
        const qty  = Number(row[2]);
        if (!/^\d{4,}$/.test(code)) continue;
        if (!qty || qty <= 0) continue;
        if (/^800/.test(code)) continue;

        byItem.set(code, (byItem.get(code) || 0) + qty);
    }
    return {
        rows: [...byItem].map(([itemCode, qty]) => ({ itemCode, qty })),
        format: 'productmix'
    };
}

async function handleSalesUpload(evt){
    const file = evt.target.files[0];
    if (!file) return;
    if (!XLSX_READY) { toast('Excel library loading', 'error'); evt.target.value=''; return; }
    if (!can('uploadSales')) { toast('Access denied', 'error'); return; }

    const selectedStoreId = document.getElementById('salesUploadStore')?.value || '';
    if (!selectedStoreId) {
        toast('Please select a store first.', 'error');
        evt.target.value = '';
        return;
    }
    if (!isInScope(selectedStoreId, currentUser())) {
        toast('Selected store is out of your scope.', 'error');
        evt.target.value = '';
        return;
    }

    const batchDate = (document.getElementById('salesBatchDate')?.value) || todayISO();
    const u = currentUser();

    // Warn once if user is re-uploading over a staged file for the same store+date
    try {
        const existing = await StagedFiles.find(u.id, selectedStoreId, batchDate, 'sales');
        if (existing.length > 0) {
            if (!confirm('A staged sales file already exists for this store and date. Replace it?')) {
                evt.target.value = '';
                return;
            }
            await StagedFiles.deleteFor(u.id, selectedStoreId, batchDate);
        }
    } catch(e) { console.warn('Staged check failed', e); }

    const monthTag = monthTagFromISO(batchDate);
    const isTxt = /\.txt$/i.test(file.name);

    const reader = new FileReader();
    reader.onload = async function(e){
        try {
            let wb;
            if (isTxt) {
                // Read as text so SheetJS treats the report as CSV
                wb = XLSX.read(e.target.result, { type: 'string' });
            } else {
                const data = new Uint8Array(e.target.result);
                wb = XLSX.read(data, { type:'array', cellDates: true });
            }
            const sheet = wb.Sheets[wb.SheetNames[0]];
            // Read as raw rows so we can inspect the report structure
            const aoa = XLSX.utils.sheet_to_json(sheet, { header:1, defval:'', raw:true });

            const { rows, format } = normalizeSalesFile(aoa);
            if (rows.length === 0) {
                toast('No valid Item Code + Qty rows found in this file.', 'error');
                evt.target.value = '';
                return;
            }
            console.log('[sales upload] format=' + format + ' rows=' + rows.length);

            // Convert to flat { Product ID, Qty } that processSalesRows expects
            const flatRows = rows.map(r => ({ 'Product ID': r.itemCode, 'Qty': r.qty }));
            await processSalesRows(flatRows, file.name, {
                batchDate, monthTag, forcedStoreId: selectedStoreId,
                detectedFormat: format
            });
        } catch(err) { toast('Parse failed: ' + err.message, 'error'); }
    };

    if (isTxt) {
        reader.readAsText(file);
    } else {
        reader.readAsArrayBuffer(file);
    }
    evt.target.value = '';
}
async function processSalesRows(rows, filename, tag){
    const u = currentUser();
    const myStoreIds = new Set(getMyStores(u));
    if (rows.length === 0) { toast('File is empty', 'error'); return; }

    const parsed = [], rejects = [];
    const forcedStore = tag.forcedStoreId ? getStore(tag.forcedStoreId) : null;
    if (!forcedStore) { toast('Selected store not found.', 'error'); return; }
    if (!myStoreIds.has(forcedStore.id)) { toast('Selected store is out of your scope.', 'error'); return; }

    // Rows arrive pre-normalized as { 'Product ID': '...', 'Qty': ... }
    rows.forEach((row, i) => {
        const lineNo = i + 1;
        const productId = String(row['Product ID'] ?? '').trim();
        const qtyRaw    = row['Qty'];

        if (!productId) { rejects.push(`Row ${lineNo}: missing Item Code`); return; }
        if (/^800/.test(productId)) {
            tag._modifierSkipped = (tag._modifierSkipped || 0) + 1;
            return;
        }

        const qty = Number(qtyRaw);
        if (!qty || qty <= 0) { rejects.push(`Row ${lineNo}: invalid Qty "${qtyRaw}"`); return; }

        const bom = getBOMByProductId(productId);
        if (!bom) { rejects.push(`Row ${lineNo}: No BOM for Item Code "${productId}"`); return; }

        parsed.push({
            lineNo,
            storeId: forcedStore.id,
            storeCode: forcedStore.code,
            productId: bom.productId,
            bomId: bom.id,
            qty
        });
    });
        toast('No valid rows to import', 'error');
        if (rejects.length > 0) showRejectReport(rejects, filename);
        return;
    }
    let totalUnits = 0;
    const byStore = {};
    parsed.forEach(p => { (byStore[p.storeId] = byStore[p.storeId] || []).push(p); });
    for (const [storeId, lines] of Object.entries(byStore)) {
        const uploadId = nextMovementId('SAL', DB.salesUploads, tag.batchDate);
        const consumed = {};
        lines.forEach(sl => {
            totalUnits += sl.qty;
            const bom = DB.bom.find(b => b.id === sl.bomId);
            if (!bom) return;
            bom.lines.forEach(l => {
                const totalQty = Number(l.qty) * sl.qty;
                if (!consumed[l.itemId]) consumed[l.itemId] = { itemId: l.itemId, uom: l.uom, qty: 0, breakdown: [] };
                consumed[l.itemId].qty += totalQty;
                consumed[l.itemId].breakdown.push({ productId: sl.productId, productName: bom.productName, soldQty: sl.qty, perUnit: Number(l.qty), exploded: totalQty });
            });
        });
        const uploadRec = {
            id: uploadId,
            filename,
            storeId,
            date: tag.batchDate,
            batchDate: tag.batchDate,
            inventoryType: 'daily',
            week: null,
            month: tag.monthTag,
            totalRows: rows.length,
            validRows: lines.length,
            rejectedRows: rejects.length,
            unitsSold: lines.reduce((s,x) => s + x.qty, 0),
            lines: lines.map(sl => ({ productId: sl.productId, qty: sl.qty })),
            byId: u.id, byName: u.name, status:'Processed', createdAt: nowISO()
        };
        const ledgerLines = Object.values(consumed).map(c => ({
            itemId: c.itemId, qty: Number(c.qty.toFixed(4)), uom: c.uom, breakdown: c.breakdown
        }));
        const ledgerRec = {
            id: uploadId + '-LEDGER',
            storeId,
            date: tag.batchDate,
            uploadRef: uploadId,
            source: 'sales-bom',
            inventoryType: 'daily',
            week: null,
            month: tag.monthTag,
            byId: u.id, byName: u.name, lines: ledgerLines, createdAt: nowISO()
        };
             // ★ Stage locally — do NOT post to Supabase yet.
        try {
            await StagedFiles.put({
                ownerId: u.id,
                storeId,
                date: tag.batchDate,
                type: 'sales',
                fileName: filename,
                payload: { uploadRec, ledgerRec }
            });
        } catch(err) {
            toast('Local staging failed: ' + (err.message || err), 'error');
            return;
        }
    }
    audit('UPLOAD','sales','',{ valid:parsed.length, rejects:rejects.length, totalUnits });
    saveData();

    const catSkipped = tag._categorySkipped || 0;
    const modSkipped = tag._modifierSkipped || 0;
    const nonProductSkipped = catSkipped + modSkipped;
    const toastMsg =
        `Uploaded ${parsed.length} row(s), ${totalUnits} units` +
        (nonProductSkipped > 0 ? `, ${nonProductSkipped} non-product rows skipped` : '') +
        (rejects.length > 0 ? `, ${rejects.length} rejected` : '');

    if (rejects.length > 0) {
        openModal('Upload Completed with Rejections', `
            <p style="font-size:13px;color:#6b7280;margin-bottom:12px">File: <b>${esc(filename)}</b></p>
            <div class="reject-list">${rejects.map(r => `<div>${esc(r)}</div>`).join('')}</div>
        `, `<button class="btn-primary" onclick="closeModal();showPage('sales')">OK</button>`);
        toast(toastMsg, 'success');
    } else {
        toast(toastMsg, 'success');
        showPage('sales');
    }
}

            parseAuditOpening(aoa, file.name);
        } catch(err) { toast('Parse failed: ' + err.message, 'error'); }
    };
    reader.readAsArrayBuffer(file);
    evt.target.value = '';
}

function parseAuditOpening(aoa, filename){
    if (!aoa || aoa.length === 0) { toast('File is empty', 'error'); return; }
    const normCell = s => String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
    let headerIdx = -1, skuCol = -1, qtyCol = -1, uomCol = -1;
    for (let r = 0; r < aoa.length; r++) {
        const row = aoa[r] || [];
        const lowered = row.map(normCell);
        const sIdx = lowered.findIndex(c => c === 'sku');
        const qIdx = lowered.findIndex(c => c === 'counted');
        if (sIdx >= 0 && qIdx >= 0) {
            headerIdx = r; skuCol = sIdx; qtyCol = qIdx;
            uomCol = lowered.findIndex(c => c === 'storageuom' || c === 'uom' || c === 'unit');
            break;
        }
    }
    if (headerIdx < 0) { toast('No header row with "SKU" and "Counted" found.', 'error'); return; }

    const itemByCode = new Map();
    DB.items.forEach(i => itemByCode.set(String(i.code).trim().toLowerCase(), i));

    const valid = [], rejects = [];
    const seen = new Set();
    for (let r = headerIdx + 1; r < aoa.length; r++) {
        const row = aoa[r] || [];
        const skuRaw = String(row[skuCol] ?? '').trim();
        const qtyRaw = row[qtyCol];
        if (!skuRaw && (qtyRaw === '' || qtyRaw === undefined || qtyRaw === null)) continue;
        const lineNo = r + 1;
        if (!skuRaw) { rejects.push({ line: lineNo, reason: 'Missing SKU' }); continue; }
        const sku = skuRaw.replace(/[^a-zA-Z0-9._-]/g, '');
        if (seen.has(sku)) { rejects.push({ line: lineNo, reason: `Duplicate SKU "${sku}"` }); continue; }
        seen.add(sku);
        const item = itemByCode.get(sku.toLowerCase());
        if (!item) { rejects.push({ line: lineNo, reason: `SKU "${sku}" not in Item Master` }); continue; }
        const qty = Number(qtyRaw);
        if (isNaN(qty)) { rejects.push({ line: lineNo, reason: `Invalid Counted "${qtyRaw}"` }); continue; }
        valid.push({
            itemId: item.id, itemCode: item.code, itemName: item.name, qty,
            uom: (uomCol >= 0 && String(row[uomCol]||'').trim()) || item.uom || 'PCS'
        });
    }
    _auditOpeningParsed = { valid, rejects, filename };

    const sample = valid.slice(0, 10);
    document.getElementById('auditOpeningPreview').innerHTML = `
        <div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:6px;padding:10px 12px;font-size:13px;margin-bottom:10px">
            <b>File:</b> ${esc(filename)} · <span class="green"><b>${valid.length}</b> valid</span>
            ${rejects.length ? ` · <span class="red">${rejects.length} rejected</span>` : ''}
        </div>
        ${sample.length > 0 ? `<div style="max-height:200px;overflow-y:auto;border:1px solid #e5e7eb;border-radius:6px">
            <table style="font-size:12px"><thead><tr><th>SKU</th><th>Item</th><th style="text-align:right">Qty</th></tr></thead>
            <tbody>${sample.map(r => `<tr><td>${esc(r.itemCode)}</td><td>${esc(r.itemName)}</td><td style="text-align:right">${fmtNum(r.qty)}</td></tr>`).join('')}</tbody></table>
        </div>` : ''}
    `;
    const btn = document.getElementById('auditStartBtn');
    if (btn) btn.disabled = valid.length === 0;
}

function renderReceivingRows(){
    const j = window._receivingJournal;
    if (!j) return;

    const q = (document.getElementById('rSearch')?.value || '').toLowerCase().trim();
    let rows = j.lines.map((l, idx) => {
        const it = getItem(l.itemId) || DB.items.find(x => x.code === l.itemCode);
        return {
            idx,
            code: it ? it.code : (l.itemCode || ''),
            name: it ? it.name : (l.itemName || 'Unknown'),
            uom: l.uom,
            opening: Number(l.opening) || 0,
            consumption: Number(l.consumption) || 0,
            received: Number(l.received) || 0,
            expected: Number(l.expected) || 0,
            physical: Number(l.physical) || 0,
            variance: Number(l.variance) || 0
        };
    });

    if (q) rows = rows.filter(r => r.code.toLowerCase().includes(q) || r.name.toLowerCase().includes(q));

    const s = window._receivingSort;
    rows.sort((a,b) => {
        if (s.key === 'varianceAbs') return (Math.abs(a.variance) - Math.abs(b.variance)) * s.dir;
        if (s.key === 'variance')    return (a.variance - b.variance) * s.dir;
        return String(a[s.key]).localeCompare(String(b[s.key])) * s.dir;
    });

    document.getElementById('receivingBody').innerHTML = rows.map(r => {
        const v = r.variance;
        const vClass = v > 0 ? 'red' : v < 0 ? 'green' : '';
        return `<tr data-idx="${r.idx}">
            <td><b>${esc(r.code)}</b></td>
            <td>${esc(r.name)}</td>
            <td>${esc(r.uom)}</td>
            <td style="text-align:right">${fmtNum(r.opening)}</td>
            <td style="text-align:right;color:#ea580c">${fmtNum(r.consumption)}</td>
            <td style="text-align:right"><b data-expected>${fmtNum(r.expected)}</b></td>
            <td style="text-align:right">${fmtNum(r.physical)}</td>
            <td style="text-align:right">
                <input type="number" step="0.01" value="${r.received || ''}" placeholder="0"
                       oninput="updateReceivingLine(${r.idx}, this.value)" style="width:100px">
            </td>
            <td style="text-align:right" class="${vClass}" data-variance>${v>0?'+':''}${fmtNum(v)}</td>
        </tr>`;
    }).join('') || '<tr><td colspan="9" style="text-align:center;padding:24px;color:#9ca3af">No items match</td></tr>';
}

function updateReceivingLine(idx, value){
    const j = window._receivingJournal;
    if (!j) return;
    const line = j.lines[idx];
    if (!line) return;

    const received = value === '' ? 0 : Number(value) || 0;
    line.received = received;
    line.expected = (Number(line.opening) || 0) + received - (Number(line.consumption) || 0);
    line.variance = (Number(line.physical) || 0) - line.expected;

    const tr = document.querySelector(`#receivingBody tr[data-idx="${idx}"]`);
    if (tr) {
        const eCell = tr.querySelector('[data-expected]');
        const vCell = tr.querySelector('[data-variance]');
        if (eCell) eCell.textContent = fmtNum(line.expected);
        if (vCell) {
            const v = line.variance;
            vCell.textContent = (v>0?'+':'') + fmtNum(v);
            vCell.className = v > 0 ? 'red' : v < 0 ? 'green' : '';
            vCell.style.textAlign = 'right';
        }
    }
    updateReceivingProgress();
}

function updateReceivingProgress(){
    const j = window._receivingJournal;
    if (!j) return;

function bulkSetReceiving(){
    const el = document.getElementById('rBulkVal');
    if (!el) return;
    const val = Number(el.value);
    if (isNaN(val)) { toast('Enter a number', 'error'); return; }
    const j = window._receivingJournal;
    if (!j) return;
    j.lines.forEach(l => {
        l.received = val;
        l.expected = (Number(l.opening) || 0) + val - (Number(l.consumption) || 0);
        l.variance = (Number(l.physical) || 0) - l.expected;
    });
    renderReceivingRows();
    updateReceivingProgress();
    toast(`Set Received = ${val} on all lines`, 'success');
}

async function submitReceiving(){
    const j = window._receivingJournal;
    if (!j) return;
    const u = currentUser();

    j.auditStage = 'awaiting_store';
    j.audit_stage = 'awaiting_store';

    // Recompute in case any line wasn't touched
    j.lines.forEach(l => {
        l.received = Number(l.received) || 0;
        l.expected = (Number(l.opening) || 0) + l.received - (Number(l.consumption) || 0);
        l.variance = (Number(l.physical) || 0) - l.expected;
    });

    try {
        if (CLOUD_MODE === 'supabase') {
            await DataLayer.submitJournal(j);
        }
    } catch(err) {
        toast('Resubmit failed: ' + (err.message || err), 'error');
        return;
    }

    // Merge back into in-memory DB
    const idx = DB.journals.findIndex(x => x.id === j.id);
    if (idx >= 0) DB.journals[idx] = j;
    else DB.journals.push(j);

    window._receivingJournal = null;
    closeModal();
    toast(`Audit ${j.id} sent to store — awaiting response`, 'success');
    showPage('daily');
}

async function submitAcknowledgment(){
    const j = window._ackJournal;
    if (!j) return;
    const plan = (document.getElementById('actionPlanText')?.value || '').trim();
    if (plan.length < 5) { toast('Action plan is too short.', 'error'); return; }

    const u = currentUser();
    const now = nowISO();

    j.auditStage = 'acknowledged';
    j.audit_stage = 'acknowledged';
    j.actionPlan = plan;
    j.actionPlanBy = u.name;
    j.actionPlanAt = now;
    j.acknowledgedById = u.id;
    j.acknowledgedByName = u.name;
    j.acknowledgedAt = now;

    try {
        if (CLOUD_MODE === 'supabase') {
            // Update journal header
            const { error: eH } = await SB.from('journals').update({
                audit_stage: 'acknowledged',
                action_plan: plan,
                action_plan_by: u.name,
                action_plan_at: now,
                acknowledged_by_id: u.id,
                acknowledged_by_name: u.name,
                acknowledged_at: now
            }).eq('id', j.id);
            if (eH) throw eH;

            // Update lines with store remarks
            for (const line of j.lines) {
                const remark = line.storeRemark || line.store_remark || '';
                if (!remark) continue;
                const { error: eL } = await SB.from('journal_lines').update({
                    store_remark: remark,
                    store_remark_by: line.storeRemarkBy || line.store_remark_by || u.name,
                    store_remark_at: line.storeRemarkAt || line.store_remark_at || now
                }).eq('journal_id', j.id).eq('item_id', line.itemId);
                if (eL) console.warn('Line remark update failed:', eL.message);
            }
        }
    } catch(err) {
        toast('Acknowledge failed: ' + (err.message || err), 'error');
        return;
    }

    // Close action plan + ack sheet
    document.getElementById('actionPlanModal')?.remove();
    closeModal();
    window._ackJournal = null;

    toast('Audit acknowledged successfully.', 'success');
    showPage('daily');
}

                <td style="font-size:11px">${new Date(v.voidedAt).toLocaleString()}</td>
                <td class="actions-cell">
                   <button class="btn-success btn-xs" onclick="restoreVoided('${v.id}').then(()=>showPage('recycle'))">Restore</button>
                    <button class="btn-danger btn-xs" onclick="purgeVoided('${v.id}')">Purge</button>
                </td></tr>`).join('')}</tbody></table>`;
}
async function emptyRecycleBin(){
    if (DB.voidedRecords.length === 0) { toast('Already empty', 'error'); return; }
    if (!confirm(`Permanently delete ALL ${DB.voidedRecords.length} voided records?`)) return;

    if (CLOUD_MODE === 'supabase') {
        const { error } = await SB.from('voided_records').delete().neq('id', '00000000-0000-0000-0000-000000000000');
        if (error) { toast('Empty failed: ' + error.message, 'error'); return; }
    }

    DB.voidedRecords = [];
    saveData();
    toast('Recycle bin emptied', 'success');
    showPage('recycle');
}

/* ---------- BACKUP ---------- */
RENDERERS.backup = function(){
    if (!can('backupRestore')) return '<div class="denied">Admin only.</div>';
    const sizeKB = storageSizeKB();
    return `
    <div class="cards">
        <div class="card"><div class="card-label">Storage</div><div class="card-value">${sizeKB} KB</div></div>
        <div class="card"><div class="card-label">Journals</div><div class="card-value">${DB.journals.length}</div></div>
        <div class="card"><div class="card-label">Sales Uploads</div><div class="card-value">${DB.salesUploads.length}</div></div>
                <div class="card"><div class="card-label">BOMs</div><div class="card-value">${DB.bom.length}</div></div>
    </div>
    <div class="panel">
        <div class="panel-header"><div class="panel-title">Backup</div></div>
        <div class="panel-body">
            <button class="btn-primary" onclick="exportFullBackup()">Download Backup (JSON)</button>
        </div>
    </div>
    <div class="panel">
        <div class="panel-header"><div class="panel-title">Restore</div></div>
        <div class="panel-body">
            <div class="upload-drop" onclick="document.getElementById('restoreFile').click()">
                <div class="upload-icon">📂</div>
                <div class="upload-text">Click to restore</div>
            </div>
            <input type="file" id="restoreFile" class="upload-file" accept=".json" onchange="restoreFromFile(event)">
        </div>
    </div>
    <div class="panel">
        <div class="panel-header"><div class="panel-title">Danger Zone</div></div>
        <div class="panel-body">
            <button class="btn-danger" onclick="resetAllData()">Reset All Data</button>
        </div>
    </div>`;
};
function restoreFromFile(evt){
    const file = evt.target.files[0];
    if (!file) return;
    if (!confirm('Replace all data?')) return;
    const reader = new FileReader();
    reader.onload = e => {
        try {
            const d = JSON.parse(e.target.result);
            if (!isValidData(d)) throw new Error('Invalid file');
            localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
            toast('Restored', 'success');
            setTimeout(()=>location.reload(), 800);
        } catch(err) { toast('Invalid: '+err.message, 'error'); }
    };
    reader.readAsText(file);
    evt.target.value = '';
}
function resetAllData(){
    if (!confirm('Reset ALL? Cannot undo.')) return;
    if (!confirm('Really?')) return;
    LEGACY_KEYS.concat([STORAGE_KEY]).forEach(k => localStorage.removeItem(k));
    clearSession(); location.reload();
}

/* ---------- MODAL ---------- */
function openModal(title, body, footer){
    const mb = document.getElementById('modalBox');
    mb.className = 'modal';
    document.getElementById('modalTitle').innerHTML = title;
    document.getElementById('modalBody').innerHTML = body;
    document.getElementById('modalFooter').innerHTML = footer || '<button class="btn-light" onclick="closeModal()">Close</button>';
    document.getElementById('modalOverlay').classList.add('show');
}
function closeModal(){
    document.getElementById('modalOverlay').classList.remove('show');
    document.getElementById('modalBox').className = 'modal';
}

document.addEventListener('DOMContentLoaded', async () => {
    document.getElementById('loginPass').addEventListener('keydown', e => { if (e.key==='Enter') doLogin(); });
    document.getElementById('loginUser').addEventListener('keydown', e => { if (e.key==='Enter') document.getElementById('loginPass').focus(); });
    document.getElementById('modalOverlay').addEventListener('click', e => { if (e.target.id==='modalOverlay') closeModal(); });
    const hb = document.getElementById('hamburgerBtn');
    const bd = document.getElementById('sidebarBackdrop');
    if (hb) hb.addEventListener('click', toggleSidebar);
    if (bd) bd.addEventListener('click', closeSidebar);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSidebar(); });

    try {
        if (CLOUD_MODE === 'local') {
            DB = await loadData();
        }
        await bootApp();
    } catch(e) {
        console.error('Boot error:', e);
        alert('Startup error: ' + (e.message || e));
    }
});
</script>
