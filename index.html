    if (!canApproveForStore(t.fromStoreId, u)) { toast('Only the assigned Area Manager can approve.', 'error'); return; }
    if (!confirm(`Approve transfer ${t.id}?\n\nSource: ${storeLabel(t.fromStoreId)}\n\nDestination: ${storeLabel(t.toStoreId)}\n\nApproval will move inventory immediately.`)) return;

    try {
        if (CLOUD_MODE === 'supabase') {
            await DataLayer.approveTransfer(id, u);
        }
        t.status = 'Approved';
        t.approvedAt = nowISO();
        t.approvedById = u.id;
        t.approvedByName = u.name;
        audit('APPROVE','transfer',id,{ });
        saveData();
        toast(`Transfer ${id} approved — inventory updated`, 'success');
        showPage('transfers');
    } catch(err) {
        toast('Approve failed: ' + (err.message || err), 'error');
    }
}

async function handleSalesUpload(evt){
    const file = evt.target.files[0];
    if (!file) return;
    if (!XLSX_READY) { toast('Excel library loading', 'error'); evt.target.value=''; return; }
    if (!can('uploadSales')) { toast('Access denied', 'error'); return; }
    const batchDate = (document.getElementById('salesBatchDate')?.value) || todayISO();
    const inventoryType = document.getElementById('salesInvType')?.value || 'daily';
    const week = inventoryType === 'weekly' ? weekTagFromISO(batchDate) : null;
    const monthTag = monthTagFromISO(batchDate);
    const reader = new FileReader();
    reader.onload = async function(e){
        try {
            const data = new Uint8Array(e.target.result);
            const wb = XLSX.read(data, { type:'array', cellDates: true });
            const sheet = wb.Sheets[wb.SheetNames[0]];
            const json = XLSX.utils.sheet_to_json(sheet, { defval:'', raw: true });
            await processSalesRows(json, file.name, { batchDate, inventoryType, week, monthTag });
        } catch(err) { toast('Parse failed: ' + err.message, 'error'); }
    };
    reader.readAsArrayBuffer(file);
    evt.target.value = '';
}

    productId: ['product id','product code','productid','productcode','sku','item code','item','invd_item'],
    qty:       ['qty','qty sold','quantity','sold','sales','units','units sold','sale qty'],
    date:      ['date','sale date','sales date','transaction date','txn date','day','invd_dob']
};
    function pick(obj, keys){
        for (const k of Object.keys(obj)) if (keys.includes(k.toLowerCase().trim())) return obj[k];
        return '';
    }
    const parsed = []; const rejects = [];
    rows.forEach((row, i) => {
        const lineNo = i + 2;
        const storeCode = String(pick(row, H.storeCode) || '').trim();
        const productId = String(pick(row, H.productId) || '').trim();
        const qtyRaw    = pick(row, H.qty);
        if (!storeCode && !productId && qtyRaw === '') return;
        if (!storeCode) { rejects.push(`Row ${lineNo}: missing Store Code`); return; }
        if (!productId) { rejects.push(`Row ${lineNo}: missing Product ID`); return; }
        const store = getStoreByCode(storeCode);
        if (!store) { rejects.push(`Row ${lineNo}: Store "${storeCode}" not found`); return; }
        if (!myStoreIds.has(store.id)) { rejects.push(`Row ${lineNo}: Store "${storeCode}" is out of your scope`); return; }
        const bom = getBOMByProductId(productId);
        if (!bom) { rejects.push(`Row ${lineNo}: No BOM found for Product ID "${productId}"`); return; }
        const qty = Number(qtyRaw);
        if (isNaN(qty) || qty <= 0) { rejects.push(`Row ${lineNo}: invalid Qty "${qtyRaw}"`); return; }
        parsed.push({ lineNo, storeId: store.id, storeCode, productId: bom.productId, bomId: bom.id, qty });
    });
    if (parsed.length === 0) { toast('No valid rows to import', 'error'); if (rejects.length > 0) showRejectReport(rejects, filename); return; }
    const closedBlockers = [];
    const seenKeys = new Set();
    if (tag.inventoryType !== 'closing') {
        parsed.forEach(p => {
            const key = p.storeId + '|' + tag.monthTag;
            if (seenKeys.has(key)) return;
            seenKeys.add(key);
            if (isMonthClosed(p.storeId, tag.monthTag)) {
                const store = getStore(p.storeId);
                const count = parsed.filter(x => x.storeId === p.storeId).length;
                closedBlockers.push({ storeCode: store ? store.code : p.storeId, month: tag.monthTag, rowsAffected: count });
            }
        });
    }
    if (closedBlockers.length > 0 && closedBlockers.length === seenKeys.size) {
        openModal('Upload Blocked — Month Closed', `
            <div class="dep-warning">
                <div style="font-weight:bold;margin-bottom:8px">🚫 Cannot upload. Target month is closed.</div>
                <div style="font-size:13px;line-height:1.7">
                    ${closedBlockers.map(b => `<div>• Store <b>${esc(b.storeCode)}</b> — <b>${esc(b.month)}</b> is closed (${b.rowsAffected} row(s))</div>`).join('')}
                </div>
            </div>
        `, `<button class="btn-light" onclick="closeModal()">Close</button>`);
        return;
    }
    let totalUnits = 0;
    const byStore = {};
    parsed.forEach(p => { (byStore[p.storeId] = byStore[p.storeId] || []).push(p); });

    for (const [storeId, lines] of Object.entries(byStore)) {
        const uploadId = nextMovementId('SAL', DB.salesUploads, tag.batchDate);
        const consumed = {};
        lines.forEach(sl => {
            totalUnits += sl.qty;
            const bom = DB.bom.find(b => b.id === sl.bomId);
            if (!bom) return;
            bom.lines.forEach(l => {
                const totalQty = Number(l.qty) * sl.qty;
                if (!consumed[l.itemId]) consumed[l.itemId] = { itemId: l.itemId, uom: l.uom, qty: 0, breakdown: [] };
                consumed[l.itemId].qty += totalQty;
                consumed[l.itemId].breakdown.push({ productId: sl.productId, productName: bom.productName, soldQty: sl.qty, perUnit: Number(l.qty), exploded: totalQty });
            });
        });

        const uploadRec = {
            id: uploadId, filename, date: tag.batchDate, batchDate: tag.batchDate,
            inventoryType: tag.inventoryType, week: tag.week || null, month: tag.monthTag,
            storeId,
            totalRows: rows.length, validRows: lines.length, rejectedRows: rejects.length,
            unitsSold: lines.reduce((s,x) => s + x.qty, 0),
            lines: lines.map(sl => ({ productId: sl.productId, qty: sl.qty })),
            byId: u.id, byName: u.name, status:'Processed', createdAt: nowISO()
        };

        const ledgerLines = Object.values(consumed).map(c => ({
            itemId: c.itemId, qty: Number(c.qty.toFixed(4)), uom: c.uom, breakdown: c.breakdown
        }));
        const ledgerRec = {
            id: uploadId + '-LEDGER', storeId, date: tag.batchDate,
            uploadRef: uploadId, source: 'sales-bom',
            inventoryType: tag.inventoryType, week: tag.week || null, month: tag.monthTag,
            byId: u.id, byName: u.name, lines: ledgerLines, createdAt: nowISO()
        };

        try {
            await DataLayer.insertSalesUpload(uploadRec, ledgerRec);
        } catch(err) {
            toast('Upload save failed: ' + (err.message || err), 'error');
            return;
        }

        DB.salesUploads.push(uploadRec);
        DB.consumptionLedger.push(ledgerRec);
    }
    audit('UPLOAD','sales','',{ valid:parsed.length, rejects:rejects.length, totalUnits, tag:tag.inventoryType });
    saveData();
    const toastMsg = `Uploaded ${parsed.length} row(s), ${totalUnits} units — tagged ${tag.inventoryType}` + (rejects.length > 0 ? `, ${rejects.length} rejected` : '');
    if (rejects.length > 0) {
        openModal('Upload Completed with Rejections', `
            <p style="font-size:13px;color:#6b7280;margin-bottom:12px">File: <b>${esc(filename)}</b><br>Tagged: <b>${esc(tag.inventoryType)}</b></p>
            <div class="reject-list">${rejects.map(r => `<div>${esc(r)}</div>`).join('')}</div>
        `, `<button class="btn-primary" onclick="closeModal();showPage('sales')">OK</button>`);
        toast(toastMsg, 'success');
    } else { toast(toastMsg, 'success'); showPage('sales'); }
}

    openModal('Upload Completed with Rejections', `
        <p style="font-size:13px;color:#6b7280;margin-bottom:12px">File: <b>${esc(filename)}</b></p>
        <div class="reject-list">${rejects.map(r => `<div>${esc(r)}</div>`).join('')}</div>

function findDuplicateJournal(journal){
    return DB.journals.find(j => {
        if (j.status !== 'Submitted') return false;
        if (j.storeId !== journal.storeId) return false;
        if (j.type !== journal.type) return false;
        if (journal.type === 'daily') return j.date === journal.date;
        if (journal.type === 'weekly') return (j.week||'') === (journal.week||'');
        if (journal.type === 'closing') return (j.month||'') === (journal.month||'');
        return false;
    });
}

function startCount(type){
    const u = currentUser();
    const date = document.getElementById('setupDate').value;
    const storeId = document.getElementById('setupStore').value;
    if (!date || !storeId) { toast('Date and Store required', 'error'); return; }
    if (!isInScope(storeId, u)) { toast('Access denied.', 'error'); return; }
    const monthTag = monthTagFromISO(date);
    if (isMonthClosed(storeId, monthTag)) { toast(`${monthTag} is closed.`, 'error'); return; }
    const extra = {};
    if (type==='weekly') extra.week = document.getElementById('setupWeek').value;
    extra.month = monthTag;
    const prefix = { daily:'INV', weekly:'WKL', closing:'CLS' }[type];
    const journalNo = nextJournalNo(prefix, date);
    const header = { id: journalNo, type, date, storeId, ...extra, byId: u.id, byName: u.name, status:'Draft', createdAt: nowISO(), lines: [] };
    const dup = findDuplicateJournal(header);
    if (dup) {
        openModal('Duplicate Inventory', `

        return;

    if (result.lines.length === 0) { toast(`No items flagged for ${type}`, 'error'); return; }
    header.lines = result.lines;
    header.baselineInfo = result.openingSource;
    window._workingCount = header;
    openCountSheet();

function renderViewRows(){
    const j = window._viewJournal;
    if (!j) return;
    const q = (document.getElementById('vSearch')?.value || '').toLowerCase().trim();

    let rows = j.lines.map(l => {
        const it = getItem(l.itemId);
        return {
            code: it ? it.code : '',
            name: it ? it.name : 'Unknown',
            uom: l.uom,
            opening: l.opening, purchases: l.purchases,
            transfersIn: l.transfersIn||0, transfersOut: l.transfersOut||0,
            consumption: l.consumption, expected: l.expected,
            physical: l.physical, variance: l.variance||0
        };
    });

    if (q) rows = rows.filter(r =>
        r.code.toLowerCase().includes(q) || r.name.toLowerCase().includes(q));

    const s = window._viewSort;
    rows.sort((a,b) => {
        if (s.key === 'variance') return (a.variance - b.variance) * s.dir;
        return String(a[s.key]).localeCompare(String(b[s.key])) * s.dir;
    });

    const tbody = document.getElementById('viewCountBody');
    tbody.innerHTML = rows.map(r => {
        const v = r.variance;
        const vClass = v>0?'red':v<0?'green':'';
        return `<tr>
            <td><b>${esc(r.code)}</b></td>
            <td>${esc(r.name)}</td>
            <td>${esc(r.uom)}</td>
            <td style="text-align:right">${fmtNum(r.opening)}</td>
            <td style="text-align:right;color:#2563eb">+${fmtNum(r.purchases)}</td>
            <td style="text-align:right;color:#16a34a">${r.transfersIn>0?'+':''}${fmtNum(r.transfersIn)}</td>
            <td style="text-align:right;color:#dc2626">${r.transfersOut>0?'−':''}${fmtNum(r.transfersOut)}</td>
            <td style="text-align:right;color:#ea580c">−${fmtNum(r.consumption)}</td>
            <td style="text-align:right"><b>${fmtNum(r.expected)}</b></td>
            <td style="text-align:right"><b>${fmtNum(r.physical)}</b></td>
            <td style="text-align:right" class="${vClass}">${v>0?'+':''}${fmtNum(v)}</td>
        </tr>`;
    }).join('') || '<tr><td colspan="11" style="text-align:center;padding:24px;color:#9ca3af">No items match your search</td></tr>';

    const cnt = document.getElementById('vCount');
    if (cnt) cnt.textContent = rows.length;
}

function sortViewRows(key){
    if (!window._viewSort) window._viewSort = { key:'code', dir:1 };
    if (window._viewSort.key === key) window._viewSort.dir *= -1;
    else { window._viewSort.key = key; window._viewSort.dir = 1; }
    renderViewRows();
}

function exportViewExcel(id){
    const j = DB.journals.find(x => x.id === id);

    const q = (document.getElementById('vSearch')?.value || '').toLowerCase().trim();
    let rows = j.lines.map(l => {
        const it = getItem(l.itemId);
        return {
            code: it?it.code:'', name: it?it.name:'Unknown', uom: l.uom,
            opening: l.opening, purchases: l.purchases,
            transfersIn: l.transfersIn||0, transfersOut: l.transfersOut||0,
            consumption: l.consumption, expected: l.expected,
            physical: l.physical, variance: l.variance||0
        };
    });
    if (q) rows = rows.filter(r =>
        r.code.toLowerCase().includes(q) || r.name.toLowerCase().includes(q));

    const s = window._viewSort || { key:'code', dir:1 };
    rows.sort((a,b) => {
        if (s.key === 'variance') return (a.variance - b.variance) * s.dir;
        return String(a[s.key]).localeCompare(String(b[s.key])) * s.dir;
    });

    const store = getStore(j.storeId);
    const aoa = [
        ['Journal No', j.id],
        ['Type', j.type],
        ['Date', j.date],
        ['Store', store ? store.code + ' — ' + store.name : j.storeId],
        ['Month', j.month || ''],
        ['Status', j.status],
        ['Submitted By', j.byName || ''],
        [],
        ['Code','Item','UOM','Opening','Purchases','Transfers In','Transfers Out',
         'Consumption','Expected','Physical','Variance']
    ];
    rows.forEach(r => aoa.push([
        r.code, r.name, r.uom, r.opening, r.purchases,
        r.transfersIn, r.transfersOut, r.consumption,
        r.expected, r.physical, r.variance
    ]));

    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = [
        {wch:14},{wch:32},{wch:8},{wch:10},{wch:10},{wch:11},{wch:12},
        {wch:12},{wch:10},{wch:10},{wch:10}
    ];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Journal');
    XLSX.writeFile(wb, `${j.id}_${j.type}_${j.date}.xlsx`);
    toast('Exported ' + j.id, 'success');
}
  async function regenerateJournal(id){
    // Reload latest data first, so we see freshly-approved transfers
    try {
        DB = await loadData();
    } catch(e) {
        toast('Reload failed: ' + e.message, 'error');
        return;
    }

    const j = DB.journals.find(x => x.id === id);
    if (!j) { toast('Journal not found', 'error'); return; }
    if (j.status !== 'Submitted') { toast('Only submitted journals can be recalculated', 'error'); return; }

    if (!confirm(`Recalculate "${j.id}"?\n\nThis will re-read purchases, transfers, and consumption for ${j.date} and update Expected / Variance.\n\nPhysical counts you entered are NOT changed.`)) return;

    // 1. Rebuild the system-side lines from current data
    const rebuilt = buildCountLines({
        storeId: j.storeId,
        type: j.type,
        date: j.date,
        month: j.month,
        week: j.week,
        createdAt: j.createdAt
    });

    // 2. Merge: keep old physical, take new system fields
    const oldPhysical = {};
    j.lines.forEach(l => { oldPhysical[l.itemId] = Number(l.physical) || 0; });

    const newLines = rebuilt.lines.map(l => {
        const phys = oldPhysical[l.itemId] !== undefined ? oldPhysical[l.itemId] : 0;
        return {
            itemId: l.itemId,
            uom: l.uom,
            opening: l.opening,
            purchases: l.purchases,
            transfersIn: l.transfersIn,
            transfersOut: l.transfersOut,
            consumption: l.consumption,
            expected: l.expected,
            physical: phys,
            variance: phys - l.expected,
            mtdPurchases: l.mtdPurchases,
            mtdConsumption: l.mtdConsumption
        };
    });

    const updated = { ...j, lines: newLines, regeneratedAt: nowISO() };

    // 3. Persist
    try {
        if (CLOUD_MODE === 'supabase') {
            // delete old lines and re-insert with same header id
            const { error: delErr } = await SB.from('journal_lines').delete().eq('journal_id', j.id);
            if (delErr) throw delErr;
            if (newLines.length > 0) {
                const { error: insErr } = await SB.from('journal_lines').insert(
                    newLines.map(l => ({
                        journal_id: j.id,
                        journal_date: j.date,
                        item_id: l.itemId,
                        uom: l.uom,
                        opening: l.opening,
                        purchases: l.purchases,
                        transfers_in: l.transfersIn,
                        transfers_out: l.transfersOut,
                        consumption: l.consumption,
                        expected: l.expected,
                        physical: l.physical,
                        variance: l.variance,
                        mtd_purchases: l.mtdPurchases,
                        mtd_consumption: l.mtdConsumption
                    }))
                );
                if (insErr) throw insErr;
            }
        }

        // 4. Update in-memory
        j.lines = newLines;
        j.regeneratedAt = nowISO();
        audit('REGENERATE','journal',j.id,{});
        saveData();

        toast('Journal recalculated', 'success');
        closeModal();
        viewCount(id);   // reopen with fresh data
    } catch(err) {
        toast('Recalculate failed: ' + (err.message || err), 'error');
    }
}

let _purchImportParsed = null;

async function handlePurchImportFile(evt){
    const file = evt.target.files[0];
    if (!file) return;
    if (!XLSX_READY) { toast('Excel library still loading. Try again in 2 seconds.', 'error'); evt.target.value=''; return; }
    const reader = new FileReader();
    reader.onload = function(e){
        try {
            const data = new Uint8Array(e.target.result);
            const wb = XLSX.read(data, { type:'array', cellDates: true });
            const sheet = wb.Sheets[wb.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(sheet, { defval:'', raw: true });
            parsePurchImport(rows, file.name);
        } catch(err) {
            toast('Parse failed: ' + err.message, 'error');
        }
    };
    reader.readAsArrayBuffer(file);
    evt.target.value = '';
}

function detectPurchFileType(row){
    const keys = Object.keys(row).map(k => k.toLowerCase().trim());
    const has = arr => arr.some(x => keys.includes(x));
    if (has(['st.qty','st qty']) && has(['from warehouse','to warehouse','log_status','log status'])) return 'TO';
    if (has(['unit price']) && has(['line number','dimension value','net amount','procurement category'])) return 'PO';
    if (has(['st.qty','st qty'])) return 'TO';
    if (has(['unit price'])) return 'PO';
    return null;
}

function _pick(obj, keys){
    for (const k of Object.keys(obj)) {
        const n = k.toLowerCase().trim().replace(/\s+/g,' ');
        if (keys.includes(n)) return obj[k];
    }
    return undefined;
}
function _pickQty(row){
    const preferred = ['quantity','qty','st.qty','st qty'];
    for (const k of Object.keys(row)) {
        const n = k.toLowerCase().trim().replace(/\s+/g,' ');
        if (preferred.includes(n)) {
            const v = row[k];
            if (v !== undefined && v !== '') return v;
        }
    }
    for (const k of Object.keys(row)) {
        if (/qty|quantity/i.test(k) && !/cw/i.test(k)) return row[k];
    }
    return undefined;
}

function parsePurchImport(rows, filename){
    if (rows.length === 0) { toast('File is empty', 'error'); return; }

    const fileType = detectPurchFileType(rows[0]);
    if (!fileType) { toast('Cannot detect file type. Expected PO or TO columns.', 'error'); return; }

    const overrideStoreId = document.getElementById('purchImpStore').value;

    // Lookups
    const itemByCode = new Map();
    DB.items.forEach(i => itemByCode.set(String(i.code).trim().toLowerCase(), i));

    const storeByWarehouse = new Map();
    const storeByCode = new Map();
    DB.stores.forEach(s => {
        storeByCode.set(String(s.code).trim().toLowerCase(), s);
        if (s.warehouseCode) storeByWarehouse.set(String(s.warehouseCode).trim().toLowerCase(), s);
    });

       const parsed = [];
    const errors = [];
    const warnings = [];
    const resolvedStores = new Set();

    rows.forEach((row, i) => {
        const rowNo = i + 2;
        const itemCodeRaw = String(_pick(row, ['item number','itemnumber','item code','itemcode','code','sku','invd_item']) || '').trim();
        const qtyRaw = _pickQty(row);
        if (!itemCodeRaw && (qtyRaw === '' || qtyRaw === undefined)) return;
        if (!itemCodeRaw) { errors.push({ line: rowNo, msg: 'Missing Item number' }); return; }

        const qty = Number(qtyRaw);
        if (isNaN(qty) || qty <= 0) { errors.push({ line: rowNo, msg: `Invalid qty "${qtyRaw}"` }); return; }

        let cost = Number(_pick(row, ['unit price','unitprice','price','cost','unit cost'])) || 0;
        const item = itemByCode.get(itemCodeRaw.toLowerCase());
        if (!item) { errors.push({ line: rowNo, msg: `Item "${itemCodeRaw}" not in Item Master` }); return; }
        if (cost === 0) cost = item.cost || 0;

        // Store resolution
        let rowStoreId = overrideStoreId;
        if (!rowStoreId) {
            let wh = '';
            if (fileType === 'TO') {
                wh = String(_pick(row, ['to warehouse','warehouse','warehouse code']) || '').trim().toLowerCase();
            } else {
                wh = String(_pick(row, ['warehouse','to warehouse','warehouse code']) || '').trim().toLowerCase();
            }
            const dim = String(_pick(row, ['dimension value','dimension','store','store code']) || '').trim().toLowerCase();
            let store = null;
            if (wh) store = storeByWarehouse.get(wh) || storeByCode.get(wh);
            if (!store && dim) store = storeByCode.get(dim);
            if (!store) { errors.push({ line: rowNo, msg: `Cannot resolve store (wh="${wh}", dim="${dim}")` }); return; }
            rowStoreId = store.id;
        }
        if (!isInScope(rowStoreId)) { errors.push({ line: rowNo, msg: 'Store out of scope' }); return; }
        resolvedStores.add(rowStoreId);
        parsed.push({
            line: rowNo, itemId: item.id, itemCode: item.code, itemName: item.name,
            qty, uom: String(_pick(row, ['unit','uom','po unit','unit of measure']) || item.uom || 'PCS').trim(),
            cost, storeId: rowStoreId
        });
    });

    if (resolvedStores.size > 1) {
        errors.push({ line: '—', msg: `Rows span ${resolvedStores.size} stores. Split or use override.` });
    }

    // Dedupe
    const seen = new Map();
    parsed.forEach(p => {
        if (seen.has(p.itemId)) {
            warnings.push({ line: p.line, msg: `Duplicate ${p.itemCode} — qty summed` });
            seen.get(p.itemId).qty += p.qty;
        } else seen.set(p.itemId, p);
    });
    const deduped = [...seen.values()];

     _purchImportParsed = {
        fileType, lines: deduped,
        storeId: resolvedStores.size === 1 ? [...resolvedStores][0] : null,
        errors, warnings, filename
    };

    // Auto-fill
  
    if (fileType === 'TO') {
        const supEl = document.getElementById('purchImpSupplier');
        if (supEl && !supEl.value) supEl.value = 'Central Warehouse (TO)';
    }

    // Preview
    const p = _purchImportParsed;
    const totalValue = p.lines.reduce((s,l) => s + l.qty * l.cost, 0);
    const sample = p.lines.slice(0, 10);
    const storeName = p.storeId ? storeLabel(p.storeId) : '⚠ multiple';
    const typeBadge = p.fileType === 'TO'
        ? `<span class="badge badge-cyan">TO · Transfer In</span>`
        : `<span class="badge badge-green">PO · Supplier</span>`;

    document.getElementById('purchImpPreview').innerHTML = `
        <div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:6px;padding:10px 12px;font-size:13px;margin-bottom:10px">
            ${typeBadge} &nbsp; <b>${esc(p.filename)}</b><br>
            <b>Store:</b> ${esc(storeName)}<br>
            <span class="green"><b>${p.lines.length}</b> valid lines</span> · <b>SAR ${fmtNum(totalValue)}</b>
            ${p.warnings.length ? ` · <span class="orange">${p.warnings.length} warnings</span>` : ''}
            ${p.errors.length ? ` · <span class="red">${p.errors.length} errors</span>` : ''}
        </div>
        ${sample.length > 0 ? `
        <div style="max-height:260px;overflow-y:auto;border:1px solid #e5e7eb;border-radius:6px">
            <table style="font-size:12px">
                <thead><tr><th>Code</th><th>Item</th><th>UOM</th>
                <th style="text-align:right">Qty</th><th style="text-align:right">Cost</th><th style="text-align:right">Value</th></tr></thead>
                <tbody>${sample.map(r => `<tr>
                    <td>${esc(r.itemCode)}</td><td>${esc(r.itemName)}</td><td>${esc(r.uom)}</td>
                    <td style="text-align:right">${r.qty}</td>
                    <td style="text-align:right">${fmtNum(r.cost)}</td>
                    <td style="text-align:right">${fmtNum(r.qty*r.cost)}</td>
                </tr>`).join('')}</tbody>
            </table>
        </div>
        ${p.lines.length > 10 ? `<p style="font-size:12px;color:#6b7280;margin-top:6px">…and ${p.lines.length - 10} more lines</p>` : ''}
        ` : ''}
        ${p.errors.length > 0 ? `
            <div style="margin-top:10px;background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:10px;font-size:12px;max-height:180px;overflow-y:auto">
                <b style="color:#b91c1c">Errors:</b>
                ${p.errors.slice(0,30).map(e => `<div>Line ${e.line}: ${esc(e.msg)}</div>`).join('')}
            </div>` : ''}
    `;

    const btn = document.getElementById('purchImpConfirmBtn');
    if (btn) btn.disabled = p.lines.length === 0 || p.storeId === null;
}

async function confirmPurchImport(){
    const p = _purchImportParsed;
    if (!p) { toast('No file loaded', 'error'); return; }
    if (!p.storeId) { toast('Cannot import — rows span multiple stores.', 'error'); return; }
    if (p.lines.length === 0) { toast('No valid lines', 'error'); return; }

    const date = document.getElementById('purchImpDate').value;
    const supplier = document.getElementById('purchImpSupplier').value.trim();
    if (!date) { toast('Date required', 'error'); return; }

    const monthTag = monthTagFromISO(date);
    if (isMonthClosed(p.storeId, monthTag)) { toast(`${monthTag} is closed for this store.`, 'error'); return; }

    const btn = document.getElementById('purchImpConfirmBtn');
    btn.disabled = true;
    btn.textContent = 'Importing…';

    try {
        const u = currentUser();
        const id = nextMovementId('PO', DB.purchases, date);

        const rec = {
            id,
            storeId: p.storeId,
            date,
            supplier: supplier || (p.fileType === 'TO' ? 'Central Warehouse (TO)' : ''),
            sourceType: p.fileType,
            sourceFile: p.filename,
            lines: p.lines.map(l => ({ itemId: l.itemId, qty: l.qty, uom: l.uom, cost: l.cost || 0 })),
            byId: u.id, byName: u.name,
            status: 'Posted', createdAt: nowISO()
        };

        await DataLayer.insertPurchase(rec);

    rows.forEach(s => out.push([s.code, s.name, s.area, s.type, s.storeManagerName||'', s.areaManagerName||'', s.operationManagerName||'', s.status]));
    downloadCSV(out, 'stores.csv');
}
function exportBOMCSV(){
    if (DB.bom.length === 0) { toast('Nothing','error'); return; }

}
function exportSalesCSV(){

}
function exportExplodedCSV(){

function exportJournalsCSV(){
    const myStoreIds = new Set(getMyStores());
    const rows = DB.journals.filter(j => myStoreIds.has(j.storeId));
    if (rows.length === 0) { toast('Nothing','error'); return; }
    const out = [['Journal','Type','Date','Month','Store','Week','Item Code','Item','UOM','Opening','Purchases','Transfers In','Transfers Out','Consumption','Expected','Physical','Variance','MTD Purchases','MTD Consumption','By','Status']];

        const it = getItem(l.itemId);
        out.push([j.id,j.type,j.date,j.month||'',storeLabel(j.storeId),j.week||'',it?it.code:'',it?it.name:'',l.uom,l.opening,l.purchases,l.transfersIn||0,l.transfersOut||0,l.consumption,l.expected,l.physical,l.variance,l.mtdPurchases||0,l.mtdConsumption||0,j.byName,j.status]);
    }));

}
function exportDailyVarianceCSV(){
    const myStoreIds = new Set(getMyStores());
    const rows = DB.journals.filter(j => myStoreIds.has(j.storeId) && j.type === 'daily');
    if (rows.length === 0) { toast('Nothing','error'); return; }
    const out = [['Journal','Date','Store','Item Code','Item','UOM','Opening','Purchases','Transfers In','Transfers Out','Consumption','Expected','Physical','Variance','Value Impact','By']];
    rows.forEach(j => j.lines.forEach(l => {
        const it = getItem(l.itemId);
        const valueImpact = (l.variance||0) * (it ? it.cost : 0);
        out.push([j.id, j.date, storeLabel(j.storeId), it?it.code:'', it?it.name:'', l.uom, l.opening, l.purchases, l.transfersIn||0, l.transfersOut||0, l.consumption, l.expected, l.physical, l.variance, valueImpact.toFixed(2), j.byName]);
    }));
    downloadCSV(out, 'daily_variance.csv');
}
function exportTransfersCSV(){
    if (DB.transfers.length === 0) { toast('Nothing','error'); return; }
    const out = [['Transfer No','Date','From Store','To Store','Item Code','Item','UOM','Qty','Status','Requested By','Approved By','Approved At']];
    DB.transfers.forEach(t => t.lines.forEach(l => {
        const it = getItem(l.itemId);
        out.push([t.id, t.date, storeLabel(t.fromStoreId), storeLabel(t.toStoreId), it?it.code:'', it?it.name:'', l.uom, l.qty, t.status, t.byName, t.approvedByName||'', t.approvedAt ? new Date(t.approvedAt).toLocaleString() : '']);
    }));
    downloadCSV(out, 'transfers.csv');
}
function downloadCSV(rows, filename){
    const csv = rows.map(r => r.map(c => `"${String(c==null?'':c).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type:'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
    toast('Exported '+filename, 'success');
}
function exportFullBackup(){
    const blob = new Blob([JSON.stringify(DB, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `drcafe_erp_backup_${todayISO()}.json`; a.click();
    URL.revokeObjectURL(url);
    toast('Backup downloaded', 'success');
}

/* ---------- RECYCLE BIN ---------- */
RENDERERS.recycle = function(){
    if (!can('manageRecycleBin')) return '<div class="denied">Admin only.</div>';
    const voids = DB.voidedRecords.slice().reverse();
    return `
    <div class="toolbar">
        <div style="flex:1"></div>
        <button class="btn-warn" onclick="emptyRecycleBin()">Empty Recycle Bin</button>
    </div>
    <div class="panel">
        <div class="panel-header"><div class="panel-title">Voided Records</div>
        <span class="badge badge-blue">${voids.length}</span></div>
        <div class="panel-body">${renderRecycleTable(voids)}</div>
    </div>`;
};
function renderRecycleTable(rows){
    if (rows.length === 0) return '<div class="empty">Recycle bin empty</div>';
    return `<table><thead><tr><th>Type</th><th>Label</th><th>Reason</th><th>By</th><th>At</th><th>Actions</th></tr></thead>
        <tbody>${rows.map(v => `
            <tr>
                <td><span class="badge badge-gray">${esc(ENTITIES[v.entityType]?.label || v.entityType)}</span></td>
                <td><b>${esc(v.label)}</b></td>
                <td style="font-size:12px;color:#6b7280">${esc(v.reason || '—')}</td>
                <td>${esc(v.voidedByName || '—')}</td>
                <td style="font-size:11px">${new Date(v.voidedAt).toLocaleString()}</td>
                <td class="actions-cell">
                    <button class="btn-success btn-xs" onclick="restoreVoided('${v.id}');showPage('recycle');">Restore</button>
                    <button class="btn-danger btn-xs" onclick="purgeVoided('${v.id}')">Purge</button>
                </td></tr>`).join('')}</tbody></table>`;
}
function emptyRecycleBin(){
    if (DB.voidedRecords.length === 0) { toast('Already empty', 'error'); return; }
    if (!confirm(`Permanently delete ALL ${DB.voidedRecords.length} voided records?`)) return;
    DB.voidedRecords = [];
    saveData(); toast('Recycle bin emptied', 'success'); showPage('recycle');
}

/* ---------- BACKUP ---------- */
RENDERERS.backup = function(){
    if (!can('backupRestore')) return '<div class="denied">Admin only.</div>';
    const sizeKB = storageSizeKB();
    return `
    <div class="cards">
        <div class="card"><div class="card-label">Storage</div><div class="card-value">${sizeKB} KB</div></div>
        <div class="card"><div class="card-label">Transfers</div><div class="card-value">${DB.transfers.length}</div></div>
        <div class="card"><div class="card-label">Journals</div><div class="card-value">${DB.journals.length}</div></div>
        <div class="card"><div class="card-label">Sales Uploads</div><div class="card-value">${DB.salesUploads.length}</div></div>
    </div>
    <div class="panel">
        <div class="panel-header"><div class="panel-title">Backup</div></div>
        <div class="panel-body">
            <button class="btn-primary" onclick="exportFullBackup()">Download Backup (JSON)</button>
        </div>
    </div>
    <div class="panel">
        <div class="panel-header"><div class="panel-title">Restore</div></div>
        <div class="panel-body">
            <div class="upload-drop" onclick="document.getElementById('restoreFile').click()">
                <div class="upload-icon">📂</div>
                <div class="upload-text">Click to restore</div>
            </div>
            <input type="file" id="restoreFile" class="upload-file" accept=".json" onchange="restoreFromFile(event)">
        </div>
    </div>
    <div class="panel">
        <div class="panel-header"><div class="panel-title">Danger Zone</div></div>
        <div class="panel-body">
            <button class="btn-danger" onclick="resetAllData()">Reset All Data</button>
        </div>
    </div>`;
};
function restoreFromFile(evt){
    const file = evt.target.files[0];
    if (!file) return;
    if (!confirm('Replace all data?')) return;
    const reader = new FileReader();
    reader.onload = e => {
        try {
            const d = JSON.parse(e.target.result);
            if (!isValidData(d)) throw new Error('Invalid file');
            localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
            toast('Restored', 'success');
            setTimeout(()=>location.reload(), 800);
        } catch(err) { toast('Invalid: '+err.message, 'error'); }
    };
    reader.readAsText(file);
    evt.target.value = '';
}
function resetAllData(){
    if (!confirm('Reset ALL? Cannot undo.')) return;
    if (!confirm('Really?')) return;
    LEGACY_KEYS.concat([STORAGE_KEY]).forEach(k => localStorage.removeItem(k));
    clearSession(); location.reload();
}

/* ---------- MODAL ---------- */
function openModal(title, body, footer){
    const mb = document.getElementById('modalBox');
    mb.className = 'modal';
    document.getElementById('modalTitle').innerHTML = title;
    document.getElementById('modalBody').innerHTML = body;
    document.getElementById('modalFooter').innerHTML = footer || '<button class="btn-light" onclick="closeModal()">Close</button>';
    document.getElementById('modalOverlay').classList.add('show');
}
function closeModal(){
    document.getElementById('modalOverlay').classList.remove('show');
    document.getElementById('modalBox').className = 'modal';
}



document.addEventListener('DOMContentLoaded', async () => {
    document.getElementById('loginPass').addEventListener('keydown', e => { if (e.key==='Enter') doLogin(); });
    document.getElementById('loginUser').addEventListener('keydown', e => { if (e.key==='Enter') document.getElementById('loginPass').focus(); });
    document.getElementById('modalOverlay').addEventListener('click', e => { if (e.target.id==='modalOverlay') closeModal(); });
        // Sliding sidebar wiring
    const hb = document.getElementById('hamburgerBtn');
    const bd = document.getElementById('sidebarBackdrop');
    if (hb) hb.addEventListener('click', toggleSidebar);
    if (bd) bd.addEventListener('click', closeSidebar);
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') closeSidebar();
    });

    try {
        if (CLOUD_MODE === 'local') {
            DB = await loadData();
        }
        await bootApp();
    } catch(e) {
        console.error('Boot error:', e);
        alert('Startup error: ' + (e.message || e));
    }
});
