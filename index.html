<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surprise Inv Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="login-wrap">
    <div class="login-card">
        <div class="login-brand">
            <img src="https://placehold.co/400x90/1a7a4c/ffffff?text=Surprise Inv Check+%7C+Powered+By+Ops Team"
                 alt="Surprise Inv Check"
                 class="login-brand-img">
        </div>
        <div class="login-sub">Sign in to continue</div>
        <div id="loginError" class="login-error"></div>
        <div class="field">
            <label>Username</label>
            <input type="text" id="loginUser" placeholder="Username">
        </div>
        <div class="field">
            <label>Password</label>
            <input type="password" id="loginPass" placeholder="Password">
        </div>
        <button class="login-btn" onclick="doLogin()">Sign In</button>
    </div>
</div>

<!-- APP -->
<div id="appScreen" style="display:none">
<div class="sidebar" id="sidebar">
    <div class="logo"><span>Surprise Inv Check</span> ERP</div>
    <div id="sidebarMenu"></div>
</div>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<div class="main">
<div class="topbar">
    <button class="hamburger" id="hamburgerBtn" aria-label="Toggle sidebar">
        <span></span><span></span><span></span>
    </button>
    <div class="page-title" id="pageTitle">Dashboard</div>
    <div id="pwBanner" style="display:none;background:#fef3c7;border:1px solid #fcd34d;color:#92400e;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:bold">
        ⚠ Using default password — <a onclick="openChangePassword()" style="color:#78350f;text-decoration:underline;cursor:pointer">change it now</a>
    </div>
        <div class="user">
            <div class="user-info"><b id="userName">—</b><div class="role-tag" id="userRole">—</div></div>
            <div class="avatar" id="userAvatar">—</div>
            <button class="logout-btn" onclick="doLogout()">Logout</button>
        </div>
    </div>
    <div class="content"><div id="pageContainer"></div></div>
</div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalBox">
        <div class="modal-header"><h3 id="modalTitle">Title</h3><button class="modal-close" onclick="closeModal()">×</button></div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer" id="modalFooter"></div>
    </div>
</div>

<div class="toast" id="toast"></div>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    background: #f6f8fb;
    color: #0f172a;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}
::selection { background: rgba(16,185,129,0.22); }

/* Scrollbars */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: #94a3b8; background-clip: padding-box; }

/* ================= LOGIN ================= */
.login-wrap {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background:
        radial-gradient(1000px 600px at 10% 10%, rgba(16,185,129,0.18), transparent 60%),
        radial-gradient(900px 700px at 90% 90%, rgba(37,99,235,0.18), transparent 60%),
        linear-gradient(135deg, #0b1220, #111827 55%, #0b1220);
    padding: 20px;
}
.login-card {
    background: rgba(255,255,255,0.98);
    border-radius: 20px;
    padding: 44px 40px 36px;
    width: 100%; max-width: 440px;
    box-shadow:
        0 1px 0 rgba(255,255,255,0.9) inset,
        0 30px 80px -20px rgba(0,0,0,0.55),
        0 8px 24px rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.6);
    animation: cardIn 0.4s ease both;
}
@keyframes cardIn {
    from { opacity: 0; transform: translateY(14px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}
.login-brand { text-align: center; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid #eef2f7; }
.login-brand-img { max-width: 100%; width: 320px; height: auto; display: inline-block; }
.login-sub { text-align: center; color: #64748b; font-size: 13px; margin-bottom: 28px; }
.field { margin-bottom: 16px; }
.field label {
    display: block; font-size: 11.5px; font-weight: 700; color: #334155;
    margin-bottom: 7px; text-transform: uppercase; letter-spacing: 0.4px;
}
.field input {
    width: 100%; padding: 12px 14px; border: 1px solid #dfe4ec;
    border-radius: 10px; font-size: 14px; font-family: inherit;
    background: #fbfcfe; color: #0f172a;
    transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
}
.field input:focus {
    outline: none; border-color: #10b981; background: white;
    box-shadow: 0 0 0 4px rgba(16,185,129,0.14);
}
.login-btn {
    width: 100%; padding: 13px; color: white; border: none; border-radius: 10px;
    font-size: 14.5px; font-weight: 700; cursor: pointer; margin-top: 10px;
    letter-spacing: 0.2px;
    background: linear-gradient(180deg, #10b981, #059669);
    box-shadow: 0 1px 0 rgba(255,255,255,0.25) inset, 0 8px 20px -8px rgba(16,185,129,0.7);
    transition: transform 0.12s, box-shadow 0.15s, filter 0.15s;
}
.login-btn:hover { filter: brightness(1.05); box-shadow: 0 1px 0 rgba(255,255,255,0.25) inset, 0 10px 26px -8px rgba(16,185,129,0.85); }
.login-btn:active { transform: translateY(1px) scale(0.995); }
.login-btn:disabled { opacity: 0.6; cursor: not-allowed; filter: grayscale(0.2); }
.login-error {
    background: #fef2f2; color: #b91c1c; padding: 11px 12px; border-radius: 8px;
    font-size: 13px; margin-bottom: 14px; display: none; border: 1px solid #fecaca;
}

/* ================= SIDEBAR ================= */
.sidebar {
    position: fixed; left: 0; top: 0; bottom: 0; width: 258px;
    background: linear-gradient(180deg, #0b1220 0%, #0f172a 100%);
    color: #e5e7eb; overflow-y: auto; z-index: 1000;
    transform: translateX(-100%);
    transition: transform 0.32s cubic-bezier(0.2, 0.9, 0.4, 1);
    box-shadow: 4px 0 30px rgba(0,0,0,0.35);
    border-right: 1px solid rgba(255,255,255,0.04);
}
.sidebar.open { transform: translateX(0); }
.sidebar-backdrop {
    position: fixed; inset: 0; background: rgba(8,12,20,0.55);
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
    z-index: 999; opacity: 0; visibility: hidden;
    transition: opacity 0.25s ease, visibility 0.25s ease;
}
.sidebar-backdrop.active { opacity: 1; visibility: visible; }
.logo {
    padding: 24px 22px 20px; font-size: 17px; font-weight: 800;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    letter-spacing: -0.2px; display: flex; align-items: center; gap: 10px;
}
.logo::before {
    content: ''; width: 10px; height: 10px; border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 0 4px rgba(16,185,129,0.18), 0 0 16px rgba(16,185,129,0.6);
    flex-shrink: 0;
}
.logo span { color: #10b981; }
.menu-title {
    padding: 22px 22px 8px; font-size: 10.5px; text-transform: uppercase;
    color: #64748b; letter-spacing: 1.2px; font-weight: 700;
}
.menu-item {
    padding: 11px 18px; margin: 2px 10px; border-radius: 10px;
    cursor: pointer; display: flex; align-items: center; gap: 12px;
    font-size: 13.5px; font-weight: 500; color: #cbd5e1;
    line-height: 1.35; transition: background 0.15s, color 0.15s;
    border-left: none;
}
.menu-item:hover { background: rgba(255,255,255,0.06); color: white; }
.menu-item.active {
    background: linear-gradient(90deg, rgba(16,185,129,0.20), rgba(16,185,129,0.06));
    color: white; font-weight: 600;
    box-shadow: inset 3px 0 0 #10b981;
}
.menu-icon {
    width: 22px; min-width: 22px; height: 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; line-height: 1; flex-shrink: 0; opacity: 0.9;
}
.menu-item > span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ================= MAIN ================= */
.main { margin-left: 0; min-height: 100vh; }
.topbar {
    height: 68px; background: rgba(255,255,255,0.85);
    backdrop-filter: saturate(180%) blur(12px);
    -webkit-backdrop-filter: saturate(180%) blur(12px);
    border-bottom: 1px solid #e8edf3;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 28px; position: sticky; top: 0; z-index: 50;
}
.hamburger {
    width: 40px; height: 40px; border: none; background: transparent;
    cursor: pointer; padding: 9px;
    display: flex; flex-direction: column; justify-content: space-around;
    border-radius: 10px; flex-shrink: 0; margin-right: 10px;
    transition: background 0.15s;
}
.hamburger:hover { background: #f1f5f9; }
.hamburger span { display: block; height: 2px; width: 100%; background: #1f2937; border-radius: 2px; transition: background 0.15s; }
.hamburger:hover span { background: #059669; }
.page-title { font-size: 19px; font-weight: 700; letter-spacing: -0.3px; color: #0f172a; }
.user { display: flex; align-items: center; gap: 12px; }
.user-info { text-align: right; }
.user-info b { font-size: 13px; font-weight: 600; color: #0f172a; }
.user-info .role-tag { font-size: 11px; color: #059669; font-weight: 700; letter-spacing: 0.2px; }
.avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: linear-gradient(135deg, #10b981, #047857);
    color: white; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13.5px; letter-spacing: 0.3px;
    box-shadow: 0 0 0 3px rgba(16,185,129,0.15), 0 4px 10px rgba(16,185,129,0.25);
}
.logout-btn {
    padding: 8px 13px; background: #f1f5f9; color: #334155;
    border: 1px solid #e2e8f0; border-radius: 8px; cursor: pointer;
    font-size: 12px; font-weight: 600;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
}
.logout-btn:hover { background: #e2e8f0; color: #0f172a; }
.content { padding: 26px 30px; }

.cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-bottom: 26px; }
.card {
    background: white; border-radius: 14px; padding: 20px 22px;
    border: 1px solid #e8edf3;
    box-shadow: 0 1px 2px rgba(15,23,42,0.04), 0 8px 24px -16px rgba(15,23,42,0.10);
    transition: transform 0.15s, box-shadow 0.2s;
}
.card:hover {
    transform: translateY(-1px);
    box-shadow: 0 1px 2px rgba(15,23,42,0.04), 0 14px 30px -14px rgba(15,23,42,0.16);
}
.card-label {
    font-size: 11.5px; color: #64748b; margin-bottom: 10px;
    text-transform: uppercase; letter-spacing: 0.6px; font-weight: 700;
}
.card-value { font-size: 27px; font-weight: 800; letter-spacing: -0.5px; font-variant-numeric: tabular-nums; }
.card-small { font-size: 12px; margin-top: 8px; color: #64748b; }
.green { color: #059669; } .red { color: #dc2626; } .orange { color: #ea580c; } .blue { color: #2563eb; }

.grid-2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; margin-bottom: 25px; }
.panel {
    background: white; border: 1px solid #e8edf3; border-radius: 14px;
    overflow: hidden; margin-bottom: 22px;
    box-shadow: 0 1px 2px rgba(15,23,42,0.04), 0 8px 24px -18px rgba(15,23,42,0.10);
}
.panel-header {
    padding: 17px 22px; border-bottom: 1px solid #eef2f7;
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 10px; background: linear-gradient(180deg, #fbfcfe, #ffffff);
}
.panel-title { font-weight: 700; letter-spacing: -0.2px; color: #0f172a; }
.panel-body { padding: 20px 22px; overflow-x: auto; }

table { width: 100%; border-collapse: collapse; }
th {
    text-align: left; background: #f8fafc; color: #475569;
    font-size: 11.5px; font-weight: 700; padding: 12px 14px;
    border-bottom: 1px solid #e8edf3; white-space: nowrap;
    text-transform: uppercase; letter-spacing: 0.5px;
}
td { padding: 13px 14px; border-bottom: 1px solid #f1f5f9; font-size: 13px; color: #1e293b; }
tr:hover td { background: #fbfdfc; }
.empty { text-align: center; color: #94a3b8; padding: 44px 20px; font-size: 13.5px; }

.badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 10px; border-radius: 999px; font-size: 11px;
    font-weight: 700; white-space: nowrap; letter-spacing: 0.2px;
    border: 1px solid transparent;
}
.badge-green  { background: #dcfce7; color: #15803d; border-color: #bbf7d0; }
.badge-orange { background: #ffedd5; color: #c2410c; border-color: #fed7aa; }
.badge-red    { background: #fee2e2; color: #b91c1c; border-color: #fecaca; }
.badge-blue   { background: #dbeafe; color: #1d4ed8; border-color: #bfdbfe; }
.badge-gray   { background: #f1f5f9; color: #475569; border-color: #e2e8f0; }
.badge-purple { background: #ede9fe; color: #6d28d9; border-color: #ddd6fe; }
.badge-cyan   { background: #cffafe; color: #0e7490; border-color: #a5f3fc; }

button {
    border: none; padding: 9px 14px; border-radius: 9px;
    cursor: pointer; font-size: 13px; font-family: inherit; font-weight: 600;
    transition: transform 0.1s, filter 0.15s, background 0.15s, box-shadow 0.15s, color 0.15s;
}
button:active { transform: translateY(1px) scale(0.99); }
.btn-primary {
    background: linear-gradient(180deg, #10b981, #059669); color: white;
    box-shadow: 0 1px 0 rgba(255,255,255,0.25) inset, 0 6px 14px -6px rgba(16,185,129,0.65);
}
.btn-primary:hover { filter: brightness(1.06); box-shadow: 0 1px 0 rgba(255,255,255,0.25) inset, 0 10px 20px -8px rgba(16,185,129,0.85); }
.btn-light { background: #f1f5f9; color: #334155; border: 1px solid #e2e8f0; }
.btn-light:hover { background: #e2e8f0; color: #0f172a; }
.btn-success {
    background: linear-gradient(180deg, #22c55e, #16a34a); color: white;
    box-shadow: 0 1px 0 rgba(255,255,255,0.22) inset, 0 6px 14px -6px rgba(22,163,74,0.6);
}
.btn-success:hover { filter: brightness(1.05); }
.btn-danger {
    background: linear-gradient(180deg, #ef4444, #dc2626); color: white;
    box-shadow: 0 1px 0 rgba(255,255,255,0.22) inset, 0 6px 14px -6px rgba(220,38,38,0.55);
}
.btn-danger:hover { filter: brightness(1.05); }
.btn-warn {
    background: linear-gradient(180deg, #f59e0b, #d97706); color: white;
    box-shadow: 0 1px 0 rgba(255,255,255,0.22) inset, 0 6px 14px -6px rgba(217,119,6,0.55);
}
.btn-warn:hover { filter: brightness(1.05); }
.btn-sm { padding: 6px 11px; font-size: 12px; }
.btn-xs { padding: 4px 9px; font-size: 11px; border-radius: 7px; }
button:disabled { opacity: 0.55; cursor: not-allowed; filter: grayscale(0.25); transform: none !important; }
.actions-cell { display: flex; gap: 5px; flex-wrap: wrap; }

.toolbar {
    background: white; padding: 14px 16px; border: 1px solid #e8edf3;
    border-radius: 12px; margin-bottom: 20px; display: flex; gap: 10px;
    flex-wrap: wrap; align-items: center;
    box-shadow: 0 1px 2px rgba(15,23,42,0.03);
}
input, select {
    padding: 9px 12px; border: 1px solid #dfe4ec; border-radius: 9px;
    background: #fbfcfe; font-family: inherit; font-size: 13px; color: #0f172a;
    transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
}
input:focus, select:focus {
    outline: none; border-color: #10b981; background: white;
    box-shadow: 0 0 0 4px rgba(16,185,129,0.14);
}

.modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(8,12,20,0.55);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    z-index: 200; align-items: center; justify-content: center; padding: 20px;
}
.modal-overlay.show { display: flex; animation: fadeIn 0.18s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
    background: white; border-radius: 16px; width: 100%; max-width: 520px;
    max-height: 90vh; overflow-y: auto;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.55), 0 8px 24px rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.6);
    animation: modalIn 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.2);
}
@keyframes modalIn {
    from { opacity: 0; transform: translateY(10px) scale(0.985); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}
.modal.modal-wide { max-width: 820px; }
.modal.modal-xl { max-width: 1500px; }
.modal-header {
    padding: 20px 24px; border-bottom: 1px solid #eef2f7;
    display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; background: white; z-index: 10;
    border-top-left-radius: 16px; border-top-right-radius: 16px;
}
.modal-header h3 { font-size: 17px; font-weight: 700; letter-spacing: -0.2px; }
.modal-close {
    background: none; border: none; font-size: 22px; cursor: pointer;
    color: #94a3b8; padding: 0 6px; line-height: 1; border-radius: 8px;
    transition: background 0.15s, color 0.15s;
}
.modal-close:hover { background: #f1f5f9; color: #0f172a; }
.modal-body { padding: 22px 24px; }
.modal-footer {
    padding: 16px 24px; border-top: 1px solid #eef2f7;
    display: flex; justify-content: flex-end; gap: 10px;
    position: sticky; bottom: 0; background: white; z-index: 10;
    border-bottom-left-radius: 16px; border-bottom-right-radius: 16px;
}
.form-row { margin-bottom: 15px; }
.form-row label {
    display: block; font-size: 11.5px; font-weight: 700; color: #334155;
    margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.4px;
}
.form-row input, .form-row select, .form-row textarea {
    width: 100%; padding: 10px 12px; border: 1px solid #dfe4ec;
    border-radius: 9px; font-family: inherit; font-size: 13px;
    background: #fbfcfe; transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
}
.form-row input:focus, .form-row select:focus, .form-row textarea:focus {
    outline: none; border-color: #10b981; background: white;
    box-shadow: 0 0 0 4px rgba(16,185,129,0.14);
}
.form-row textarea { resize: vertical; min-height: 70px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }

.line-editor { border: 1px solid #e8edf3; border-radius: 10px; overflow: hidden; }
.line-editor table { font-size: 13px; }
.line-editor th { background: #f8fafc; font-size: 11px; padding: 9px 10px; }
.line-editor td { padding: 6px 10px; }
.line-editor input, .line-editor select { width: 100%; padding: 6px 8px; font-size: 12px; }
.line-editor select { min-width: 180px; }

.journal-meta {
    background: linear-gradient(180deg, #eff6ff, #f8fafc);
    border: 1px solid #dbeafe; border-radius: 12px;
    padding: 16px 20px; margin-bottom: 18px;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;
}
.journal-meta .k {
    font-size: 10.5px; color: #1e40af; text-transform: uppercase;
    letter-spacing: 0.6px; margin-bottom: 4px; font-weight: 700;
}
.journal-meta .v { font-size: 14px; font-weight: 700; color: #0f172a; letter-spacing: -0.1px; }

.journal-table-wrap { max-height: 52vh; overflow-y: auto; border: 1px solid #e8edf3; border-radius: 12px; }
.journal-table-wrap table { font-size: 12.5px; }
.journal-table-wrap thead th {
    position: sticky; top: 0; z-index: 5; background: #f8fafc;
    font-size: 11px; padding: 10px 10px;
}
.journal-table-wrap input {
    width: 85px; padding: 6px 8px; font-size: 13px;
    text-align: right; font-variant-numeric: tabular-nums;
}
.journal-table-wrap td { padding: 8px 10px; font-variant-numeric: tabular-nums; }
.readonly-cell {
    background: #f8fafc; text-align: right; padding: 8px 10px;
    color: #475569; font-size: 12.5px; font-variant-numeric: tabular-nums;
}

.journal-toolbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px; flex-wrap: wrap; gap: 10px;
}
.journal-progress { font-size: 12.5px; color: #64748b; font-weight: 500; }
.journal-progress b { color: #059669; font-size: 14px; font-weight: 800; }
.journal-search {
    padding: 8px 12px; border: 1px solid #dfe4ec; border-radius: 9px;
    font-size: 13px; width: 220px; background: #fbfcfe;

    /* ══════════════════════════════════════════════════════════════
   StagedFiles — IndexedDB scratchpad for opening + sales files
   Files live here until the audit is submitted to Supabase.
   ══════════════════════════════════════════════════════════════ */
const StagedFiles = {
    _db: null,
    async open() {
        if (this._db) return this._db;
        this._db = await new Promise((res, rej) => {
            const r = indexedDB.open('erp_staged', 1);
            r.onupgradeneeded = e => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains('files')) {
                    const s = db.createObjectStore('files', { keyPath: 'id', autoIncrement: true });
                    s.createIndex('by_owner', 'ownerId');
                    s.createIndex('by_key', ['ownerId','storeId','date','type'], { unique: false });
                }
            };
            r.onsuccess = () => res(r.result);
            r.onerror = () => rej(r.error);
        });
        return this._db;
    },
       async put(entry) {
        entry.parsedAt = Date.now();
        const db = await this.open();

        // First: delete any existing entry with the same (owner, store, date, type)
        // so we never accumulate duplicates for the same upload slot.
        await new Promise((res, rej) => {
            const tx = db.transaction('files', 'readwrite');
            const idx = tx.objectStore('files').index('by_key');
            const range = IDBKeyRange.only([
                entry.ownerId, entry.storeId, entry.date, entry.type
            ]);
            const req = idx.openCursor(range);
            req.onsuccess = () => {
                const c = req.result;
                if (c) { c.delete(); c.continue(); }
                else res();
            };
            req.onerror = () => rej(req.error);
        });

        // Then: insert the new entry
        return new Promise((res, rej) => {
            const tx = db.transaction('files', 'readwrite');
            const req = tx.objectStore('files').put(entry);
            req.onsuccess = () => res(req.result);
            req.onerror = () => rej(req.error);
        });
    },
    async find(ownerId, storeId, date, type) {
        const db = await this.open();
        return new Promise((res, rej) => {
            const tx = db.transaction('files', 'readonly');
            const idx = tx.objectStore('files').index('by_key');
            const req = idx.getAll([ownerId, storeId, date, type]);
            req.onsuccess = () => res(req.result || []);
            req.onerror = () => rej(req.error);
        });
    },
    async deleteFor(ownerId, storeId, date) {
        const db = await this.open();
        const keys = await new Promise((res, rej) => {
            const tx = db.transaction('files', 'readwrite');
            const idx = tx.objectStore('files').index('by_key');
            const req = idx.openCursor(IDBKeyRange.bound(
                [ownerId, storeId, date, ''],
                [ownerId, storeId, date, '\uffff']
            ));
            const hits = [];
            req.onsuccess = () => {
                const c = req.result;
                if (c) { hits.push(c.primaryKey); c.continue(); }
                else res(hits);
            };
            req.onerror = () => rej(req.error);
        });
        await Promise.all(keys.map(k => new Promise((res, rej) => {
            const tx = db.transaction('files', 'readwrite');
            const r = tx.objectStore('files').delete(k);
            r.onsuccess = res; r.onerror = () => rej(r.error);
        })));
    },
        async cleanupOnLogin(ownerId, maxAgeDays = 7) {
        const db = await this.open();
        const cutoff = Date.now() - maxAgeDays * 86400000;
        await new Promise((res, rej) => {
            const tx = db.transaction('files', 'readwrite');
            const store = tx.objectStore('files');
            const req = store.openCursor();
            req.onsuccess = () => {
                const c = req.result;
                if (!c) return res();
                const v = c.value;
                if (v.ownerId !== ownerId || (v.parsedAt || 0) < cutoff) c.delete();
                c.continue();
            };
            req.onerror = () => rej(req.error);
        });
    },

    /* Option B — find any staged entry regardless of owner (for viewing) */
    async findAnyOwner(storeId, date, type) {
        const db = await this.open();
        return new Promise((res, rej) => {
            const tx = db.transaction('files', 'readonly');
            const idx = tx.objectStore('files').index('by_key');
            const req = idx.openCursor(IDBKeyRange.bound(
                ['', storeId, date, type],
                ['\uffff', storeId, date, type]
            ));
            const hits = [];
            req.onsuccess = () => {
                const c = req.result;
                if (c) { hits.push(c.value); c.continue(); }
                else res(hits);
            };
            req.onerror = () => rej(req.error);
        });
    }
};

const DataLayer = {

    /* ─── NEW: Paginated fetch to bypass PostgREST 1000-row cap ─── */
     async fetchAll(table, opts = {}) {
        if (CLOUD_MODE === 'local') return { data: [], error: null };
        const PAGE = 1000;

        let firstQ = SB.from(table).select(opts.select || '*', { count: 'exact' }).range(0, PAGE - 1);
        if (opts.order) firstQ = firstQ.order(opts.order, { ascending: opts.ascending ?? true });
        if (opts.eq)    for (const [k, v] of Object.entries(opts.eq))   firstQ = firstQ.eq(k, v);
        if (opts.in)    for (const [k, arr] of Object.entries(opts.in)) firstQ = firstQ.in(k, arr);

        const { data: firstPage, error: e1, count } = await firstQ;
        if (e1) return { data: [], error: e1 };
        if (!firstPage || firstPage.length === 0) return { data: [], error: null };

        const total = count || firstPage.length;
        if (total <= PAGE) return { data: firstPage, error: null };

        const pagesNeeded = Math.ceil(total / PAGE);
        const pending = [];
        for (let p = 1; p < pagesNeeded; p++) {
            let q = SB.from(table).select(opts.select || '*').range(p * PAGE, (p + 1) * PAGE - 1);
            if (opts.order) q = q.order(opts.order, { ascending: opts.ascending ?? true });
            if (opts.eq)    for (const [k, v] of Object.entries(opts.eq))   q = q.eq(k, v);
            if (opts.in)    for (const [k, arr] of Object.entries(opts.in)) q = q.in(k, arr);
            pending.push(q);
        }
        const results = await Promise.all(pending);
        let all = [...firstPage];
        for (const r of results) {

function nextMovementId(prefix, collection, dateStr){
    const [y,m,d] = dateStr.split('-');
    const tag = d + m + y;
    const full = `${prefix}-${tag}-`;
    let max = 0;
    collection.forEach(x => {
        if (x.id && x.id.startsWith(full)) {
            const n = parseInt(x.id.slice(full.length), 10);
            if (!isNaN(n) && n > max) max = n;
        }
    });
    return full + String(max + 1).padStart(4, '0');
}
function nextJournalNo(prefix, dateStr){ return nextMovementId(prefix, DB.journals, dateStr); }

const ENTITIES = {
    store: { key:'stores', label:'Store', nameField:'name' },
    item: { key:'items', label:'Item', nameField:'name' },
    bom: { key:'bom', label:'BOM', nameField:'productName' },
    employee: { key:'employees', label:'Employee', nameField:'name' },
    journal: { key:'journals', label:'Journal', nameField:'id' },
    salesUp: { key:'salesUploads', label:'Sales Upload', nameField:'id' },
    user: { key:'users', label:'User', nameField:'username' }
};
function getDeleteBlockers(entityType, id){
    const blockers = [];
    if (entityType === 'store') {
        const j = DB.journals.filter(x => x.storeId===id);
        if (j.length) blockers.push({ type:'Journal', count:j.length, preview:j.slice(0,5).map(x=>x.id) });
        const s = DB.salesUploads.filter(x => x.storeId===id);
        if (s.length) blockers.push({ type:'Sales Upload', count:s.length, preview:s.slice(0,5).map(x=>x.id) });
    }
    if (entityType === 'item') {
        const item = getItem(id);
        if (item) {
            const bomUsing = DB.bom.filter(b => (b.lines||[]).some(l => l.itemId === id));
            if (bomUsing.length) blockers.push({ type:'BOM', count:bomUsing.length, preview:bomUsing.slice(0,5).map(b=>b.productId) });
            const journals = DB.journals.filter(j => j.lines.some(l => l.itemId===id));
            if (journals.length) blockers.push({ type:'Journal', count:journals.length, preview:journals.slice(0,5).map(j=>j.id) });
        }
    }
    if (entityType === 'employee') {
        const emp = getEmployee(id);
        if (emp) {
            const asSM = DB.stores.filter(s => norm(s.storeManagerName) === norm(emp.name));
            if (asSM.length) blockers.push({ type:'Store (Store Manager)', count:asSM.length, preview:asSM.slice(0,5).map(s=>s.code) });
            const asArea = DB.stores.filter(s => norm(s.areaManagerName) === norm(emp.name));
            if (asArea.length) blockers.push({ type:'Store (Area Manager)', count:asArea.length, preview:asArea.slice(0,5).map(s=>s.code) });
            const asOp = DB.stores.filter(s => norm(s.operationManagerName) === norm(emp.name));
            if (asOp.length) blockers.push({ type:'Store (Op Manager)', count:asOp.length, preview:asOp.slice(0,5).map(s=>s.code) });
        }
    }
    if (entityType === 'journal') {
        const j = DB.journals.find(x => x.id===id);
        if (j) {
            const later = DB.journals.filter(x => x.id !== id && x.storeId === j.storeId && x.status === 'Submitted' && x.createdAt > j.createdAt);
            if (later.length) blockers.push({ type:'Later Journal', count:later.length, preview:later.slice(0,5).map(x=>x.id) });
        }
    }

    return blockers;
}
async function softDelete(entityType, id, reason){
    const reg = ENTITIES[entityType];
    if (!reg) return false;
    const col = DB[reg.key];
    const idx = col.findIndex(x => x.id === id);
    if (idx < 0) return false;
    const record = col[idx];
    const u = currentUser();

    const snapshotPayload = {
        entity_type: entityType,
        original_id: id,
        label: String(record[reg.nameField] || id),
        snapshot: record,
        reason: reason || '',
        voided_by: u?.id || null,
        voided_by_name: u?.name || 'system'
    };

    if (CLOUD_MODE === 'supabase') {
        const { data: voidedRow, error: vErr } = await SB
            .from('voided_records')
            .insert(snapshotPayload)
            .select()
            .single();
        if (vErr) {
            toast('Void snapshot failed: ' + vErr.message, 'error');
            return false;
        }

        try {
            if (entityType === 'journal') {
                await SB.from('journal_lines').delete().eq('journal_id', id);
                await SB.from('journals').delete().eq('id', id);
            } else if (entityType === 'salesUp') {
                const { data: ledgerRow } = await SB.from('consumption_ledger').select('id').eq('upload_ref', id).maybeSingle();
                if (ledgerRow?.id) {
                    await SB.from('consumption_ledger_lines').delete().eq('ledger_id', ledgerRow.id);
                }
                await SB.from('consumption_ledger').delete().eq('upload_ref', id);
                await SB.from('sales_upload_lines').delete().eq('upload_id', id);
                await SB.from('sales_uploads').delete().eq('id', id);
            } else if (entityType === 'bom') {
                await SB.from('bom_lines').delete().eq('bom_id', id);
                await SB.from('bom').delete().eq('id', id);
            } else if (entityType === 'store') {
                await SB.from('stores').delete().eq('id', id);
            } else if (entityType === 'item') {
                await SB.from('items').delete().eq('id', id);
            } else if (entityType === 'employee') {
                await SB.from('employees').delete().eq('id', id);
            }
        } catch(err) {
            toast('Delete failed: ' + (err.message || err), 'error');
            return false;
        }

        DB.voidedRecords.unshift({
            id: voidedRow.id,
            entityType,
            originalId: id,
            label: snapshotPayload.label,
            snapshot: JSON.parse(JSON.stringify(record)),
            reason: reason || '',
            voidedAt: voidedRow.voided_at,
            voidedById: u?.id,
            voidedByName: u?.name || 'system'
        });
    } else {
        DB.voidedRecords.push({
            id: uid('void'), entityType, originalId: id,
            label: record[reg.nameField] || id,
            snapshot: JSON.parse(JSON.stringify(record)),
            reason: reason || '', voidedAt: nowISO(),
            voidedById: u?.id, voidedByName: u?.name || 'system'
        });
    }

    col.splice(idx, 1);
    if (entityType === 'salesUp') DB.consumptionLedger = DB.consumptionLedger.filter(x => x.uploadRef !== id);
    audit('VOID', entityType, id, { reason: reason || '' });
    saveData();
    return true;
}
async function restoreVoided(voidId){
    const v = DB.voidedRecords.find(x => x.id === voidId);
    if (!v) return;
    const reg = ENTITIES[v.entityType];
    if (!reg) return;

    const restored = JSON.parse(JSON.stringify(v.snapshot));
    const collision = DB[reg.key].find(x => x.id === restored.id);
    if (collision) {
        toast('Cannot restore — ID already exists', 'error');
        return;
    }

    if (CLOUD_MODE === 'supabase') {
        try {
            if (v.entityType === 'bom') {
                const { lines, ...header } = restored;
                const { error: e1 } = await SB.from('bom').insert({
                    id: header.id, product_id: header.productId, product_name: header.productName,
                    cat: header.cat, version: header.version, effective: header.effective, status: header.status
                });
                if (e1) throw e1;
                if (lines?.length) {
                    const { error: e2 } = await SB.from('bom_lines').insert(lines.map(l => ({
                        bom_id: header.id, item_id: l.itemId, item_code: l.itemCode,
                        item_name: l.itemName, qty: l.qty, uom: l.uom
                    })));
                    if (e2) throw e2;
                }
            } else if (v.entityType === 'journal') {
                const { lines, ...header } = restored;
                const { error: e1 } = await SB.from('journals').insert({
                    id: header.id, type: 'daily', date: header.date, month: header.month,
                    store_id: header.storeId, by_id: header.byId, by_name: header.byName, status: header.status
                });
                if (e1) throw e1;
                if (lines?.length) {
                    const { error: e2 } = await SB.from('journal_lines').insert(lines.map(l => ({
                        journal_id: header.id, journal_date: header.date, item_id: l.itemId, uom: l.uom,
                        opening: l.opening, purchases: 0, transfers_in: 0, transfers_out: 0,
                        consumption: l.consumption, expected: l.expected, physical: l.physical,
                        variance: l.variance, mtd_purchases: 0, mtd_consumption: l.mtdConsumption
                    })));
                    if (e2) throw e2;
                }
               } else if (v.entityType === 'store') {
                await SB.from('stores').insert({
                    id: restored.id, code: restored.code, name: restored.name, area: restored.area,
                    type: restored.type, store_manager_name: restored.storeManagerName,
                    area_manager_name: restored.areaManagerName,
                    operation_manager_name: restored.operationManagerName, status: restored.status
                });
            } else if (v.entityType === 'item') {
                await SB.from('items').insert({
                    id: restored.id, code: restored.code, name: restored.name, cat: restored.cat,
                    uom: restored.uom, cost: restored.cost, daily: restored.daily,
                    weekly: restored.weekly, monthly: restored.monthly, status: restored.status
                });
            } else if (v.entityType === 'employee') {
                await SB.from('employees').insert({
                    id: restored.id, code: restored.code, name: restored.name, role: restored.role, status: restored.status
                });
            } else if (v.entityType === 'salesUp') {
                toast('Sales upload restore not yet supported', 'error');
                return;
            }

            await SB.from('voided_records').delete().eq('id', voidId);
        } catch(err) {
            toast('Restore failed: ' + (err.message || err), 'error');
            return;
        }
    }

    DB[reg.key].push(restored);
    DB.voidedRecords = DB.voidedRecords.filter(x => x.id !== voidId);
    audit('RESTORE', v.entityType, v.originalId, {});
    saveData();
    toast('Restored', 'success');
}
async function purgeVoided(voidId){

function requestDelete(entityType, id){
    if (!can('deleteRecord')) { toast('Admin only.', 'error'); return; }
    const reg = ENTITIES[entityType];
    if (!reg) return;
    const record = DB[reg.key].find(x => x.id === id);
    if (!record) { toast('Not found', 'error'); return; }
    const label = record[reg.nameField] || id;
    const blockers = getDeleteBlockers(entityType, id);
    let bodyHTML = `
        <div style="background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:14px;margin-bottom:16px">
            <div style="font-weight:bold;color:#b91c1c;margin-bottom:6px">⚠ About to void:</div>
            <div style="font-size:14px"><b>${esc(reg.label)}:</b> ${esc(label)}</div>
            <div style="font-size:12px;color:#6b7280;margin-top:4px">ID: ${esc(id)}</div>
        </div>`;
    if (blockers.length > 0) {
        bodyHTML += `<div class="dep-warning">
            <div style="font-weight:bold;margin-bottom:6px">🚫 Cannot delete — dependencies found:</div>
            <div class="dep-list">${blockers.map(b => `<div><b>${esc(b.type)}</b> (${b.count}) — ${b.preview.map(esc).join(', ')}${b.count > b.preview.length ? '…' : ''}</div>`).join('')}</div>
        </div>`;
        openModal('Delete Blocked', bodyHTML, `<button class="btn-light" onclick="closeModal()">Close</button>`);
        return;
    }
    bodyHTML += `
        <div class="form-row"><label>Reason (optional)</label><textarea id="deleteReason"></textarea></div>
        <p style="font-size:12px;color:#6b7280">Soft delete. Restorable from Recycle Bin.</p>`;
    openModal('Confirm Deletion', bodyHTML, `
        <button class="btn-light" onclick="closeModal()">Cancel</button>
        <button class="btn-danger" onclick="confirmDelete('${entityType}','${id}')">Yes, Void It</button>`);
}

async function doLogin(){
    const err = document.getElementById('loginError');
    const btn = document.querySelector('.login-btn');
    const oldBtnText = btn.textContent;
    try {
        const uname = document.getElementById('loginUser').value.trim().toLowerCase();
        const pass  = document.getElementById('loginPass').value;

        err.style.display = 'none';
        btn.disabled = true;
        btn.textContent = 'Signing in...';

        if (CLOUD_MODE === 'supabase') {
            const email = uname.includes('@') ? uname : (uname + '@drcafe.com');
            const { data, error } = await SB.auth.signInWithPassword({ email, password: pass });
            if (error) {
                err.textContent = 'Invalid email or password.';
                err.style.display = 'block';
                btn.disabled = false;
                btn.textContent = oldBtnText;
                return;
            }

            // Show app shell immediately with loading state
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('appScreen').style.display = 'block';
            document.getElementById('pageContainer').innerHTML = `
                <div class="loading-block">
                    <div class="spinner"></div>
                    <p style="margin-top:14px">Loading your data...</p>
                </div>`;
            document.getElementById('userName').textContent = 'Loading...';
            document.getElementById('userRole').textContent = '';
            document.getElementById('userAvatar').textContent = '⏳';

            // Now load the data in the background
            DB = await loadData();
            const { data: { user: authUser } } = await SB.auth.getUser();
            window._cloudMe = authUser ? (DB.users.find(u => u.id === authUser.id) || null) : null;

            if (!window._cloudMe) {
                // Auth passed but no profile — logout
                err.textContent = 'No profile found for your account. Contact an Admin.';
                err.style.display = 'block';
                await SB.auth.signOut();
                document.getElementById('loginScreen').style.display = 'flex';
                document.getElementById('appScreen').style.display = 'none';
                btn.disabled = false;
                btn.textContent = oldBtnText;
                return;
            }

            await bootApp();
            btn.disabled = false;
            btn.textContent = oldBtnText;
            return;
        }

        // Local mode (unused when CLOUD_MODE='supabase')
        const user = DB.users.find(u => u.username===uname && u.pass===pass && u.active);
        if (!user) { err.textContent = 'Invalid username or password.'; err.style.display='block'; btn.disabled = false; btn.textContent = oldBtnText; return; }
        setSession(uname);
        await bootApp();
        btn.disabled = false;
        btn.textContent = oldBtnText;
    } catch(e) {
        err.textContent = 'Error: ' + e.message;
        err.style.display = 'block';
        btn.disabled = false;
        btn.textContent = oldBtnText;
    }
}
async function doLogout(){
    if (CLOUD_MODE === 'supabase') {
        try { await SB.auth.signOut(); } catch(e) {}
    }
    clearSession();
    location.reload();
}

async function bootApp(){
    if (CLOUD_MODE === 'supabase') {
        const { data: { session } } = await SB.auth.getSession();
        if (!session) {
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('appScreen').style.display = 'none';
            return;
        }
        // If DB already loaded by doLogin, skip re-fetch
        if (!DB || !DB.users || DB.users.length === 0) {
            DB = await loadData();
        }
        const { data: { user: authUser } } = await SB.auth.getUser();
        window._cloudMe = authUser ? (DB.users.find(u => u.id === authUser.id) || null) : null;
    }

    const u = currentUser();
    if (!u) {
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('appScreen').style.display = 'none';
        return;
    }

    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appScreen').style.display = 'block';
    document.getElementById('userName').textContent = u.name;
    document.getElementById('userRole').textContent = ROLE_LABEL[u.role] || u.role;

/* ---------- MONTH UTILS ---------- */
function monthIndexFromTag(tag){
    if (!tag) return -1;
    const parts = tag.split(' ');
    const m = MONTHS.indexOf(parts[0]);
    const y = parseInt(parts[1], 10);
    if (m < 0 || isNaN(y)) return -1;
    return y * 12 + m;
}
function monthTagFromIndex(idx){ return `${MONTHS[idx % 12]} ${Math.floor(idx/12)}`; }
function monthTagFromISO(iso){
    const [y,m,d] = iso.split('-').map(x=>parseInt(x,10));
    if (isNaN(y) || isNaN(m)) return '';
    return `${MONTHS[m-1]} ${y}`;
}
function nextMonthTag(tag){ const idx = monthIndexFromTag(tag); return idx < 0 ? '' : monthTagFromIndex(idx + 1); }
function getCurrentMonthTag(){ const d = new Date(); return `${MONTHS[d.getMonth()]} ${d.getFullYear()}`; }
function monthStartISO(tag){ const idx = monthIndexFromTag(tag), y = Math.floor(idx/12), m = idx%12; return new Date(y, m, 1).toISOString(); }
function monthEndISO(tag){ const idx = monthIndexFromTag(tag), y = Math.floor(idx/12), m = idx%12; return new Date(y, m+1, 0, 23, 59, 59).toISOString(); }
function getAvailableMonths(){ const now = new Date(); const list = []; for (let i = -2; i <= 2; i++) { const d = new Date(now.getFullYear(), now.getMonth()+i, 1); list.push(`${MONTHS[d.getMonth()]} ${d.getFullYear()}`); } return list; }

/* ---------- MOVEMENT ENGINE (Daily only) ---------- */
function getLastJournalForStore(storeId, beforeISO){
    let list = DB.journals.filter(j => j.storeId === storeId && j.status === 'Submitted');
    if (beforeISO) list = list.filter(j => j.createdAt < beforeISO);
    list.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
    return list[0] || null;
}
function sumConsumptionTagged(storeId, itemId, journal){
    const monthStart = monthStartISO(journal.month).slice(0,10);
    let sum = 0;
    DB.consumptionLedger.forEach(c => {
        if (c.storeId !== storeId) return;
        const d = c.date || '';
        if (d < monthStart) return;
        if (d > journal.date) return;
        c.lines.forEach(l => { if (l.itemId === itemId) sum += Number(l.qty)||0; });
    });
    return sum;
}
function sumMTDConsumption(storeId, itemId, journal){
    const monthStart = monthStartISO(journal.month).slice(0,10);
    const monthEnd = monthEndISO(journal.month).slice(0,10);
    let sum = 0;
    DB.consumptionLedger.forEach(c => {
        if (c.storeId !== storeId) return;
        const d = c.date || '';
        if (d < monthStart || d > monthEnd) return;
        c.lines.forEach(l => { if (l.itemId === itemId) sum += Number(l.qty)||0; });
    });
    return sum;
}
/* ══════════════════════════════════════════════════════════════
   NEW v2.0: Build count lines from an audit's own opening snapshot.
   - Opening comes ONLY from the audit's opening upload
   - No carry-forward, no month-opening fallback
   - Item list = union of (opening items) + (items consumed that day)
   - Physical starts blank (null), not zero
   ══════════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════
   Option B v2 — buildCountLines reads consumption from the STAGED
   sales file (IndexedDB) instead of DB.consumptionLedger (empty).
   ══════════════════════════════════════════════════════════════ */
async function buildCountLines(journal){
    const storeId = journal.storeId;
    const auditDate = journal.date;
    const openingLines = journal.openingLines || [];

    // Opening map
    const openingMap = new Map();
    openingLines.forEach(l => {
        openingMap.set(l.itemId, { qty: Number(l.qty) || 0, uom: l.uom });
    });

    // ── Pull consumption from the STAGED sales file ──
    const consumptionMap = new Map();
    let stagedSales = [];
    try {
        stagedSales = await StagedFiles.findAnyOwner(storeId, auditDate, 'sales');
    } catch(e) {
        console.warn('buildCountLines: staged sales lookup failed', e);
    }
        console.log('[buildCountLines] storeId=', storeId, 'date=', auditDate,
                'staged entries:', stagedSales.length);
    // Safety: only use the most recent staged entry so duplicates never accumulate
    if (stagedSales.length > 1) {
        stagedSales = [stagedSales[stagedSales.length - 1]];
    }
    for (const s of stagedSales) {
        const ledger = s.payload?.ledgerRec;
        if (!ledger || !Array.isArray(ledger.lines)) continue;
        ledger.lines.forEach(l => {
            const prev = consumptionMap.get(l.itemId) || 0;
            consumptionMap.set(l.itemId, prev + (Number(l.qty) || 0));
        });
    }

    // Union of both sets
    const allItemIds = new Set([...openingMap.keys(), ...consumptionMap.keys()]);

    const lines = [];
    allItemIds.forEach(itemId => {
        const item = getItem(itemId);
        if (!item || item.status !== 'Active') return;

        const openRec = openingMap.get(itemId);
        const opening = openRec ? openRec.qty : 0;
        const consumption = consumptionMap.get(itemId) || 0;
        const expected = opening - consumption;
        const uom = openRec?.uom || item.uom;

            lines.push({
            itemId,
            itemCode: item.code,
            itemName: item.name,
            uom,
            opening,
            received: 0,
            purchases: 0,
            transfersIn: 0, transfersOut: 0,
            consumption,
            expected,
            physical: null,
            variance: 0,
            mtdPurchases: 0,
            mtdTransfersIn: 0, mtdTransfersOut: 0,
            mtdConsumption: consumption,
            store_remark: '',
            store_remark_by: null,
            store_remark_at: null
        });
    });

    lines.sort((a, b) => {
        const ia = getItem(a.itemId), ib = getItem(b.itemId);
        return String(ia?.code || '').localeCompare(String(ib?.code || ''));
    });

    return { lines, openingSource: { source: 'audit-opening-upload', count: openingLines.length } };
}

async function saveEmployee(editId){
    const code = document.getElementById('eCode').value.trim();
    const name = document.getElementById('eName').value.trim();
    const role = document.getElementById('eRole').value;
    if (!code || !name || !role) { toast('Code, Name, and Role required', 'error'); return; }
    const dupCode = DB.employees.find(e => norm(e.code) === norm(code) && e.id !== editId);
    if (dupCode) { toast('Employee code already exists', 'error'); return; }
    const dupName = DB.employees.find(e => norm(e.name) === norm(name) && e.id !== editId);
    if (dupName) { toast('Employee name already exists', 'error'); return; }

    if (editId) {
        const e = getEmployee(editId);
        if (!e) { toast('Not found', 'error'); return; }
        const oldName = e.name;
        e.code = code; e.name = name; e.role = role;
        try { await DataLayer.updateEmployee(e.id, e); }
        catch(err) { toast('Save failed: ' + (err.message || err), 'error'); return; }

        if (oldName !== name) {
            for (const s of DB.stores) {
                let changed = false;
                if (norm(s.storeManagerName) === norm(oldName)) { s.storeManagerName = name; changed = true; }
                if (norm(s.areaManagerName) === norm(oldName)) { s.areaManagerName = name; changed = true; }
                if (norm(s.operationManagerName) === norm(oldName)) { s.operationManagerName = name; changed = true; }
                if (changed) { try { await DataLayer.updateStore(s.id, s); } catch(e) {} }
            }
        }
        audit('UPDATE','employee',e.id,{ code, name, role });
        closeModal(); toast('Employee updated', 'success');
    } else {
        const rec = { id: uid('emp'), code, name, role, status:'Active', createdAt: nowISO() };
        try { await DataLayer.insertEmployee(rec); }
        catch(err) { toast('Save failed: ' + (err.message || err), 'error'); return; }
        DB.employees.push(rec);
        audit('CREATE','employee',rec.id,{ code, name, role });
        closeModal(); toast(`Employee "${name}" added`, 'success');
    }
    showPage('employees');
}

async function handleEmpImportFile(evt){
    const file = evt.target.files[0];
    if (!file) return;
    if (!XLSX_READY) { toast('Excel library still loading.', 'error'); evt.target.value=''; return; }
    const reader = new FileReader();
    reader.onload = function(e){
        try {
            const data = new Uint8Array(e.target.result);
            const wb = XLSX.read(data, { type:'array', cellDates: true });
            const sheet = wb.Sheets[wb.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(sheet, { defval:'', raw: true });
            parseEmpImport(rows, file.name);
        } catch(err) { toast('Parse failed: ' + err.message, 'error'); }
    };
    reader.readAsArrayBuffer(file);
    evt.target.value = '';
}
function parseEmpImport(rows, filename){
    if (rows.length === 0) { toast('File is empty', 'error'); return; }
    const H = {
        code: ['id.no','id no','idno','id','code','employee code','emp code','empcode','employee id','empid'],
        name: ['name','employee name','emp name','empname','full name','fullname'],
        role: ['designation','role','job title','jobtitle','title','position']
    };
    function pick(obj, keys){
        for (const k of Object.keys(obj)) {
            const n = k.toLowerCase().trim().replace(/\s+/g,' ');
            if (keys.includes(n)) return obj[k];
        }
        return undefined;
    }
    function cleanName(s){ return String(s || '').trim().replace(/\s+/g, ' ').replace(/\.+$/, ''); }
    const allowedRoles = EMPLOYEE_ROLES.map(r => r.toLowerCase());
    const valid = [], warnings = [], errors = [];
    const seenCodes = new Set();

    rows.forEach((row, i) => {
        const lineNo = i + 2;
        const codeRaw = String(pick(row, H.code) || '').trim();
        const nameRaw = cleanName(pick(row, H.name));
        const roleRaw = String(pick(row, H.role) || '').trim();
        if (!codeRaw && !nameRaw && !roleRaw) return;
        if (!codeRaw) { errors.push({ line: lineNo, msg: 'Missing ID.NO / Code' }); return; }
        if (!nameRaw) { errors.push({ line: lineNo, msg: `Code "${codeRaw}": missing NAME` }); return; }
        if (!roleRaw) { errors.push({ line: lineNo, msg: `Code "${codeRaw}": missing Designation` }); return; }
        const roleIdx = allowedRoles.indexOf(roleRaw.toLowerCase());
        if (roleIdx < 0) { errors.push({ line: lineNo, msg: `Code "${codeRaw}": invalid Designation "${roleRaw}"` }); return; }
        const role = EMPLOYEE_ROLES[roleIdx];
        const code = codeRaw.replace(/[^a-zA-Z0-9._-]/g, '');
        if (code !== codeRaw) warnings.push({ line: lineNo, msg: `Code "${codeRaw}" cleaned to "${code}"` });
        if (seenCodes.has(code.toLowerCase())) { errors.push({ line: lineNo, msg: `Duplicate Code "${code}"` }); return; }
        seenCodes.add(code.toLowerCase());
        valid.push({ code, name: nameRaw, role });
    });
    _empImportParsed = { valid, warnings, errors, filename };
    const preview = document.getElementById('empImpPreview');
    const sample = valid.slice(0, 12);
    preview.innerHTML = `
        <div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:6px;padding:10px 12px;font-size:13px;margin-bottom:10px">
            <b>File:</b> ${esc(filename)} · <span class="green"><b>${valid.length}</b> valid</span>
            ${warnings.length > 0 ? ` · <span class="orange"><b>${warnings.length}</b> warnings</span>` : ''}
            ${errors.length > 0 ? ` · <span class="red"><b>${errors.length}</b> errors</span>` : ''}
        </div>
        ${sample.length > 0 ? `
        <div style="max-height:280px;overflow-y:auto;border:1px solid #e5e7eb;border-radius:6px">
            <table style="font-size:12px"><thead><tr><th>Code</th><th>Name</th><th>Role</th></tr></thead>
            <tbody>${sample.map(r => `<tr><td>${esc(r.code)}</td><td>${esc(r.name)}</td><td>${esc(r.role)}</td></tr>`).join('')}</tbody></table>
        </div>` : ''}
        ${errors.length > 0 ? `<div style="margin-top:10px;background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:10px;font-size:12px;max-height:180px;overflow-y:auto">
            <b style="color:#b91c1c">Errors:</b>${errors.slice(0, 30).map(e => `<div>Line ${e.line}: ${esc(e.msg)}</div>`).join('')}</div>` : ''}
    `;
    const btn = document.getElementById('empImpConfirmBtn');
    if (btn) btn.disabled = valid.length === 0;
}
async function confirmEmpImport(){
    if (!_empImportParsed) { toast('No file loaded', 'error'); return; }
    const { valid } = _empImportParsed;
    if (valid.length === 0) { toast('No valid rows', 'error'); return; }
    const mode = document.getElementById('empImpMode').value;
    if (mode === 'replace') {
        if (!confirm(`⚠ REPLACE ALL: DELETE all ${DB.employees.length} employees then import ${valid.length}?`)) return;
        if (!confirm('This cannot be undone. Really proceed?')) return;
    }
    const btn = document.getElementById('empImpConfirmBtn');
    btn.disabled = true; btn.textContent = 'Importing…';
    try {
        const byCode = new Map();
        DB.employees.forEach(e => byCode.set(String(e.code).trim().toLowerCase(), e));
        if (mode === 'replace') {
            if (CLOUD_MODE === 'supabase') {
                const { error } = await SB.from('employees').delete().neq('id', '00000000-0000-0000-0000-000000000000');
                if (error) throw error;
            }
            DB.employees = [];
            byCode.clear();
        }
        let inserted = 0, updated = 0, skipped = 0, failed = 0;
        for (let i = 0; i < valid.length; i++) {
            const r = valid[i];
            btn.textContent = `Importing ${i + 1} / ${valid.length}…`;
            const key = r.code.trim().toLowerCase();
            const existing = byCode.get(key);
            if (mode === 'add' && existing) { skipped++; continue; }
            if (existing) {
                try {
                    if (CLOUD_MODE === 'supabase') {
                        const { error } = await SB.from('employees').update({ code: r.code, name: r.name, role: r.role }).eq('id', existing.id);
                        if (error) throw error;
                    }
                    existing.code = r.code; existing.name = r.name; existing.role = r.role;
                    updated++;
                } catch(err) { failed++; }
            } else {
                const rec = { id: uid('emp'), code: r.code, name: r.name, role: r.role, status: 'Active', createdAt: nowISO() };
                try { await DataLayer.insertEmployee(rec); DB.employees.push(rec); byCode.set(key, rec); inserted++; }
                catch(err) { failed++; }
            }
        }
        _empImportParsed = null;
        closeModal();
        toast(`Imported ${inserted} new + ${updated} updated${failed > 0 ? `, ${failed} failed` : ''}`, failed > 0 ? 'error' : 'success');
        showPage('employees');
    } catch(err) {
        btn.disabled = false; btn.textContent = 'Import';
        toast('Import failed: ' + (err.message || err), 'error');
    }
}

async function saveStore(editId){
    const code = document.getElementById('mSCode').value.trim();
    const name = document.getElementById('mSName').value.trim();
    const area = document.getElementById('mSArea').value.trim() || 'Unassigned';
    const type = document.getElementById('mSType').value;
    const storeManagerName = document.getElementById('mSStoreMgr').value;
    const areaManagerName = document.getElementById('mSAreaMgr').value;
    const operationManagerName = document.getElementById('mSOpMgr').value;
    if (!code || !name) { toast('Code and Name required', 'error'); return; }
    const dup = DB.stores.find(s => norm(s.code) === norm(code) && s.id !== editId);
    if (dup) { toast('Store code exists', 'error'); return; }
    if (editId) {
        const s = getStore(editId);
        if (!s) { toast('Not found', 'error'); return; }
        s.code = code; s.name = name; s.area = area; s.type = type;
        s.storeManagerName = storeManagerName;
        s.areaManagerName = areaManagerName;
        s.operationManagerName = operationManagerName;
        try { await DataLayer.updateStore(s.id, s); }
        catch(err) { toast('Save failed: ' + (err.message || err), 'error'); return; }
        audit('UPDATE','store',s.id,{ code, name });
        closeModal(); toast('Store updated', 'success');
    } else {
        const id = 's-' + code;
        if (getStore(id)) { toast('Store ID collision', 'error'); return; }
        const rec = { id, code, name, area, type, storeManagerName, areaManagerName, operationManagerName, status:'Active', createdAt: nowISO() };
        try { await DataLayer.insertStore(rec); }
        catch(err) { toast('Save failed: ' + (err.message || err), 'error'); return; }
        DB.stores.push(rec);
        audit('CREATE','store',id,{ code, name });
        closeModal(); toast('Store added', 'success');
    }
    showPage('stores');
}
let _storeImportParsed = null;

async function handleStoreImportFile(evt){
    const file = evt.target.files[0];
    if (!file) return;
    if (!XLSX_READY) { toast('Excel library still loading.', 'error'); evt.target.value=''; return; }
    const reader = new FileReader();
    reader.onload = function(e){
        try {
            const data = new Uint8Array(e.target.result);
            const wb = XLSX.read(data, { type:'array', cellDates: true });
            const sheet = wb.Sheets[wb.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(sheet, { defval:'', raw: true });
            parseStoreImport(rows, file.name);
        } catch(err) { toast('Parse failed: ' + err.message, 'error'); }
    };
    reader.readAsArrayBuffer(file);
    evt.target.value = '';
}
function _cleanName(s){ return String(s || '').trim().replace(/\s+/g, ' ').replace(/\.+$/, ''); }
function parseStoreImport(rows, filename){
    if (rows.length === 0) { toast('File is empty', 'error'); return; }
    const H = {
        code: ['store number','storenumber','store no','storeno','store code','storecode','code','branch','branch code'],
        name: ['store name','storename','name','branch name'],
        area: ['area','region','zone'],
        type: ['type','store type','storetype'],
        sm:   ['store manager','storemanager','sm'],
        am:   ['area manager','areamanager','am'],
        om:   ['operation manager','operationmanager','om','operations manager']
    };
    function pick(obj, keys){
        for (const k of Object.keys(obj)) {
            const n = k.toLowerCase().trim().replace(/\s+/g,' ');
            if (keys.includes(n)) return obj[k];
        }
        return undefined;
    }
    const empNames = new Set();
    DB.employees.forEach(e => empNames.add(norm(_cleanName(e.name))));
    const valid = [], warnings = [], errors = [];
    const seenCodes = new Set();
    rows.forEach((row, i) => {
        const lineNo = i + 2;
        const codeRaw = String(pick(row, H.code) || '').trim();
        const nameRaw = _cleanName(pick(row, H.name));
        const areaRaw = String(pick(row, H.area) || '').trim();
        const typeRaw = String(pick(row, H.type) || '').trim();
        const smRaw   = _cleanName(pick(row, H.sm));
        const amRaw   = _cleanName(pick(row, H.am));
        const omRaw   = _cleanName(pick(row, H.om));
        if (!codeRaw && !nameRaw && !smRaw && !amRaw && !omRaw) return;
        if (!codeRaw) { errors.push({ line: lineNo, msg: 'Missing Store Number' }); return; }
        const code = codeRaw.replace(/[^a-zA-Z0-9._-]/g, '');
        if (code !== codeRaw) warnings.push({ line: lineNo, msg: `Code "${codeRaw}" cleaned to "${code}"` });
        if (seenCodes.has(code.toLowerCase())) { errors.push({ line: lineNo, msg: `Duplicate Store Number "${code}"` }); return; }
        seenCodes.add(code.toLowerCase());
        if (smRaw && !empNames.has(norm(smRaw))) warnings.push({ line: lineNo, msg: `Store Manager "${smRaw}" not in Employee Master` });
        if (amRaw && !empNames.has(norm(amRaw))) warnings.push({ line: lineNo, msg: `Area Manager "${amRaw}" not in Employee Master` });
        if (omRaw && !empNames.has(norm(omRaw))) warnings.push({ line: lineNo, msg: `Operation Manager "${omRaw}" not in Employee Master` });
        valid.push({
            id: 's-' + code, code,
            name: nameRaw || code,
            area: areaRaw || 'Unassigned',
            type: typeRaw || 'Drive Thru',
            storeManagerName: smRaw,
            areaManagerName: amRaw,
            operationManagerName: omRaw,
            status: 'Active'
        });
    });
    _storeImportParsed = { valid, warnings, errors, filename };
    const preview = document.getElementById('storeImpPreview');
    const sample = valid.slice(0, 12);
    preview.innerHTML = `
        <div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:6px;padding:10px 12px;font-size:13px;margin-bottom:10px">
            <b>File:</b> ${esc(filename)} · <span class="green"><b>${valid.length}</b> valid</span>
            ${warnings.length > 0 ? ` · <span class="orange">${warnings.length} warnings</span>` : ''}
            ${errors.length > 0 ? ` · <span class="red">${errors.length} errors</span>` : ''}
        </div>
        ${sample.length > 0 ? `<div style="max-height:280px;overflow-y:auto;border:1px solid #e5e7eb;border-radius:6px">
            <table style="font-size:12px"><thead><tr><th>Code</th><th>Name</th><th>Store Mgr</th><th>Area Mgr</th><th>Op Mgr</th></tr></thead>
            <tbody>${sample.map(r => `<tr><td><b>${esc(r.code)}</b></td><td>${esc(r.name)}</td><td>${esc(r.storeManagerName || '—')}</td><td>${esc(r.areaManagerName || '—')}</td><td>${esc(r.operationManagerName || '—')}</td></tr>`).join('')}</tbody></table>
        </div>` : ''}
        ${errors.length > 0 ? `<div style="margin-top:10px;background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:10px;font-size:12px;max-height:180px;overflow-y:auto">
            <b style="color:#b91c1c">Errors:</b>${errors.slice(0, 30).map(e => `<div>Line ${e.line}: ${esc(e.msg)}</div>`).join('')}</div>` : ''}
    `;
    const btn = document.getElementById('storeImpConfirmBtn');
    if (btn) btn.disabled = valid.length === 0;
}
async function confirmStoreImport(){
    if (!_storeImportParsed) { toast('No file loaded', 'error'); return; }
    const { valid } = _storeImportParsed;
    if (valid.length === 0) { toast('No valid rows', 'error'); return; }
    const mode = document.getElementById('storeImpMode').value;
    if (mode === 'replace') {
        if (!confirm(`⚠ REPLACE ALL: DELETE all ${DB.stores.length} stores then import ${valid.length}?`)) return;
        if (!confirm('This cannot be undone. Really proceed?')) return;
    }
    const btn = document.getElementById('storeImpConfirmBtn');
    btn.disabled = true; btn.textContent = 'Importing…';
    try {
        const byCode = new Map();
        DB.stores.forEach(s => byCode.set(String(s.code).trim().toLowerCase(), s));
        if (mode === 'replace') {
            if (CLOUD_MODE === 'supabase') {
                const { error } = await SB.from('stores').delete().neq('id', '00000000-0000-0000-0000-000000000000');
                if (error) throw error;
            }
            DB.stores = [];
            byCode.clear();
        }
        let inserted = 0, updated = 0, skipped = 0, failed = 0;
        for (let i = 0; i < valid.length; i++) {
            const r = valid[i];
            btn.textContent = `Importing ${i + 1} / ${valid.length}…`;
            const key = r.code.trim().toLowerCase();
            const existing = byCode.get(key);
            if (mode === 'add' && existing) { skipped++; continue; }
            if (existing) {
                try {
                    if (CLOUD_MODE === 'supabase') {
                        const { error } = await SB.from('stores').update({
                            code: r.code, name: r.name, area: r.area, type: r.type,
                            store_manager_name: r.storeManagerName || null,
                            area_manager_name: r.areaManagerName || null,
                            operation_manager_name: r.operationManagerName || null
                        }).eq('id', existing.id);
                        if (error) throw error;
                    }
                    Object.assign(existing, r);
                    updated++;
                } catch(err) { failed++; }
            } else {
                const rec = { ...r, createdAt: nowISO() };
                try { await DataLayer.insertStore(rec); DB.stores.push(rec); byCode.set(key, rec); inserted++; }
                catch(err) { failed++; }
            }
        }
        _storeImportParsed = null;
        closeModal();
        toast(`Imported ${inserted} new + ${updated} updated${failed > 0 ? `, ${failed} failed` : ''}`, failed > 0 ? 'error' : 'success');
        showPage('stores');
    } catch(err) {
        btn.disabled = false; btn.textContent = 'Import';
        toast('Import failed: ' + (err.message || err), 'error');
    }
}

let _bulkUsersPlan = null;
function _slugifyFirstName(n){ return String(n||'').trim().split(/\s+/)[0].toLowerCase().replace(/[^a-z0-9]/g, ''); }
function _initials(n){ return String(n||'').trim().split(/\s+/).map(x => x[0] || '').join('').slice(0,2).toUpperCase(); }

function buildBulkUsersPlan(){
    const plan = { storeManagers: [], areaManagers: [], opManagers: [], skipped: [], warnings: [] };
    const existingUsernames = new Set(DB.users.map(u => String(u.username || '').toLowerCase()));

    DB.stores.forEach(s => {
        const name = (s.storeManagerName || '').trim();
        if (!name) { plan.warnings.push({ store: s.code, msg: `Store ${s.code} has no Store Manager` }); return; }
        const base = String(s.code || '').toLowerCase().replace(/[^a-z0-9]/g,'');
        const username = base + '@drcafe.com';
        if (existingUsernames.has(username.toLowerCase())) { plan.skipped.push({ name, username, role: 'Store Manager' }); return; }
        existingUsernames.add(username.toLowerCase());
        plan.storeManagers.push({ name, username, role: 'store', roleLabel: 'Store Manager', storeId: 's-' + s.code, storeCode: s.code, initials: _initials(name) });
    });

    const seenArea = new Set();
    DB.stores.forEach(s => {
        const name = (s.areaManagerName || '').trim();
        if (!name || seenArea.has(norm(name))) return;
        seenArea.add(norm(name));
        const base = _slugifyFirstName(name);
        if (!base) return;
        const username = base + '@drcafe.com';
        if (existingUsernames.has(username.toLowerCase())) { plan.skipped.push({ name, username, role: 'Area Manager' }); return; }
        existingUsernames.add(username.toLowerCase());
        plan.areaManagers.push({ name, username, role: 'area', roleLabel: 'Area Manager', storeId: null, initials: _initials(name) });
    });

    const seenOp = new Set();
    DB.stores.forEach(s => {
        const name = (s.operationManagerName || '').trim();
        if (!name || seenOp.has(norm(name))) return;
        seenOp.add(norm(name));
        const base = _slugifyFirstName(name);
        if (!base) return;
        const username = base + '@drcafe.com';
        if (existingUsernames.has(username.toLowerCase())) { plan.skipped.push({ name, username, role: 'Operation Manager' }); return; }
        existingUsernames.add(username.toLowerCase());
        plan.opManagers.push({ name, username, role: 'opmanager', roleLabel: 'Operation Manager', storeId: null, initials: _initials(name) });
    });
    return plan;
}

async function handleItemImportFile(evt){
    const file = evt.target.files[0];
    if (!file) return;
    if (!XLSX_READY) { toast('Excel library still loading.', 'error'); evt.target.value=''; return; }
    const reader = new FileReader();
    reader.onload = function(e){
        try {
            const data = new Uint8Array(e.target.result);
            const wb = XLSX.read(data, { type:'array', cellDates: true });
            const sheet = wb.Sheets[wb.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(sheet, { defval:'', raw: true });
            parseItemImport(rows, file.name);
        } catch(err) { toast('Parse failed: ' + err.message, 'error'); }
    };
    reader.readAsArrayBuffer(file);
    evt.target.value = '';
}
function parseItemImport(rows, filename){
    if (rows.length === 0) { toast('File is empty', 'error'); return; }
    const H = {
        code:     ['code','item code','itemcode','item_code','sku'],
        name:     ['name','item name','itemname','item_name','description'],
        cat:      ['category','cat','category name','group'],
        uom:      ['uom','unit','unit of measure'],
        cost:     ['cost','unit cost','price','cost price'],
        daily:    ['d','daily','is_daily','daily flag']
    };
    function pick(obj, keys){
        for (const k of Object.keys(obj)) {
            if (keys.includes(k.toLowerCase().trim().replace(/\s+/g,' '))) return obj[k];
        }
        return undefined;
    }
    function toBool(v, def){
        if (v === undefined || v === null || v === '') return def;
        const s = String(v).toLowerCase().trim();
        if (['y','yes','1','true','t'].includes(s)) return true;
        if (['n','no','0','false','f'].includes(s)) return false;
        return def;
    }
    const valid = [], warnings = [], errors = [];
    const seenCodes = new Set();
    rows.forEach((row, i) => {
        const lineNo = i + 2;
        const codeRaw = String(pick(row, H.code) || '').trim();
        const nameRaw = String(pick(row, H.name) || '').trim();
        if (!codeRaw && !nameRaw) return;
        if (!codeRaw) { errors.push({ line: lineNo, msg: 'Missing Code' }); return; }
        if (!nameRaw) { errors.push({ line: lineNo, msg: 'Missing Name' }); return; }
        const code = codeRaw.replace(/[^a-zA-Z0-9._-]/g, '');
        if (code !== codeRaw) warnings.push({ line: lineNo, msg: `Code cleaned to "${code}"` });
        if (seenCodes.has(code)) { errors.push({ line: lineNo, msg: `Duplicate Code "${code}"` }); return; }
        seenCodes.add(code);
        const cat = String(pick(row, H.cat) || '').trim() || 'Uncategorized';
        const uom = String(pick(row, H.uom) || '').trim() || 'Pcs';
        const cost = Number(pick(row, H.cost)) || 0;
        const daily = toBool(pick(row, H.daily), true);
        const id = 'i-' + code.toLowerCase().replace(/[^a-z0-9]/g, '');
        valid.push({ id, code, name: nameRaw, cat, uom, cost, daily });
    });
    _importParsed = { valid, warnings, errors, filename };
    const sample = valid.slice(0, 8);
    document.getElementById('impPreview').innerHTML = `
        <div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:6px;padding:10px 12px;font-size:13px;margin-bottom:10px">
            <b>File:</b> ${esc(filename)} · <span class="green"><b>${valid.length}</b> valid</span>
            ${warnings.length ? ` · <span class="orange">${warnings.length} warnings</span>` : ''}
            ${errors.length ? ` · <span class="red">${errors.length} errors</span>` : ''}
        </div>
        ${sample.length > 0 ? `<div style="max-height:220px;overflow-y:auto;border:1px solid #e5e7eb;border-radius:6px">
            <table style="font-size:12px"><thead><tr><th>Code</th><th>Name</th><th>Cat</th><th>UOM</th><th>Cost</th><th>Daily</th></tr></thead>
            <tbody>${sample.map(r => `<tr><td>${esc(r.code)}</td><td>${esc(r.name)}</td><td>${esc(r.cat)}</td><td>${esc(r.uom)}</td><td>${fmtNum(r.cost)}</td><td>${r.daily?'✓':'-'}</td></tr>`).join('')}</tbody></table>
        </div>` : ''}
    `;
    const btn = document.getElementById('impConfirmBtn');
    if (btn) btn.disabled = valid.length === 0;
}
async function confirmItemImport(){
    if (!_importParsed) { toast('No file loaded', 'error'); return; }
    const { valid } = _importParsed;
    if (valid.length === 0) { toast('No valid rows', 'error'); return; }
    const mode = document.getElementById('impMode').value;
    if (mode === 'replace') {
        if (!confirm(`⚠ REPLACE ALL: DELETE all ${DB.items.length} items then import ${valid.length}?`)) return;
        if (!confirm('This cannot be undone. Really proceed?')) return;
    }
    const btn = document.getElementById('impConfirmBtn');
    btn.disabled = true; btn.textContent = 'Importing…';
    try {
        if (mode === 'replace') {
            const { error } = await SB.from('items').delete().neq('id', '___never___');
            if (error) throw error;
            DB.items = [];
        }
        const CHUNK = 500;
        let inserted = 0, updated = 0, skipped = 0, failed = 0;
        const existingCodes = new Set(DB.items.map(i => i.code));
        for (let i = 0; i < valid.length; i += CHUNK) {
            const chunk = valid.slice(i, i + CHUNK);
            btn.textContent = `Importing ${Math.min(i + CHUNK, valid.length)} / ${valid.length}…`;
            if (mode === 'add') {
                const toInsert = chunk.filter(r => !existingCodes.has(r.code));
                skipped += chunk.length - toInsert.length;
                if (toInsert.length === 0) continue;
                const rows = toInsert.map(r => ({
                    id: r.id, code: r.code, name: r.name, cat: r.cat, uom: r.uom,
                    cost: r.cost, daily: r.daily, weekly: false, monthly: false,
                    status: 'Active'
                }));
                const { error } = await SB.from('items').insert(rows);
                if (error) { failed += toInsert.length; }
                else {
                    inserted += toInsert.length;
                    toInsert.forEach(r => { DB.items.push({ ...r, createdAt: nowISO() }); existingCodes.add(r.code); });
                }
            } else {
                const rows = chunk.map(r => ({
                    id: r.id, code: r.code, name: r.name, cat: r.cat, uom: r.uom,
                    cost: r.cost, daily: r.daily, weekly: false, monthly: false,
                    status: 'Active'
                }));
                const { error } = await SB.from('items').upsert(rows, { onConflict: 'id' });
                if (error) { failed += rows.length; }
                else {
                    updated += rows.length;
                    rows.forEach(r => {
                        const idx = DB.items.findIndex(x => x.id === r.id);
                        if (idx >= 0) Object.assign(DB.items[idx], r);
                        else DB.items.push({ ...r, createdAt: nowISO() });
                    });
                }
            }
        }
        _importParsed = null;
        closeModal();
        const msg = mode === 'add'
            ? `Added ${inserted} new items${skipped > 0 ? `, skipped ${skipped}` : ''}${failed > 0 ? `, ${failed} failed` : ''}`
            : `Imported ${updated} items${failed > 0 ? `, ${failed} failed` : ''}`;
        toast(msg, failed > 0 ? 'error' : 'success');
        showPage('items');
    } catch(err) {
        btn.disabled = false; btn.textContent = 'Import';
        toast('Import failed: ' + (err.message || err), 'error');
    }
}

    const cat = document.getElementById('mBCat').value;
    const version = Number(document.getElementById('mBVer').value) || 1;

    const lines = window._workingBOMLines.filter(l => l.itemId && l.qty > 0);

    if (!productName) { toast('Product Name required', 'error'); return; }
